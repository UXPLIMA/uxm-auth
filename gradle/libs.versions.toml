# Only what the shared uxm catalog does not carry.

[versions]
adventure = "5.2.0"
velocity = "4.1.1"
limboapi = "2.0.0-20251118.093310-4"
limboapi-one = "1.1.27"
fastutil = "8.5.18"
gson = "2.14.0"
bouncycastle = "1.86"
lettuce = "7.6.0.RELEASE"
maxmind-db = "4.2.0"
zxing = "3.5.4"
mariadb-jdbc = "3.5.3"
postgresql = "42.7.4"
h2 = "2.3.232"
log4j = "2.26.0"
paperweight = "2.0.0-beta.22"

[libraries]
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
limboapi-api = { module = "net.elytrium.limboapi:api", version.ref = "limboapi" }
limboapi-one-api = { module = "net.elytrium.limboapi:api", version.ref = "limboapi-one" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-mini = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventure" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
maxmind-db = { module = "com.maxmind.db:maxmind-db", version.ref = "maxmind-db" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-jdbc" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

[bundles]
adventure = ["adventure-api", "adventure-mini", "adventure-plain", "adventure-legacy"]

[plugins]
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
