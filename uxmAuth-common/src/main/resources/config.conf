# uxmAuth configuration.
#
# Every value here is read on enable and on /uxmauth reload. The plugin swaps in
# the new file as one snapshot, so a reload is never half applied.
#
# When a release adds a key, the next start adds it here with the comment that explains it, and
# it never changes a value you wrote. The file as it was is kept beside this one as
# config.conf.bak. What the merge cannot keep is your own formatting: the file is written again
# from what it holds, so alignment inside a block may move. A key you deleted on purpose comes
# back, which is why every switch says here what turning it off means.

# The language a player reads.
#
# The languages this plugin has are the files in messages/. Write one more file and the
# language exists: nothing here lists them, so nothing has to be rebuilt.
language {
  # What a player reads when nothing else answers, and the fallback for a key that a
  # translation has not reached yet.
  default = "en"

  # Whether a player who has chosen nothing reads the language their client is set to.
  # Turn this off to start every player in the default language and let them choose.
  follow-client = true

  # One language for everybody, whatever they chose and whatever their client says.
  # Leave it empty for none. A server with one audience writes its tag here.
  force = ""
}

storage {
  # Where the accounts are kept.
  #
  # The default is a SQLite file in this folder, which needs no setup and is right
  # for one server. Point every server of a network, and the proxy, at one MySQL,
  # MariaDB or PostgreSQL URL and an account is the same account everywhere.
  #
  #   jdbc:sqlite:plugins/uxmAuth/auth.db
  #   jdbc:mysql://127.0.0.1:3306/uxm?useSSL=false
  #   jdbc:mariadb://127.0.0.1:3306/uxm
  #   jdbc:postgresql://127.0.0.1:5432/uxm
  #
  # Leave jdbc-url empty to use the SQLite file in this folder.
  jdbc-url  = ""
  username  = ""
  password  = ""

  # How many connections the pool may open. SQLite has one writer, so more than a few
  # buys nothing there. A shared database wants a few per busy server.
  pool-size = 4
}
