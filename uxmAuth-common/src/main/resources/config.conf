# uxmAuth configuration.
#
# Every value here is read on enable and on /uxmauth reload. The plugin swaps in
# the new file as one snapshot, so a reload is never half applied.
#
# When a release adds a key, the next start adds it here with the comment that explains it, and
# it never changes a value you wrote. The file as it was is kept beside this one as
# config.conf.bak. What the merge cannot keep is your own formatting: the file is written again
# from what it holds, so alignment inside a block may move. A key you deleted on purpose comes
# back, which is why every switch says here what turning it off means.
#
# The proxy half on Velocity reads this same file. It uses the language, storage,
# premium, ownership and network blocks; when players wait in its own world it also uses
# names, passwords, hashing, lane and timeouts, and reads the words for /login and
# /register from commands.conf. The rest does nothing there, so one file can be copied to
# every machine of a network.

# The language a player reads.
#
# The languages this plugin has are the files in messages/. Write one more file and the
# language exists: nothing here lists them, so nothing has to be rebuilt.
language {
  # What a player reads when nothing else answers, and the fallback for a key that a
  # translation has not reached yet.
  default = "en"

  # Whether a player who has chosen nothing reads the language their client is set to.
  # Turn this off to start every player in the default language and let them choose.
  follow-client = true

  # One language for everybody, whatever they chose and whatever their client says.
  # Leave it empty for none. A server with one audience writes its tag here.
  force = ""
}

storage {
  # Where the accounts are kept.
  #
  # The default is a SQLite file in this folder, which needs no setup and is right
  # for one server. Point every server of a network, and the proxy, at one MySQL,
  # MariaDB or PostgreSQL URL and an account is the same account everywhere. The jar
  # carries every driver, so nothing else is installed. MySQL 8 without TLS wants
  # allowPublicKeyRetrieval=true to log in with a password.
  #
  #   jdbc:sqlite:plugins/uxmAuth/auth.db
  #   jdbc:mysql://127.0.0.1:3306/uxm?allowPublicKeyRetrieval=true
  #   jdbc:mariadb://127.0.0.1:3306/uxm
  #   jdbc:postgresql://127.0.0.1:5432/uxm
  #   jdbc:h2:./plugins/uxmAuth/auth-h2
  #
  # Leave jdbc-url empty to use the SQLite file in this folder.
  jdbc-url  = ""
  username  = ""
  password  = ""

  # How many connections the pool may open. SQLite has one writer, so more than a few
  # buys nothing there. A shared database wants a few per busy server.
  pool-size = 4

  # Another database to move every account to, with /uxmauth database move from the
  # console while nobody plays. The target is any URL above, empty of this plugin's
  # tables: a target that holds an account is refused and nothing is written. The
  # website table moves too when website-table is on. Once the copy is done, put these
  # three lines in place of the three above, empty these, and restart.
  move-to {
    jdbc-url = ""
    username = ""
    password = ""
  }
}

names {
  # What a player's name may be. A name that does not fit is refused at the door,
  # before it can hold an account.
  #
  # The pattern is a Java regular expression the whole name must match. The default is
  # the characters Mojang allows.
  pattern    = "[A-Za-z0-9_]+"
  min-length = 3
  max-length = 16

  # Words a name may not contain, in any case. "admin" here refuses "xAdMinx" too.
  blocked = []

  # A name is held once, in the case it was registered in: once Notch has an account,
  # notch is refused with a message naming Notch. A Bedrock name Floodgate vouches for
  # keeps its prefix and its spaces, so only the blocked words apply to it.

  # One connection per name: a second connection under a name already online, or waiting
  # at the dialog, is refused. Turn this on to let it in from the address the first one
  # holds, for a player whose first connection hung. The first one is then sent away.
  reconnect-from-same-address = false
}

passwords {
  # How long a password may be, counted in the characters a player types.
  min-length = 6
  max-length = 64

  # A Java regular expression the whole password must match. The default allows any
  # visible character and refuses spaces.
  allowed = "\\S+"

  # Classes of character every password must hold: lower, upper, digit, symbol.
  # Empty asks for none. Each one you add makes a guessed password less likely.
  required = []

  # Whether /register asks for the password twice. Turning this off means one typo
  # makes an account its owner cannot log into.
  confirm-on-register = true

  # Whether a change asks for the old password. Turning this off lets anybody at a
  # logged-in player's keyboard take the account. Leave it on.
  old-on-change = true

  # How many wrong passwords a player may type before they are kicked. A higher number
  # gives a guesser more tries per connection.
  max-attempts = 3

  # A file of passwords too common to keep, one a line, beside this file. Case does not
  # count, and a line starting with # is a note. The shipped list is a start: add to it, or
  # point this at a longer one. Read again at every reload.
  common-file = "passwords/common.txt"

  # Ask haveibeenpwned whether a new password is known from a breach. Only the first five
  # characters of the password's SHA-1 leave the server, with padding asked for, so the
  # service never learns the password. When the service does not answer, the password is
  # let through. Off by default, because it reaches out to a service you did not choose.
  breach-check = false
}

hashing {
  # The algorithm new passwords are written in: argon2id, bcrypt, pbkdf2 or
  # authme-sha256. Every one of them is read whatever you choose here, and a player who
  # logs in on an older one is moved to this one on the spot.
  #
  # authme-sha256 is weak: a leaked table is cracked quickly on a graphics card. Choose
  # it only for a website that reads nothing else.
  #
  # Everything in this block applies at the next start, not at a reload.
  algorithm = "argon2id"

  # Argon2id. Memory in KiB per hash, passes over it, and lanes. Less memory or fewer
  # passes make every leaked hash cheaper to crack.
  argon2id {
    memory-kib  = 65536
    iterations  = 3
    parallelism = 1
  }

  # BCrypt. Each step up doubles the time. Under 10 is weak. BCrypt reads only the
  # first 72 bytes of a password, so with it passwords.max-length may not pass 72.
  bcrypt {
    cost = 12
  }

  # PBKDF2 with HMAC-SHA256. Fewer iterations make every leaked hash cheaper to crack.
  pbkdf2 {
    iterations = 600000
  }
}

lane {
  # How many hashes run at once. Each Argon2id hash holds its memory while it runs, so
  # max-threads times argon2id.memory-kib is the most this plugin takes for hashing.
  # A change here applies at the next start, not at a reload.
  threads     = 2
  max-threads = 4

  # How many may wait. A login past this is told to try again in a moment rather than
  # left hanging.
  queue = 256
}

hold {
  # What a player who has not logged in yet may not do while they wait in the world.
  # Every switch is its own. Turning one off lets a player who never logs in do that
  # thing on your server.
  movement = true
  chat     = true
  commands = true

  # Commands a waiting player may still run, besides this plugin's own.
  allowed-commands = []

  blocks    = true
  interact  = true
  inventory = true
  damage    = true
  vehicles  = true
  portals   = true
  teleports = true

  # Hide the waiting player from everyone, and everyone from them.
  hide-players = true

  # Blind the waiting player, so the world behind them shows nothing.
  blindness = true

  # Hide their inventory until they log in, and give it back after.
  hide-inventory = true

  # Hide their health, food, flight, speed and operator status until they log in.
  hide-stats = true

  # Hold the server's join message until the player logs in, and show no quit message
  # for a player who leaves without logging in. A player logged in by Mojang or a
  # remembered session is announced as they join.
  join-message-waits = true
}

# Where a player stands around the login.
location {
  # Where a player waits while they log in, when they wait in the world (screens.conf
  # waiting-room frozen). Leave world empty to let them wait where they joined. The login
  # world of screens.conf goes first. After the login every player goes back to where they
  # stood before. A world the server has not loaded keeps them where they joined, and the
  # console says so once.
  login-spot {
    world = ""
    x     = 0.5
    y     = 64
    z     = 0.5
    yaw   = 0
    pitch = 0
  }

  # Move a player who joins inside a solid block or a portal to the nearest safe spot
  # above, so a quit in a wall or a portal never traps them.
  rescue = true

  # How many blocks up that safe spot may be. A spot further up, one past bedrock or a
  # barrier, or one over the world's ceiling (the nether roof) is never taken: the player
  # goes to the world's spawn instead.
  rescue-reach = 6
}

notices {
  # After a login the player reads the date and the masked address of their previous one,
  # so they notice a login that was not theirs.
  last-login = true
}

purge {
  # Remove the accounts nobody logged in to for after-days, with everything kept under
  # them. An account that never logged in counts from its registration. On a network every
  # server writes its logins to the one table, so a login on any of them keeps the account.
  # Off until you turn it on. It looks every check-hours and says what it removed in the
  # console.
  enabled      = false
  after-days   = 180
  keep-premium = true
  check-hours  = 24
}

account {
  # /unregister deletes a player's own account. They type it alone first, then again with
  # their password, or a code from their app when they use one, within this many seconds.
  delete-confirm-seconds = 60
}

bedrock {
  # A Bedrock player Floodgate vouched for through Xbox Live comes in without a password:
  # into their own Bedrock account, made at their first visit, or into the Java account
  # Floodgate linked them to. An unlinked Bedrock player under a Java account's name is
  # still asked for that account's password. Off, every Bedrock player uses a password,
  # through a native form.
  auto-login = true
}

timeouts {
  # How long a player has to register or to log in before they are kicked.
  register-seconds = 90
  login-seconds    = 60

  # How often the reminder repeats while they wait.
  reminder-seconds = 5
}

# What happens at each moment, as a list of lines. Any number of lines, of any kind:
# [message], [actionbar], [title], [subtitle], [bossbar], [sound], [particle],
# [effect], [console], [player]. An @name is a line from the messages folder, so the
# words stay in every language. Write [] for nothing at that moment. A title with a
# subtitle under it is one line: [subtitle] <title> | <subtitle>. %player_name% and
# %player_uuid% are the player's in any line, and %uxmauth_time_left% the seconds a waiting
# player has before the timeout, for a bar that counts down with each reminder:
#   "[bossbar] 5 red | <red>%uxmauth_time_left% seconds to log in"
# A bar with drain after its colour empties over its own seconds. A bar a waiting moment
# puts up comes down at the login or the registration, so one bar on a join moment, as long
# as the timeout, shows the time left by how full it is:
#   "[bossbar] 60 red drain | <red>Log in before the bar runs out"
# Any other %placeholder% is answered by PlaceholderAPI when it is installed.
effects {
  # A player with no account arrives.
  join-unregistered = [
    "[subtitle] @join.register-title | @join.register-subtitle"
  ]

  # A player with an account arrives and has to log in.
  join-registered = [
    "[subtitle] @join.login-title | @join.login-subtitle"
  ]

  # A player who arrives by a remembered session, or a premium name, whose account asks the
  # code of the app before the login is whole.
  join-code = [
    "[subtitle] @join.code-title | @join.code-subtitle"
  ]

  # Repeated while a player has not registered yet.
  reminder-register = [
    "[actionbar] @reminder.register"
  ]

  # Repeated while a player has not logged in yet.
  reminder-login = [
    "[actionbar] @reminder.login"
  ]

  # Repeated while a player who gave the password waits to type the code from the app.
  reminder-code = [
    "[actionbar] @reminder.code"
  ]

  # A wrong password.
  wrong-password = [
    "[sound] block.note_block.bass 0.8 0.6"
  ]

  # A new account was made.
  registered = [
    "[title] @welcome.registered",
    "[sound] block.note_block.chime 0.6 1.2"
  ]

  # A player logged in.
  logged-in = [
    "[title] @welcome.logged-in",
    "[sound] block.note_block.chime 0.6 1.2"
  ]

  # After logged-in, the list of the way the player came in: by the password, as a premium
  # name, from Bedrock, by a remembered session, or let in by staff. A login the proxy of
  # a network vouched for runs only logged-in.
  logged-in-password = []
  logged-in-premium  = []
  logged-in-bedrock  = []
  logged-in-session  = []
  logged-in-forced   = []
  # A player reads that their name went to its paid owner and their account moved to a
  # marked name.
  conflict = []
  # Just before a player who waited too long is kicked.
  timeout = []

  # Just before a player who typed too many wrong passwords is kicked.
  too-many-attempts = []

  # Just before a player whose wrong password banned their address is kicked.
  banned = []

  # A player logged out.
  logged-out = [
    "[sound] block.note_block.hat 0.8 1.0"
  ]

  # A password was changed.
  password-changed = [
    "[sound] block.note_block.chime 0.6 1.2"
  ]

  # Lines for one server of a network only, run after the lists above on the server whose
  # network.server-name is the name here, under the same moment names. The commands after
  # a registration or a login go in registered and logged-in, here or above:
  #   lobby { logged-in = ["[console] give %player_name% compass 1"] }
  # On the proxy, the [console] and [player] lines of registered and logged-in run as
  # proxy commands, once per login however many servers the player visits.
  servers {
  }
}

premium {
  # A premium account with no password gets a random one at its first premium login,
  # shown once to its player only and stored as a hash, so a Mojang outage or a lost
  # Mojang account does not lock them out. See ownership.premium-password-fallback.
  backup-password = true

  # Whether a name belongs to a paid Minecraft account is asked of these sources, in this
  # order. The first one that can say decides; one that is down, slow or refusing passes
  # the name to the next. Leave a source out to never ask it.
  sources = [mojang, playerdb, minetools, ashcon]

  # How long an answer about a name is kept before the web is asked again. An answer no
  # source could give is never kept.
  cache-minutes = 30

  # How many names Mojang is asked about in ten minutes. Mojang refuses past 600, so the
  # cap stays below that and the mirrors answer the rest.
  mojang-cap-per-10-minutes = 550

  # How long one source may take to answer before the next one is asked.
  timeout-millis = 3000

  # Where each source answers. {name} is replaced by the name. Change these only to point
  # at a mirror of your own.
  addresses {
    mojang    = "https://api.mojang.com/users/profiles/minecraft/{name}"
    playerdb  = "https://playerdb.co/api/player/minecraft/{name}"
    minetools = "https://api.minetools.eu/uuid/{name}"
    ashcon    = "https://api.ashcon.app/mojang/v2/user/{name}"
  }
}

ownership {
  # Who owns a name. Four rules:
  #
  #   automatic  A new name that exists at Mojang is asked for the handshake once. A paid
  #              player passes and is in without a password. A player who fails joins with
  #              a password from their next connection, and keeps the name until its paid
  #              owner proves it with /claim or the button on the login screen.
  #   opt-in     Everybody joins with a password. A player who types /premium is asked
  #              for the handshake from their next connection on.
  #   strict     Every name that exists at Mojang must pass the handshake. A cracked
  #              player can never hold a paid name.
  #   domain     The address a player joins through decides. Paid accounts join through
  #              an address under domains.premium, everybody else through any other.
  rule = automatic

  # What a new name is taken for when no premium source could say whose it is:
  # cracked (the account is marked unverified and asked about again next time),
  # premium (the handshake is asked for), or refuse (the player is told to try later).
  when-every-source-fails = cracked

  # How long a connection that failed the handshake is remembered. When it comes back
  # within this time it is told in plain words why it was refused, and under the
  # automatic rule it joins with a password instead.
  failed-memory-seconds = 300

  # A premium account that keeps a password, the backup one premium.backup-password gives
  # or the one it had before it turned premium, logs in with it when it comes back after a
  # failed handshake: Mojang is down, or the owner lost their Mojang account. Turn this off
  # and a premium account is refused after a failed handshake whatever password it keeps.
  premium-password-fallback = true

  # How long a claim waits. A player who says a name is theirs, with /claim or the button
  # on the login screen, is asked for the handshake on their next connection from the
  # same address within this time. Only that address is asked, so a claim made by
  # somebody else never disturbs the player who holds the name.
  claim-minutes = 10

  # The addresses of the domain rule. A star stands for one part of a name:
  # "*.example.org" covers "eu.example.org". An address on neither list counts as cracked.
  domains {
    premium = []
    cracked = []

    # The mark a cracked name gets, so Notch through the cracked address plays as Notch+,
    # a name of its own beside the paid Notch. mark-at is start or end. The longest name a
    # cracked player may join with is 16 characters minus the mark. The player never types
    # the mark, so any character the server takes in a name will do: no space, nothing past
    # plain ASCII. The plugin refuses any other mark at start. Paper itself takes only
    # letters, digits and the underscore while perform-username-validation is on in
    # config/paper-global.yml: with the default + turn that off, or use c_ instead. The
    # start warns when the two do not fit.
    cracked-mark = "+"
    mark-at = end
  }

  # The UUID a player plays under. Every other plugin keys inventories, ranks and money by
  # it. Four schemes:
  #
  #   keep-first  A new paid player gets their Mojang UUID, so client cosmetics show. A new
  #               cracked player gets the offline one. An account keeps the UUID it was
  #               made with, so a cracked account that later proves a paid name keeps its
  #               inventory, rank and balance.
  #   offline     Everybody gets the offline UUID, derived from the name.
  #   mojang      Every paid player gets their Mojang UUID. A cracked account that later
  #               proves a paid name moves to it.
  #   random      Every new player gets a random UUID, kept from then on.
  #
  # The scheme is written into the database on the first start. A later start under
  # another one is refused, because it would put every player into an empty inventory.
  # To move the accounts instead, run /uxmauth uuidscheme <scheme> from the console while
  # nobody plays, then write the new scheme here and restart.
  uuid-scheme = keep-first

  # What happens when the paid owner of a name proves it while a cracked account holds it:
  # through /claim, by renaming to it at Mojang, after a start while Mojang was down, or
  # after a switch to the strict rule. Four strategies:
  #
  #   rename         The cracked account moves, with everything it had, to the name and
  #                  rename-mark below. The paid owner gets the name. The cracked player is
  #                  told what happened and what their name is now. Nobody loses anything
  #                  and no staff member has to act.
  #   block          Both are stopped with a message until staff settle it with a command.
  #   cracked-keeps  The cracked account keeps the name, and the paid owner is told to
  #                  change theirs at Mojang.
  #   premium-takes  The cracked account is deleted and the paid owner gets the name.
  #                  Players can abuse this: whoever buys a name takes the account of the
  #                  player who held it here first.
  conflict = rename

  # The mark a moved cracked account gets after its name. When the marked name is taken
  # too a number follows it, and a result past 16 characters shortens the name before the
  # mark. The moved player types the new name to log in, so names.pattern must take it, and
  # the plugin refuses a mark it does not take at start. The default _ passes Paper's own
  # name check; the start warns about a mark that does not.
  rename-mark = "_"
}

# A network: Velocity with uxmAuth on the proxy and on every server behind it. Leave this
# off on a server that stands alone. The proxy runs the premium check, knows who has
# logged in, and tells each server so with a claim it signs. A server on a network takes
# a claim only with the right signature, so a player who reaches it some other way is
# asked for their password as usual.
network {
  enabled = false
  # This server's name in the proxy's list, for the lines effects.servers names for it.
  # Leave it empty on a lone server and on the proxy.
  server-name = ""

  # The key the proxy signs its claims with. The proxy writes it into its own data folder
  # on its first start and says where in its console. Copy it here on every server behind
  # it, and keep it private: whoever has it can log anybody in. A server with the network
  # on and no secret refuses to start.
  secret = ""

  # How long a claim stays good after the proxy wrote it. The proxy writes a fresh one
  # before each connection to a server, so a few seconds are enough.
  claim-seconds = 30

  # On the proxy: its own commands a player may run before logging in, without the slash,
  # such as "glist". Every other proxy command waits for the login, and so does every move
  # to another server. A server's commands, /login among them, go on to that server, which
  # holds them as it always does.
  allowed-commands = []

  # On the proxy: where players go. Every name is a server from the proxy's own list.
  #
  # auth-servers  Where a player waits until logged in. Empty: they wait at the dialog
  #               on whichever server they join, and stay there after logging in.
  # lobbies       Where a player goes from an auth server once logged in, and where a
  #               player logged in by Mojang goes first.
  # balance       How a server is picked from a list: least-players, random or first.
  # after-login   lobby, last-server (the server they last left, or a lobby) or
  #               by-domain (the server named below for the address they typed, or a
  #               lobby).
  # by-domain     The servers named for addresses, read in order; a star stands for one
  #               part of a name: { host = "eu.example.org", server = lobby-eu }
  auth-servers = []
  lobbies = []
  balance = least-players
  after-login = lobby
  by-domain = []

  # On the proxy: where a player waits before logging in. server is the dialog or the
  # frozen world of the server they join. limbo keeps them in a world built inside the
  # proxy, which no server sees, when LimboAPI is installed there; they type /login or
  # /register in it. Without LimboAPI the proxy says so once and they wait on a server.
  # limbo-file is a schematic in this folder the world is built from, placed where it
  # was saved; without it the player stands on a small platform under limbo-spawn.
  # limbo-spawn is where the player stands: x, y, z, and a yaw and a pitch if you like.
  wait-in = server
  limbo-file = "limbo.schem"
  limbo-spawn = [0.5, 100, 0.5]

  # Redis carries what every proxy and every server must hear at once, such as an
  # account whose sessions ended after a password change. Every member writes the same
  # address and channel. Leave uri empty and the proxy alone holds the logins, and each
  # server reads the database. A uri looks like redis://:password@host:6379/0.
  redis {
    uri = ""
    channel = "uxmauth"
  }
}

# Remembered sessions: a player back from the same address within the time skips the
# password. A password change, /logout and /session off end them, and so does a new address.
sessions {
  # off       every join asks the password.
  # everyone  every login is remembered.
  # chosen    only a player who chose it: the box in the dialog, the toggle in the
  #           Bedrock form, or /session on.
  mode    = chosen
  minutes = 60
  # Whether a remembered session skips the code of the second factor as it skips the
  # password. Off, a player with the app types its code at every join.
  skip-second-factor = false
}

# The second factor: after the password, a code from an authenticator app such as Google
# Authenticator or Authy. A player turns it on with /2fa setup.
second-factor {
  # The name an app lists the account under, and the account's line in it, where {player}
  # is the player's name.
  issuer = "Minecraft"
  label  = "{player}"
  # How long a code is (6 to 8), how many seconds it lasts (15 to 300), and how many steps
  # either side of now are taken too, for a phone whose clock is off (0 to 4). Most apps
  # make 6 digits every 30 seconds and read nothing else.
  digits         = 6
  period-seconds = 30
  window-steps   = 1
  # How long /2fa setup waits for the first code from the app.
  setup-minutes = 10
  # How many backup codes a player gets for a lost phone (1 to 20), and how many
  # characters each has (8 to 16). Each works once; /2fa backup hands over a new set
  # and voids the old one.
  backup-codes       = 8
  backup-code-length = 10
  # A player holding this node plays only with the app on: after the login they are held
  # until they set it up, at every join, for as long as they hold the node. Give it to
  # staff through your permission plugin; only a node granted outright counts, never the
  # default the server gives operators. Leave it empty to ask it of nobody.
  required-permission = "uxmauth.2fa.required"
  # Whether a player who proved a premium name, or whom Floodgate vouched for, skips the
  # code: the handshake is proof already. A remembered session never skips it unless
  # sessions.skip-second-factor says so. A wrong code costs a try as a wrong password does,
  # out of passwords.max-attempts, and counts toward the address bans.
  premium-skips = true
}

# What protects the door: sessions, address bans, limits, countries and the captcha.
protection {
  # A filter such as TCPShield, behind which every player arrives from the filter's own
  # address. Through it, sessions and every rule that reads the address are off, because one
  # player's address is everybody's there.
  #
  # shared-address-hosts    the hosts the filter answers for. A star stands for one part of
  #                         the name: "*.tcpshield.com". Empty means every host.
  # shared-address-sources  the addresses the filter connects from, one address or a range
  #                         with its prefix: "198.51.100.0/24". The filter publishes them.
  #
  # A player types the host, so a host alone proves nothing: a connection counts as through
  # the filter only when one of these addresses made it. With hosts and no address listed,
  # nothing counts, and the console says so at every start. When the filter can hand the
  # server each player's own address, as TCPShield's plugin does, use that instead and leave
  # both empty.
  shared-address-hosts   = []
  shared-address-sources = []

  # Wrong passwords ban the address they came from. Every failures wrong passwords earn the
  # next step, in minutes, and the last step repeats. An address quiet for forgive-after-hours,
  # counted from its last failure or the end of its ban, starts again from the first step. An
  # IPv6 address counts by its /64, as a home is handed a whole /64.
  bans {
    steps-minutes       = [5, 30, 60, 1440]
    failures            = 3
    forgive-after-hours = 24
  }

  # How often one address may connect: per-address connections inside window-seconds, counted
  # at every connection whatever comes of it, apart from wrong passwords. A bot that registers
  # never fails a login, so only this catches it. A refused connection counts too, so an
  # address that keeps knocking stays out until it stops. exempt-addresses are never counted:
  # one address or a range with its prefix, such as your own proxies.
  connections {
    per-address      = 5
    window-seconds   = 60
    exempt-addresses = []
  }

  # How many password accounts one address may make inside window-hours. Premium and Bedrock
  # players are proved by Mojang or Xbox and are neither counted nor refused. Mind that a whole
  # village, a school or a mobile network can share one IPv4 address: list such an address in
  # exempt-addresses, one address or a range with its prefix. An IPv6 home counts by its /64.
  accounts {
    per-address      = 3
    window-hours     = 24
    exempt-addresses = []
  }

  # Which countries come in, through MaxMind's free GeoLite2 country file.
  #
  #   mode             off, allow (only the listed countries come in) or deny (they stay out)
  #   list             two-letter country codes, such as ["TR", "DE"]
  #   allow-addresses  let in whatever their country: one address or a range with its prefix
  #   unknown          allow or deny an address the file cannot place
  #   account-id       your MaxMind account id and licence key. With both, the file is fetched
  #   licence-key      into the data folder and fetched again once it is refresh-days old. They
  #                    are yours: make a free account at maxmind.com. Without them, drop a
  #                    GeoLite2-Country.mmdb into the data folder yourself.
  #
  # With no file at all, every country is let in, and the console says so once.
  countries {
    mode            = off
    list            = []
    allow-addresses = []
    unknown         = allow
    account-id      = ""
    licence-key     = ""
    refresh-days    = 7
  }

  # A captcha before a player may register or log in. Premium players and Bedrock players
  # Floodgate logs in are proved already and never meet it.
  #
  #   when                    off, register (before every registration), failures (before the
  #                           logins of a name that typed after-failures wrong passwords) or both
  #   after-failures          the wrong passwords that bring the captcha, counted per name on
  #                           this server and forgotten after failure-memory-minutes of quiet
  #                           or a right password
  #   length                  how many characters a code has, 3 to 7
  #   characters              what a code is drawn from: capital letters and digits. The shipped
  #                           ones leave out 0, O, 1, I and L, which are read as one another.
  #   java                    dialog, or map: the code drawn on a map in the hand, typed with
  #                           /captcha. The dialog writes the code as text, which stops a bot
  #                           that only types commands but not one that reads the screen; the
  #                           map draws it under noise, which is much harder to read. The map
  #                           needs hold.hide-inventory on, so it never takes an item's place;
  #                           without it the dialog is shown. Bedrock players read a form
  #                           either way, and a player still connecting reads the dialog.
  #
  # Each showing draws a new code, any answer spends it, and a reconnect starts over.
  captcha {
    when                   = off
    after-failures         = 3
    length                 = 5
    characters             = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"
    failure-memory-minutes = 60
    java                   = dialog
  }
}

# Mail out, for the address a player links, the login code by mail and a forgotten password.
# Nothing is sent until enabled is true. The mails themselves are the files in the mail
# folder, one per kind and language: login-code_tr.txt is the login code in Turkish. Write
# login-code_de.txt and German players read German. A mail that cannot be sent is said to
# the player and once in the console, never with the address.
mail {
  enabled = false
  # The server mail leaves through, and how it is reached: plain, ssl (TLS from the first
  # byte, usually port 465) or starttls (usually port 587). starttls never falls back to
  # the clear.
  host     = ""
  port     = 587
  security = starttls
  # The login at the mail server. Leave username empty for a server that takes mail
  # without one.
  username = ""
  password = ""
  # Who the mail is from, as the player's mail program shows it.
  from-address = ""
  from-name    = "Minecraft"
  # How long a mail waits on the server before it fails.
  timeout-seconds = 10
  # How many mails go out at once. Read at start.
  threads = 2
}

# The address a player links with /email add, and the codes mailed to it: to confirm the
# address, to log in when the player chose a code by mail, and to set a forgotten password.
email {
  # An empty allowed list takes every domain. A domain names its subdomains too, and a
  # denied domain is refused even where the allowed list names it.
  allowed-domains = []
  denied-domains  = []
  # How long a mailed code works, how many tries it takes, how soon another code of the
  # same kind may be sent, and how many digits it has (4 to 10).
  code-minutes     = 15
  code-attempts    = 5
  cooldown-seconds = 60
  code-length      = 6
  # Whether a password account plays only with a confirmed address. A new player registers,
  # is held, and links one with /email add and /email confirm before anything else; an
  # account that has none is held the same way at its next login, and the address can be
  # replaced but not removed. It holds nobody while mail.enabled is off, since nobody could
  # confirm. Off by default: it needs working mail.
  required-at-registration = false
}

# Every login, with its time, the address it came from and how: the password, a premium name,
# a remembered session, Bedrock, or staff. Staff read it with /uxmauth info and /uxmauth history.
# It holds players' addresses: mention it in your server's privacy policy. A login older than
# keep-days is deleted, at start and once a day.
history {
  keep-days = 90
}

# What /uxmauth info shows of an account: how many of its latest logins, and how many of the
# other accounts seen on its addresses. Dates read in date-format (Java's pattern letters:
# yyyy year, MM month, dd day, HH hour, mm minute), in the server's own time zone.
#
# in-game names the destructive staff commands staff may run in game. The rest run only from
# the console, so a staff account somebody took over cannot unregister the other staff, or
# hand an account to whoever waits under its name. They are: forcelogin, unregister,
# setpassword, disable2fa, markpremium, markcracked and resolve. Every other staff command
# runs in game for anybody who holds its permission.
staff {
  recent-logins = 10
  alts-shown    = 20
  date-format   = "yyyy-MM-dd HH:mm"
  in-game       = []
}

# What staff holding uxmauth.admin.alerts hear in game, on every server of a network. A burst of
# wrong passwords from one address is one line each failed-login-window-seconds, and the ban
# that ends it is one more. A new account that logs in from an address shared-address-accounts
# accounts have used, itself among them, is told; 0 turns that off. staff-actions tells every
# staff command that changed something, with who ran it.
alerts {
  failed-login                = true
  failed-login-window-seconds = 60
  ban                         = true
  shared-address-accounts     = 3
  staff-actions               = true
}

# The placeholders this plugin answers through PlaceholderAPI, for a scoreboard, a tab list or a
# chat format. Each answers for the player it is asked about, from memory, and answers nothing
# while that player has not logged in:
#   %uxmauth_authenticated%  true or false
#   %uxmauth_method%         how this session got in: password, registered, premium,
#                            bedrock, session, forced or network
#   %uxmauth_premium%        true or false
#   %uxmauth_kind%           premium, cracked or bedrock
#   %uxmauth_2fa%            true or false: an app, or a code by mail
#   %uxmauth_registered%     when the account was made, in date-format
#   %uxmauth_last_login%     when this session logged in, in date-format
# date-format takes Java's pattern letters, in the server's own time zone.
placeholders {
  date-format = "yyyy-MM-dd HH:mm"
}

# What is told to one Discord channel, through the webhook the channel's settings give you.
# Nothing is sent while url is empty. Each event is switched on its own and its message is
# yours, with {player}, {server}, {method} and {address}, and {accounts} and {time} where they
# fit. {address} is masked to its first two parts, 203.0.x.x, so the channel never holds a
# player's whole address. A message never pings anybody. Messages wait on a thread of their
# own; when too many wait, the oldest is dropped with a line in the console, and nothing here
# ever delays a login. A ban made at a proxy is not sent; one made on a server is.
discord {
  url    = ""
  server = "server"
  events {
    register      { enabled = true, message = "{player} registered on {server} from {address}." }
    login         { enabled = true, message = "{player} logged in on {server} by {method} from {address}." }
    known-address { enabled = true, message = "{player} is a new account on {address}, which {accounts} accounts have used, on {server}." }
    ban           { enabled = true, message = "{address} is banned on {server} for {time} after wrong passwords." }
    conflict      { enabled = true, message = "Staff settled the name {player} on {server}." }
  }
}

# A website's login table, in the format many login plugins share and websites such as LeaderOS
# and Minexon read. On, every password account is written there too, with its password in the
# format the website reads, and that table is where a password lives: a password changed on the
# website works at the next login, one changed in game works on the website, and an account the
# website made logs in and gets this plugin's own row then. Everything the website does not know
# stays in this plugin's tables. Removing an account in game removes its row there too. Premium
# and Bedrock accounts keep no row there: a row under such a name is the website's own, and gives
# that account nothing. A registration in game never writes over a row the website holds. A row
# somebody made on the website under the name of an account this plugin held first is theirs: it
# opens nothing here, and nothing here writes to it. A row holding the account's own hash, as an
# imported account's does, is the account's.
#
# The table lives in the database this plugin uses. It is made, with these column names, when
# it is not there; one that is there is used as it is. hash is the format the website reads:
# sha256, bcrypt, pbkdf2 or argon2. While the table is on, every new password is written in it,
# whatever hashing.algorithm says, and an older one moves to it at the player's next login.
# sha256 is weak: choose it only for a website that reads nothing else.
#
# Every name is letters, digits and underscores. Everything here applies at the next start.
website-table {
  enabled = false
  table   = "authme"
  hash    = "sha256"
  columns {
    name       = "username"
    real-name  = "realname"
    password   = "password"
    ip         = "ip"
    last-login = "lastlogin"
    reg-date   = "regdate"
    reg-ip     = "regip"
  }
}

# Accounts from the login plugin this server used before, brought over once at the start.
#
# source names a file in the imports folder: authme, nlogin, openlogin, librelogin, limboauth,
# jpremium, loginto, authy, dynamicbungeeauth, loginsecurity or authplus. Each file says how that
# plugin keeps its accounts, and a file of your own describes any other table. Empty imports
# nothing.
#
# jdbc-url, username and password are the database the source keeps its accounts in. A file
# database is named by its path, such as jdbc:sqlite:plugins/AuthMe/authme.db. The source is
# only read, never written. A source that keeps a file of its own, such as authplus, needs none
# of the three.
#
# table reads another table than the file names. jpremium and dynamicbungeeauth name none, so
# set it for those.
#
# Passwords keep their hash and move to hashing.algorithm at the player's next login. The start
# prints how many accounts came over and how many were refused, never a password. An import runs
# once: every later start says it ran and does nothing. A failed import stops the plugin, marks
# nothing, and runs again at the next start. On a network every server may name the same source:
# the first one to start imports, and the others wait for it and then find it done.
#
# premium is a list of premium names another plugin kept, such as fastlogin, read after the
# accounts with the same five keys. It makes no account. Every name it lists is asked of the
# premium sources first, because a name changes hands: a cracked account becomes premium under
# its Mojang id only when they give the name that id, and it keeps its password. A name they
# cannot place stays as it was, and the door asks again when its player joins.
import {
  source   = ""
  jdbc-url = ""
  username = ""
  password = ""
  table    = ""
  premium {
    source   = ""
    jdbc-url = ""
    username = ""
    password = ""
    table    = ""
  }
}
