# Rename, alias, or disable any command without touching the code.
#
# The key on the left never changes. Only the values do.
# A change here needs a server restart: the server builds its command tree once,
# at enable, and offers no supported way to rename a live command.
#
# The operator command of every plugin we ship answers to "<player command>admin" as well, so
# an operator who knows the command a player types can always reach the operator one. Rename
# either of them here and that pairing is yours to keep.
#
# name    the label that a player types, without the slash
# aliases other labels that reach the same command
# enabled set to false and the command is never registered
#
# A word under a command is named the same way, under subcommands. The key on the left is
# fixed and the name on the right is yours: set enabled = false there and that one word
# leaves the tree while the rest of the command stays.
#
# A word under a word is written with a hyphen on the left and a space on the right:
# lang-set is the key under which "lang set" is named.
#
# localized-aliases  words for the readers of one language, a list per language tag:
#                    localized-aliases { tr = ["arsa"] }
#                    The tag is a language (tr) or a language and a country (pt-BR).
#                    A word on a command works for anyone who types it, but only a
#                    player who reads that language finds it among their commands.
#                    A word under subcommands is shown to, and works for, the readers
#                    of that language and the console only. The language a player
#                    reads is the one they chose in this plugin, or their client's.

commands {
  uxmauth {
    name    = "uxmauth"
    aliases = ["auth"]
    enabled = true

    subcommands {
      reload  { name = "reload" }
      version { name = "version" }
      doctor  { name = "doctor" }
      lang       { name = "lang" }
      lang-set   { name = "lang set" }
      lang-reset { name = "lang reset" }
      lang-set-player   { name = "lang set-player" }
      lang-reset-player { name = "lang reset-player" }
    }
  }

  # What a player types to get in. Every label here is let through for a player who has
  # not logged in yet, and the password after it is kept out of the console and the log.
  login {
    name    = "login"
    aliases = ["l", "log"]
    enabled = true
    localized-aliases { tr = ["giris"] }
  }

  register {
    name    = "register"
    aliases = ["reg"]
    enabled = true
    localized-aliases { tr = ["kayit"] }
  }

  changepassword {
    name    = "changepassword"
    aliases = ["changepass", "cp"]
    enabled = true
    localized-aliases { tr = ["sifredegistir"] }
  }

  logout {
    name    = "logout"
    aliases = []
    enabled = true
    localized-aliases { tr = ["cikis"] }
  }

  # "This name is mine", from the login screen: the next connection from the same address
  # is asked to prove the name through Mojang.
  claim {
    name    = "claim"
    aliases = []
    enabled = true
    localized-aliases { tr = ["sahiplen"] }
  }

  # Logged in, choose whether a join from the same address skips the password, while
  # sessions.mode in config.conf is chosen. Off ends every session the account has.
  session {
    name    = "session"
    aliases = []
    enabled = true
    localized-aliases { tr = ["oturum"] }
    subcommands {
      on  { name = "on", localized-aliases { tr = ["ac"] } }
      off { name = "off", localized-aliases { tr = ["kapat"] } }
    }
  }

  # Logged in, prove the name on the next connection and log in without a password from
  # then on. The account keeps everything it had.
  premium {
    name    = "premium"
    aliases = []
    enabled = true
    localized-aliases { tr = ["premium"] }
  }
}
