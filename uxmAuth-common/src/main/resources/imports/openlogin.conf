# OpeNLogin. Names are kept in lower case with the written name beside them, passwords in bcrypt,
# dates in milliseconds.
display = "OpeNLogin"
table = openlogin
id-style = none
time-style = millis
hash-style = as-is
columns {
  name = realname
  password = password
  address = address
  registered = regdate
  last-login = lastlogin
}
