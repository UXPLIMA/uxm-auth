# AuthMe, its forks, and the websites that share its table. The table and the SQLite file AuthMe
# writes both name it authme. Names are kept in lower case with the written name beside them,
# dates in milliseconds. A hash is $SHA$salt$hash by default; bcrypt, Argon2 and PBKDF2 hashes
# from its other settings are read as they are. A server that kept premium ids in AuthMe's
# premiumUUID column adds premium-id = premiumUUID below.
display = "AuthMe"
table = authme
id-style = none
time-style = millis
hash-style = dollar-sha
columns {
  name = realname
  password = password
  totp = totp
  address = ip
  registered = regdate
  last-login = lastlogin
}
