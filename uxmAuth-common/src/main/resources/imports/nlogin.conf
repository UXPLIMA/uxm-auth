# nLogin. Ids are written without dashes, the paid account's Mojang id beside the account's own.
# A hash is $SHA512$hash$salt or bcrypt. Dates are timestamps.
display = "nLogin"
table = nlogin
id-style = undashed
time-style = timestamp
hash-style = hash-first
columns {
  name = last_name
  id = unique_id
  premium-id = mojang_id
  password = password
  address = last_ip
  registered = creation_date
  last-login = last_seen
}
