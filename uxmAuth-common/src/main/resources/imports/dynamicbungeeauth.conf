# DynamicBungeeAuth. The hash is a salted double SHA-512 with its salt in a column of its own. The
# premium column says the account's own id is Mojang's. Dates are timestamps. The table's name is
# the one in its own settings: write it in import.table in config.conf.
display = "DynamicBungeeAuth"
table = ""
id-style = dashed
time-style = timestamp
hash-style = salt-column
columns {
  name = name
  id = uuid
  premium-flag = premium
  password = password
  salt = salt
  registered = firstjoin
  last-login = lastjoin
}
