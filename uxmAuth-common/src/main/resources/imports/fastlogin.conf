# FastLogin's list of premium names, read after the accounts under import.premium.source. It
# holds no passwords, so it makes no account: each cracked account it names premium becomes
# premium under its Mojang id, and keeps its password as a backup. A Mojang id two names hold is
# a player who changed their name, and only the name Mojang gives it now is turned. The SQLite
# file FastLogin writes is plugins/FastLogin/FastLogin.db.
display = "FastLogin"
kind = premium
table = premium
id-style = undashed
time-style = timestamp
columns {
  name = Name
  id = UUID
  premium-flag = Premium
  address = LastIp
  last-login = LastLogin
}
