# LimboAuth. Hashes are bcrypt, written $2a$ or BCRYPT$; an account it brought over from another
# plugin may still hold SHA256$salt$hash, read here as well. Dates are in milliseconds. An empty
# PREMIUMUUID is a cracked account.
display = "LimboAuth"
table = AUTH
id-style = dashed
time-style = millis
hash-style = name-salt-hash
columns {
  name = NICKNAME
  id = UUID
  premium-id = PREMIUMUUID
  password = HASH
  totp = TOTPTOKEN
  address = IP
  registered = REGDATE
  last-login = LOGINDATE
}
