# LoginTo. It keeps no names: each account's name is the one this server last saw its id play
# under, and an id the server never saw is counted and left. Passwords are bcrypt. isPremium says
# the account's own id is Mojang's.
display = "LoginTo"
table = LoginTo_Players_Accounts
id-style = dashed
time-style = none
hash-style = as-is
columns {
  id = uuid
  premium-flag = isPremium
  password = password
  totp = secret
  address = joinIp
}
