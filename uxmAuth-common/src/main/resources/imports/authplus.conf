# Auth+. Accounts are kept in players.yml in its plugin folder, one entry per player id with the
# hash under it: PBKDF2-HMAC-SHA256 as pbkdf2$rounds$salt$key. It keeps no names: each account's
# name is the one this server last saw its id play under. Read on Paper only. import.table names
# the file when it is somewhere else.
display = "Auth+"
kind = yaml
table = "players.yml"
id-style = dashed
time-style = none
hash-style = as-is
columns {
  id = key
  password = hash
}
