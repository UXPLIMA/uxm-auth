# LoginSecurity. hashing_algorithm 7 is bcrypt, read as it is; an account under another of its
# algorithms is counted by that number. Dates are timestamps.
display = "LoginSecurity"
table = ls_players
id-style = dashed
time-style = timestamp
hash-style = algorithm-column
columns {
  name = last_name
  id = unique_user_id
  password = password
  algorithm = hashing_algorithm
  registered = registration_date
  last-login = last_login
}
