# LibreLogin. The hash, its salt and its algorithm sit in three columns: SHA-256 and SHA-512 as a
# salted double digest, bcrypt as cost$hash beside its salt, Argon2id as version,iterations,memory$hash
# beside a Base64 salt. The authenticator secret is kept in secret. Dates are timestamps.
display = "LibreLogin"
table = librepremium_data
id-style = dashed
time-style = timestamp
hash-style = algorithm-column
columns {
  name = last_nickname
  id = uuid
  premium-id = premium_uuid
  password = hashed_password
  salt = salt
  algorithm = algo
  totp = secret
  address = ip
  registered = joined
  last-login = last_seen
}
