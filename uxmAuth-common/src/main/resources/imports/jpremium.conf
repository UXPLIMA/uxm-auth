# JPremium. Ids are written without dashes. A hash is SHA256$salt$hash, SHA512$salt$hash or
# BCRYPT$ followed by bcrypt. Dates are timestamps. The table's name is the one in JPremium's own
# settings: write it in import.table in config.conf.
display = "JPremium"
table = ""
id-style = undashed
time-style = timestamp
hash-style = name-salt-hash
columns {
  name = lastNickname
  id = uniqueId
  premium-id = premiumId
  password = hashedPassword
  registered = firstSeen
  last-login = lastSeen
}
