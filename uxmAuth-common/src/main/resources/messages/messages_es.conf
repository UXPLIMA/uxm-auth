# Mensajes en español.
#
# Cada línea es MiniMessage, y cada línea nombra un papel en lugar de un color: <body> es el
# texto, <value> un nombre o un número, <tag:'ACCESO'> la etiqueta con la que empieza una
# línea del chat. Los colores detrás de esos nombres están en theme.conf.
#
# Escribe aquí palabras normales. El plugin pasa la línea a versalitas al mostrarla; á, é, í, ó,
# ú, ñ y ü conservan su forma. El valor small-caps.es de theme.conf lo activa y lo desactiva.
#
# Una clave que falta aquí vuelve al valor por defecto que lleva el código, así que el plugin
# nunca muestra un mensaje vacío. Borra una línea para recuperar el valor por defecto.

admin {
  version       = "<tag:'ACCESO'> <body>uxmAuth <value><version>"
  usage         = "<tag:'ACCESO'> <body>Añade <value>help<body> después de este comando para ver todo lo que hace."
  reloaded      = "<tag:'ACCESO'> <body>La configuración se ha vuelto a cargar, en <value><ms><body> ms."
  reload-failed = "<etag:'ERROR'> <body>La recarga ha fallado. El motivo está en la consola."

  doctor {
    header = "<h:'Cómo está el plugin'>"
    ok     = "<good>ok<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>aviso<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>fallo<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'ACCESO'> <body>Todo ha respondido."
    unwell = "<etag:'ERROR'> <body>Algo va mal arriba. La consola lo tiene todo."
  }
}



# Las líneas de la rama de idioma. <language> es el nombre de un idioma, y <languages> la lista
# de los que encontró este plugin. Un idioma es un archivo en esta carpeta: escribe
# messages_it.conf y se ofrece el italiano, sin compilar de nuevo y sin lista que editar.
language {
  current           = "<tag:'ACCESO'> <body>Lees esto en <value><language><body>."
  choices           = "<tag:'ACCESO'> <body>Puedes leerlo en <value><languages><body>."
  changed           = "<tag:'ACCESO'> <body>Ahora lees esto en <value><language><body>."
  already           = "<tag:'ACCESO'> <body>Ya lees esto en <value><language><body>."
  reset             = "<tag:'ACCESO'> <body>Ya no tienes un idioma propio."
  separator         = "<dim>, "
  unknown           = "<etag:'ERROR'> <body>Este servidor no tiene <value><input><body>. Tiene <value><languages><body>."
  forced            = "<etag:'ERROR'> <body>Este servidor usa un solo idioma, y es <value><language><body>."

  # Lo que lee un operador después de poner o quitar el idioma de otro jugador. <player> es
  # el nombre del jugador. Un jugador que no está recibe el cambio la próxima vez que entra.
  set-player        = "<tag:'ACCESO'> <value><player><body> ahora lee <value><language><body>."
  set-player-away   = "<tag:'ACCESO'> <value><player><body> no está y leerá <value><language><body> desde su próxima entrada."
  reset-player      = "<tag:'ACCESO'> <value><player><body> ya no tiene un idioma propio."
  reset-player-away = "<tag:'ACCESO'> <value><player><body> no está, y su idioma se borra en su próxima entrada."
  forced-anyway     = "<tag:'ACCESO'> <body>Se guarda, y todos leen <value><language><body> mientras esté forzado."
  unknown-player    = "<etag:'ERROR'> <body>Nadie llamado <value><input><body> ha jugado aquí."
}

# Las líneas que escribe la capa de comandos de uxmLib: la página de ayuda, un argumento
# rechazado, un tiempo de espera. Están aquí para traducirse con el resto y pintarse desde
# theme.conf. Un valor entre ángulos se inserta tal como está escrito y nunca se ejecuta.
command {
  no-permission     = "<etag:'ERROR'> <body>No tienes permiso para hacer eso."
  player-only       = "<etag:'ERROR'> <body>Solo un jugador puede usar este comando."
  invalid-value     = "<etag:'ERROR'> <body><value><input><body> no es un valor válido para <value><argument><body>."
  invalid-value-why = "<etag:'ERROR'> <body><value><input><body> no es un valor válido para <value><argument><body>: <subtext><reason>"
  not-one-of        = "<etag:'ERROR'> <body><value><input><body> no es un valor válido para <value><argument><body>. Prueba uno de <value><allowed><body>."
  invalid-argument  = "<etag:'ERROR'> <body><detail>"
  bad-argument      = "<etag:'ERROR'> <body>Ese argumento no es válido."
  internal-error    = "<etag:'ERROR'> <body>Algo ha fallado al ejecutar este comando. El motivo está en la consola."
  on-cooldown       = "<etag:'ERROR'> <body>Espera <value><time><body> antes de volver a usarlo."
  help-header       = "<h:'Ayuda'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command      = "<value><command>"
  help-separator    = "<dim> : "
  help-description  = "<subtext><description>"
  help-fill-hint    = "<subtext>Haz clic para escribir este comando."
  help-page-hint    = "<subtext>Página <value><page>"
  storage            = "<etag:'ERROR'> <body>Este servidor no puede llegar a sus cuentas ahora mismo. Inténtalo de nuevo en un minuto."
}

# Lo que lee un jugador mientras espera para entrar. Los comandos que se nombran aquí son los
# incluidos: si los renombras en commands.conf, escribe aquí también los nombres nuevos.
join {
  register-title    = "<value>Bienvenido"
  register-subtitle = "<body>Elige una contraseña con <value>/register"
  login-title       = "<value>Bienvenido de nuevo"
  login-subtitle    = "<body>Inicia sesión con <value>/login"
  code-title        = "<value>Un paso más"
  code-subtitle     = "<body>Escribe tu código de acceso con <value>/2fa"
}

reminder {
  register = "<body>Regístrate con <value>/register <password> <password>"
  login    = "<body>Inicia sesión con <value>/login <password>"
  code     = "<body>Escribe tu código de acceso con <value>/2fa <code>"
}

chat {
  register-password = "<body>Escribe en el chat una contraseña para este nombre. Nadie más la lee."
  register-repeat   = "<body>Escribe la misma contraseña otra vez."
  login-password    = "<body>Escribe tu contraseña en el chat para iniciar sesión. Nadie más la lee."
  code              = "<body>Escribe tu código de acceso en el chat: el que muestra tu app o el que te llegó por correo."
}

welcome {
  registered = "<good>Tu cuenta está lista"
  logged-in  = "<good>Sesión iniciada"
}

# El motivo que lee un jugador en la pantalla a la que se le expulsa. <min> y <max> son las
# longitudes que puede tener un nombre, <word> la palabra bloqueada que contiene un nombre, <name>
# la forma en que se registró un nombre. Un tiempo restante, en sus dos unidades mayores: <n> es el
# número.
time {
  days      = "<n>d"
  hours     = "<n>h"
  minutes   = "<n>min"
  seconds   = "<n>s"
  separator = " "
}

kick {
  # <time> es lo que le queda al bloqueo.
  banned            = "<body>Llegaron demasiadas contraseñas incorrectas desde tu dirección. Inténtalo de nuevo en <value><time><body>."
  too-many-connections = "<body>Llegaron demasiadas conexiones desde tu dirección. Inténtalo de nuevo en <value><time><body>."
  # <country> es el código de dos letras que dio el archivo de países, o ? cuando no conocía
  # ninguno.
  country           = "<body>Este servidor no acepta jugadores desde donde te conectas."
  logged-out        = "<body>Cerraste sesión. Vuelve a entrar para regresar."
  already-online    = "<body>Alguien ya está conectado con este nombre. Si eras tú, espera un momento y vuelve a entrar."
  cancelled         = "<body>Saliste antes de iniciar sesión. Vuelve a entrar cuando quieras."
  storage           = "<body>Este servidor no puede llegar a sus cuentas ahora mismo. Inténtalo de nuevo en un minuto."
  timeout           = "<body>Tardaste demasiado en iniciar sesión. Vuelve a entrar para intentarlo otra vez."
  timeout-register  = "<body>Tardaste demasiado en registrarte. Vuelve a entrar para intentarlo otra vez."
  too-many-attempts = "<body>Demasiadas contraseñas incorrectas. Vuelve a entrar para intentarlo otra vez."
  name-too-short    = "<body>Tu nombre es demasiado corto aquí. Usa un nombre de al menos <value><min><body> caracteres."
  name-too-long     = "<body>Tu nombre es demasiado largo aquí. Usa un nombre de como mucho <value><max><body> caracteres."
  name-characters   = "<body>Tu nombre tiene un carácter que este servidor no permite. Usa otro nombre."
  name-blocked      = "<body>Tu nombre tiene una palabra que este servidor no permite: <value><word>"
  name-case         = "<body>Este nombre está registrado como <value><name><body>. Vuelve a entrar escribiéndolo exactamente así."
  lookup-failed     = "<body>Este servidor no puede comprobar ahora si tu nombre pertenece a una cuenta de Minecraft de pago. Inténtalo de nuevo en un minuto."
  paid-name         = "<body>Este nombre pertenece a una cuenta de Minecraft de pago, y tu último intento no pasó la comprobación de Mojang. Si el nombre es tuyo, entra desde el launcher oficial. Si no, entra con otro nombre."
  paid-name-moved   = "<body>Este nombre ahora pertenece a su dueño de pago. Tu cuenta aquí ahora es <value><name><body>: cambia tu nombre a ese y vuelve a entrar. Tu contraseña y todo lo que tenías siguen igual."
  premium-address   = "<body>Esta dirección es para cuentas de Minecraft de pago, y tu último intento no pasó la comprobación de Mojang. Entra por la otra dirección del servidor para jugar con contraseña."
  name-disputed     = "<body>Dos jugadores quieren este nombre, y el staff lo resolverá. Vuelve a entrar cuando lo hayan hecho."
  name-kept         = "<body>Otro jugador tomó este nombre aquí primero y se lo queda. Cambia tu nombre en Mojang para jugar aquí."
  claimed           = "<body>Vuelve a entrar desde el launcher oficial de Minecraft. Tu próxima conexión desde aquí demuestra que este nombre es tuyo."
  network-claim     = "<body>Este servidor no pudo confirmar tu inicio de sesión con la red. Vuelve a entrar."
  start-failed      = "El inicio de sesión de este servidor no pudo arrancar, así que nadie puede entrar hasta que el staff lo arregle. Inténtalo más tarde."
}

# Las respuestas a /login, /register, /changepassword y /logout. <left> es cuántos intentos quedan,
# <name> un nombre tal como lo escribió su dueño, <old> y <new> los nombres entre los que se movió
# una cuenta cuando el dueño de pago de su nombre lo demostró.
login {
  wrong          = "<etag:'ERROR'> <body>Esa contraseña es incorrecta. Intentos restantes: <value><left><body>."
  not-registered = "<etag:'ERROR'> <body>Todavía no tienes contraseña aquí. Regístrate con <value>/register<body>."
  already        = "<tag:'ACCESO'> <body>Ya has iniciado sesión."
  usage          = "<tag:'ACCESO'> <body>Escribe tu contraseña después del comando: <value>/login <password>"
  must-replace   = "<body>Tu contraseña era correcta, pero ya no cumple las reglas de este servidor. Pon una nueva con <value>/changepassword <current> <new><body> para entrar."
  handshake-failed = "<tag:'ACCESO'> <body>Tu última conexión se rechazó porque este nombre pertenece a una cuenta de Minecraft de pago y Mojang no confirmó que eras tú. Esta vez entraste con contraseña. Si el nombre es tuyo, usa <value>/claim<body>."
  renamed          = "<tag:'ACCESO'> <body>El dueño de pago de <value><old><body> demostró el nombre, así que tu cuenta se movió a <value><new><body> con todo lo que tenía. Entra como <value><new><body> a partir de ahora."
  refused = "<tag:'ACCESO'> <body>Tu inicio de sesión fue rechazado."
}

# Las respuestas a /claim y /premium.
claim {
  unavailable     = "<etag:'ERROR'> <body>Este servidor no puede preguntar a Mojang de quién es un nombre, así que aquí no hay nada que reclamar."
  already-premium = "<tag:'ACCESO'> <body>Tu cuenta ya demostró su nombre."
  not-this-rule   = "<etag:'ERROR'> <body>Este servidor comprueba los nombres de pago por sí mismo, así que no hay nada que reclamar."
}

premium {
  log-in-first = "<etag:'ERROR'> <body>Inicia sesión primero, luego usa <value>/premium<body> para demostrar tu nombre en tu próxima conexión."
}

# Lo que el proxy de una red le dice a un jugador que todavía no ha iniciado sesión.
network {
  log-in-first = "<etag:'ERROR'> <body>Inicia sesión primero. Hasta entonces te quedas en este servidor, y los comandos de la red esperan."
}

register {
  rules-needed   = "<etag:'ERROR'> <body>Marca primero la casilla para aceptar las reglas."
  too-many-accounts = "<etag:'ERROR'> <body>Se crearon demasiadas cuentas desde tu dirección últimamente. Inténtalo más tarde."
  mismatch       = "<etag:'ERROR'> <body>Las dos contraseñas no son iguales."
  confirm-needed = "<etag:'ERROR'> <body>Escribe la contraseña dos veces: <value>/register <password> <password>"
  usage          = "<tag:'ACCESO'> <body>Escribe una contraseña después del comando, dos veces: <value>/register <password> <password>"
  usage-once     = "<tag:'ACCESO'> <body>Escribe una contraseña después del comando: <value>/register <password>"
  name-taken     = "<etag:'ERROR'> <body>El nombre <value><name><body> ya tiene una cuenta."
  already        = "<etag:'ERROR'> <body>Ya tienes una cuenta. Inicia sesión con <value>/login<body>."
  refused = "<tag:'ACCESO'> <body>Tu registro fue rechazado."
}

change {
  done          = "<good>Tu contraseña está cambiada. Todas las sesiones recordadas con ella terminaron."
  wrong-old     = "<etag:'ERROR'> <body>La contraseña antigua es incorrecta."
  not-logged-in = "<etag:'ERROR'> <body>Inicia sesión primero."
  needs-both    = "<etag:'ERROR'> <body>Escribe la contraseña antigua y luego la nueva."
  usage         = "<tag:'ACCESO'> <body>Escribe la contraseña antigua y luego la nueva: <value>/changepassword <old> <new>"
  usage-once    = "<tag:'ACCESO'> <body>Escribe la nueva contraseña después del comando: <value>/changepassword <new>"
}

# El captcha. Se sortea un código nuevo cada vez que se muestra, y cualquier respuesta lo gasta.
captcha {
  usage   = "<tag:'ACCESO'> <body>Escribe el código después del comando: <value>/captcha <code>"
  needed  = "<etag:'ERROR'> <body>Resuelve primero el captcha."
  wrong   = "<etag:'ERROR'> <body>Ese no era el código. Aquí tienes uno nuevo."
  solved  = "<good>Captcha resuelto. Adelante."
  map     = "<body>Lee el código del mapa de tu mano y escribe <value>/captcha <code><body>."
  map-chat = "<body>Lee el código del mapa de tu mano y escríbelo en el chat."
  nothing = "<etag:'ERROR'> <body>No hay ningún captcha que responder."
}

# Las respuestas a /session. <minutes> es cuánto tiempo un inicio de sesión desde la misma dirección
# se salta la contraseña.
session {
  usage        = "<body>Usa <value>/session on<body> para saltarte la contraseña desde esta dirección la próxima vez, o <value>/session off<body> para que te la pidan en cada entrada."
  on           = "<good>Desde esta dirección te saltas la contraseña durante <value><minutes><good> minutos después de cada inicio de sesión."
  off          = "<good>Se te pedirá la contraseña en cada entrada."
  log-in-first = "<etag:'ERROR'> <body>Inicia sesión primero, luego elige."
  not-chosen   = "<etag:'ERROR'> <body>Este servidor decide las sesiones para todos, así que no hay nada que elegir."
}

# Las respuestas a /2fa. <secret> es la clave que recibe una app, <link> lo mismo como enlace, y
# <minutes> cuánto espera una configuración su primer código.
factor {
  usage           = "<body>Usa <value>/2fa setup<body> para pedir un código de una app de autenticación después de la contraseña, <value>/2fa email on<body> para recibirlo por correo, <value>/2fa backup <code><body> para nuevos códigos de respaldo, o <value>/2fa off <code><body> para dejarlo."
  secret          = "<body>Añade una cuenta en tu app de autenticación con esta clave: <value><secret><body>. Haz clic para copiarla."
  link            = "<body>O abre este enlace en el móvil: <value><link><body>. Haz clic para copiarlo."
  map             = "<body>O escanea el código QR del mapa de tu mano."
  no-room         = "<body>Vacía una casilla de tu barra rápida y vuelve a ejecutar <value>/2fa setup<body> para tener el código QR en un mapa."
  confirm         = "<body>Luego escribe <value>/2fa confirm <code><body> con el código que muestra la app. Esto espera <value><minutes><body> minutos."
  on              = "<good>A partir de ahora tu cuenta pide un código de tu app después de la contraseña."
  backup-codes    = "<body>Tus códigos de respaldo, por si pierdes el móvil: <value><codes><body>. Cada uno sirve una vez en lugar del código de la app. Haz clic para copiarlos y guárdalos bien, no se vuelven a mostrar."
  off             = "<good>Tu cuenta ya no pide un código de una app."
  wrong           = "<etag:'ERROR'> <body>Ese no es el código que muestra ahora tu app ni un código de respaldo."
  nothing-started = "<etag:'ERROR'> <body>No hay ninguna configuración esperando. Empieza una con <value>/2fa setup<body>."
  already-on      = "<etag:'ERROR'> <body>Tu cuenta ya pide un código de una app. Desactívalo primero con <value>/2fa off <code><body>."
  not-on          = "<etag:'ERROR'> <body>Tu cuenta no pide ningún código de una app."
  required        = "<etag:'ERROR'> <body>Tu cuenta debe pedir un código de una app de autenticación antes de que puedas jugar. Escribe <value>/2fa setup<body> para configurarlo."
  log-in-first    = "<etag:'ERROR'> <body>Inicia sesión primero."
  code-needed     = "<body>Ahora escribe el código de tu app de autenticación, el que te llegó por correo o un código de respaldo, con <value>/2fa <code><body>."
  login-wrong     = "<etag:'ERROR'> <body>Ese no es el código actual de la app, el del correo ni uno de respaldo. Intentos restantes: <value><left><body>."
  nothing-asked   = "<etag:'ERROR'> <body>Ahora no se te pide ningún código."
  mail-on         = "<good>A partir de ahora se envía un código de acceso a <value><address><good> después de tu contraseña."
  mail-off        = "<good>Ya no se te envían códigos de acceso por correo."
  mail-already-on = "<etag:'ERROR'> <body>Ya se te envían códigos de acceso por correo."
  mail-not-on     = "<etag:'ERROR'> <body>No se te envían códigos de acceso por correo."
  mail-no-address = "<etag:'ERROR'> <body>Vincula primero una dirección con <value>/email add <address><body>."
}
# Respuestas de /email. <address> es siempre la dirección enmascarada, <minutes> cuánto dura un
# código, <seconds> cuánto falta para que pueda salir otro código, <left> los intentos que le quedan
# a un código.
email {
  usage = "<body>Usa <value>/email add <address><body> para vincular una dirección a la que se envía una contraseña olvidada, <value>/email confirm <code><body> con el código que recibe, o <value>/email remove<body> para quitarla."
  linked = "<body>Vinculada ahora: <value><address><body>."
  sent = "<good>Se envió un código a <value><address><good>. Escribe <value>/email confirm <code><good> en <value><minutes><good> minutos."
  cooldown = "<etag:'ERROR'> <body>Acaba de salir un código. Pide otro en <value><seconds><body> segundos."
  confirmed = "<good>Vinculada: <value><address><good>. Con ella se puede volver a poner una contraseña olvidada."
  wrong = "<etag:'ERROR'> <body>Ese no es el código. Intentos restantes: <value><left><body>."
  already-linked = "<etag:'ERROR'> <body><value><address><body> ya está vinculada."
  removed = "<good><value><address><good> ya no está vinculada."
  not-an-address = "<etag:'ERROR'> <body>Eso no es una dirección de correo."
  domain-refused = "<etag:'ERROR'> <body>Este servidor no acepta direcciones de ese dominio."
  mail-off = "<etag:'ERROR'> <body>Este servidor no envía correos."
  mail-failed = "<etag:'ERROR'> <body>No se pudo enviar el correo. Inténtalo más tarde."
  expired = "<etag:'ERROR'> <body>Ese código es demasiado antiguo. Pide uno nuevo con <value>/email add <address><body>."
  nothing-pending = "<etag:'ERROR'> <body>No hay ningún código esperando. Pide uno con <value>/email add <address><body>."
  too-many-attempts = "<etag:'ERROR'> <body>Se gastaron los intentos de ese código. Pide uno nuevo con <value>/email add <address><body>."
  none-linked = "<etag:'ERROR'> <body>No hay ninguna dirección vinculada."
  factor-on = "<etag:'ERROR'> <body>Tu código de acceso va a esta dirección. Desactívalo primero con <value>/2fa email off <code><body>."
  required = "<etag:'ERROR'> <body>Este servidor guarda una dirección para una contraseña olvidada. Vincula una con <value>/email add <address><body>, luego <value>/email confirm <code><body> con el código que recibe."
  required-keep = "<etag:'ERROR'> <body>Este servidor exige una dirección, así que no se puede quitar. Vincula otra con <value>/email add <address><body> para sustituirla."
  log-in-first = "<etag:'ERROR'> <body>Inicia sesión primero."
}
# Respuestas de /recover. <address> es la dirección enmascarada, <minutes> cuánto dura el código.
recover {
  sent = "<good>Se envió un código a <value><address><good>. Escribe <value>/recover <code> <new password><good> en <value><minutes><good> minutos."
  cooldown = "<etag:'ERROR'> <body>Acaba de salir un código. Pide otro en <value><seconds><body> segundos."
  no-address = "<etag:'ERROR'> <body>Esta cuenta no tiene ninguna dirección vinculada, así que no se puede enviar un código. Pregunta al staff."
  not-waiting = "<etag:'ERROR'> <body>Una contraseña se recupera al iniciar sesión, antes de escribirla."
  usage = "<etag:'ERROR'> <body>Escribe <value>/recover<body> para un código, luego <value>/recover <code> <new password><body>."
  done = "<good>Tu nueva contraseña está puesta. Inicia sesión con <value>/login <password><good>."
  wrong = "<etag:'ERROR'> <body>Ese no es el código. Intentos restantes: <value><left><body>."
  expired = "<etag:'ERROR'> <body>Ese código es demasiado antiguo. Pide uno nuevo con <value>/recover<body>."
  nothing-pending = "<etag:'ERROR'> <body>No hay ningún código esperando. Pide uno con <value>/recover<body>."
  too-many-attempts = "<etag:'ERROR'> <body>Se gastaron los intentos de ese código. Pide uno nuevo con <value>/recover<body>."
}



logout {
  not-logged-in = "<etag:'ERROR'> <body>No has iniciado sesión."
  sessions-ended = "<body>Tu contraseña cambió, así que se cerró tu sesión. Inicia sesión con la nueva."
}

# La cuenta propia de un jugador: /unregister y /cracked, el último inicio de sesión y la contraseña
# de respaldo. <seconds> es cuánto espera la confirmación, <date> y <address> el inicio de sesión
# anterior, enmascarado.
account {
  log-in-first = "<etag:'ERROR'> <body>Inicia sesión primero."
  delete-ask-password = "<tag:'ACCESO'> <body>Esto borra tu cuenta y todo lo guardado en ella. Para seguir, escribe <value>/unregister<body> y tu contraseña en <value><seconds><body> segundos."
  delete-ask-code = "<tag:'ACCESO'> <body>Esto borra tu cuenta y todo lo guardado en ella. Para seguir, escribe <value>/unregister<body> y un código de tu app en <value><seconds><body> segundos."
  delete-wrong = "<etag:'ERROR'> <body>Eso no demuestra que la cuenta sea tuya. No se borró nada. Pide de nuevo para volver a intentarlo."
  delete-not-asked = "<etag:'ERROR'> <body>No hay nada que confirmar. Escribe primero <value>/unregister<body> solo, y luego confirma a tiempo."
  delete-no-proof = "<etag:'ERROR'> <body>Tu cuenta no tiene contraseña ni app para demostrar que es tuya. Pide al staff que la borre."
