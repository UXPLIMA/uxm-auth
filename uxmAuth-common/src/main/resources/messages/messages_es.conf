# Por qué se rechazó una contraseña. <min> y <max> son longitudes en caracteres, <classes> los tipos
# de carácter que aún faltan, unidos con class-separator.
password {
  too-short               = "<etag:'ERROR'> <body>Una contraseña necesita al menos <value><min><body> caracteres."
  too-long                = "<etag:'ERROR'> <body>Una contraseña puede tener como mucho <value><max><body> caracteres."
  too-long-for-the-hash   = "<etag:'ERROR'> <body>Esa contraseña es demasiado larga para guardarla entera. Usa menos letras de fuera del alfabeto inglés."
  bad-characters          = "<etag:'ERROR'> <body>Esa contraseña tiene un carácter que este servidor no permite."
  common                  = "<etag:'ERROR'> <body>Esa contraseña es una de las más comunes. Elige otra."
  breached                = "<etag:'ERROR'> <body>Esa contraseña se conoce por una filtración de datos en otro sitio. Elige otra."
  missing                 = "<etag:'ERROR'> <body>Aquí una contraseña necesita <value><classes><body>."
  class-lower             = "una letra minúscula"
  class-upper             = "una letra mayúscula"
  class-digit             = "un dígito"
  class-symbol            = "un símbolo"
  class-separator         = ", "
}

