  mail-no-address = "<etag:'ERRO'> <body>Vincule um endereço primeiro com <value>/email add <address><body>."
}
# Respostas de /email. <address> é sempre o endereço mascarado, <minutes> quanto dura um código,
# <seconds> quanto falta para outro código poder sair, <left> as tentativas que restam a um código.
email {
  usage = "<body>Use <value>/email add <address><body> para vincular um endereço para onde uma senha esquecida é enviada, <value>/email confirm <code><body> com o código que ele recebe, ou <value>/email remove<body> para tirar."
  linked = "<body>Vinculado agora: <value><address><body>."
  sent = "<good>Um código foi para <value><address><good>. Digite <value>/email confirm <code><good> em até <value><minutes><good> minutos."
  cooldown = "<etag:'ERRO'> <body>Um código acabou de sair. Peça de novo em <value><seconds><body> segundos."
  confirmed = "<good>Vinculado: <value><address><good>. Uma senha esquecida pode ser redefinida por ele."
  wrong = "<etag:'ERRO'> <body>Esse não é o código. Tentativas restantes: <value><left><body>."
  already-linked = "<etag:'ERRO'> <body><value><address><body> já está vinculado."
  removed = "<good><value><address><good> não está mais vinculado."
  not-an-address = "<etag:'ERRO'> <body>Isso não é um endereço de e-mail."
  domain-refused = "<etag:'ERRO'> <body>Este servidor não aceita endereços desse domínio."
  mail-off = "<etag:'ERRO'> <body>Este servidor não envia e-mails."
  mail-failed = "<etag:'ERRO'> <body>O e-mail não pôde ser enviado. Tente mais tarde."
  expired = "<etag:'ERRO'> <body>Esse código é velho demais. Peça um novo com <value>/email add <address><body>."
  nothing-pending = "<etag:'ERRO'> <body>Nenhum código está esperando. Peça um com <value>/email add <address><body>."
  too-many-attempts = "<etag:'ERRO'> <body>As tentativas desse código acabaram. Peça um novo com <value>/email add <address><body>."
  none-linked = "<etag:'ERRO'> <body>Nenhum endereço está vinculado."
  factor-on = "<etag:'ERRO'> <body>Seu código de login vai para este endereço. Desligue isso primeiro com <value>/2fa email off <code><body>."
  required = "<etag:'ERRO'> <body>Este servidor guarda um endereço para uma senha esquecida. Vincule um com <value>/email add <address><body>, depois <value>/email confirm <code><body> com o código que ele recebe."
