# Mensagens em português (Brasil).
#
# Cada linha é MiniMessage, e cada linha nomeia um papel em vez de uma cor: <body> é o texto,
# <value> um nome ou um número, <tag:'LOGIN'> a etiqueta que abre uma linha do chat. As
# cores por trás desses nomes ficam em theme.conf.
#
# Escreva aqui palavras normais. O plugin passa a linha para versaletes ao mostrá-la; á, ã, ç,
# é, ê e as outras letras acentuadas mantêm a forma. O valor small-caps.pt de theme.conf liga e
# desliga isso.
#
# Uma chave que falta aqui volta ao padrão que o código carrega, então o plugin nunca mostra uma
# mensagem vazia. Apague uma linha para ter o padrão de volta.

admin {
  version       = "<tag:'LOGIN'> <body>uxmAuth <value><version>"
  usage         = "<tag:'LOGIN'> <body>Coloque <value>help<body> depois deste comando para ver tudo o que ele faz."
  reloaded      = "<tag:'LOGIN'> <body>A configuração foi carregada de novo, em <value><ms><body> ms."
  reload-failed = "<etag:'ERRO'> <body>O recarregamento falhou. O motivo está no console."

  doctor {
    header = "<h:'Como o plugin está'>"
    ok     = "<good>ok<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>aviso<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>falha<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'LOGIN'> <body>Tudo respondeu."
    unwell = "<etag:'ERRO'> <body>Algo está errado acima. O console tem tudo."
  }
}



# As linhas do ramo de idioma. <language> é o nome de um idioma, e <languages> a lista dos que
# este plugin encontrou. Um idioma é um arquivo nesta pasta: escreva messages_it.conf e o
# italiano é oferecido, sem nova compilação e sem lista para editar.
language {
  current           = "<tag:'LOGIN'> <body>Você lê isto em <value><language><body>."
  choices           = "<tag:'LOGIN'> <body>Você pode ler em <value><languages><body>."
  changed           = "<tag:'LOGIN'> <body>Agora você lê isto em <value><language><body>."
  already           = "<tag:'LOGIN'> <body>Você já lê isto em <value><language><body>."
  reset             = "<tag:'LOGIN'> <body>Você não tem mais um idioma próprio."
  separator         = "<dim>, "
  unknown           = "<etag:'ERRO'> <body>Este servidor não tem <value><input><body>. Ele tem <value><languages><body>."
  forced            = "<etag:'ERRO'> <body>Este servidor usa um só idioma, e é <value><language><body>."

  # O que um operador lê depois de definir ou apagar o idioma de outro jogador. <player> é o
  # nome do jogador. Um jogador ausente recebe a mudança na próxima vez que entrar.
  set-player        = "<tag:'LOGIN'> <value><player><body> agora lê <value><language><body>."
  set-player-away   = "<tag:'LOGIN'> <value><player><body> está ausente e lerá <value><language><body> a partir da próxima entrada."
  reset-player      = "<tag:'LOGIN'> <value><player><body> não tem mais um idioma próprio."
  reset-player-away = "<tag:'LOGIN'> <value><player><body> está ausente, e o idioma dele é apagado na próxima entrada."
  forced-anyway     = "<tag:'LOGIN'> <body>Fica salvo, e todos leem <value><language><body> enquanto isso estiver forçado."
  unknown-player    = "<etag:'ERRO'> <body>Ninguém chamado <value><input><body> jogou aqui."
}

# As linhas que a camada de comandos do uxmLib escreve: a página de ajuda, um argumento
# recusado, um tempo de espera. Elas ficam aqui para serem traduzidas com o resto e coloridas
# por theme.conf. Um valor entre sinais de menor e maior é inserido como está e nunca executado.
command {
  no-permission     = "<etag:'ERRO'> <body>Você não tem permissão para fazer isso."
  player-only       = "<etag:'ERRO'> <body>Só um jogador pode usar este comando."
  invalid-value     = "<etag:'ERRO'> <body><value><input><body> não é um valor válido para <value><argument><body>."
  invalid-value-why = "<etag:'ERRO'> <body><value><input><body> não é um valor válido para <value><argument><body>: <subtext><reason>"
  not-one-of        = "<etag:'ERRO'> <body><value><input><body> não é um valor válido para <value><argument><body>. Tente um de <value><allowed><body>."
  invalid-argument  = "<etag:'ERRO'> <body><detail>"
  bad-argument      = "<etag:'ERRO'> <body>Esse argumento não é válido."
  internal-error    = "<etag:'ERRO'> <body>Algo deu errado ao executar este comando. O motivo está no console."
  on-cooldown       = "<etag:'ERRO'> <body>Espere <value><time><body> antes de usar isso de novo."
  help-header       = "<h:'Ajuda'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command      = "<value><command>"
  help-separator    = "<dim> : "
  help-description  = "<subtext><description>"
  help-fill-hint    = "<subtext>Clique para escrever este comando."
  help-page-hint    = "<subtext>Página <value><page>"
  storage            = "<etag:'ERRO'> <body>Este servidor não consegue acessar as contas agora. Tente de novo em um minuto."
}

# O que um jogador lê enquanto espera para entrar. Os comandos citados aqui são os incluídos: se
# você renomear em commands.conf, escreva os nomes novos aqui também.
join {
  register-title    = "<value>Bem-vindo"
  register-subtitle = "<body>Escolha uma senha com <value>/register"
  login-title       = "<value>Bem-vindo de volta"
  login-subtitle    = "<body>Entre com <value>/login"
  code-title        = "<value>Mais um passo"
  code-subtitle     = "<body>Digite seu código de login com <value>/2fa"
}

reminder {
  register = "<body>Registre-se com <value>/register <password> <password>"
  login    = "<body>Entre com <value>/login <password>"
  code     = "<body>Digite seu código de login com <value>/2fa <code>"
}

chat {
  register-password = "<body>Digite no chat uma senha para este nome. Ninguém mais lê."
  register-repeat   = "<body>Digite a mesma senha de novo."
  login-password    = "<body>Digite sua senha no chat para entrar. Ninguém mais lê."
  code              = "<body>Digite seu código de login no chat: o que seu app mostra, ou o que foi enviado por e-mail."
}

welcome {
  registered = "<good>Sua conta está pronta"
  logged-in  = "<good>Você entrou"
}

# O motivo que um jogador lê na tela para onde é expulso. <min> e <max> são os tamanhos que um nome
# pode ter, <word> a palavra bloqueada que um nome contém, <name> a grafia com que um nome foi
# registrado. Um tempo restante, nas suas duas maiores unidades: <n> é o número.
time {
  days      = "<n>d"
  hours     = "<n>h"
  minutes   = "<n>min"
  seconds   = "<n>s"
  separator = " "
}

kick {
  # <time> é o que resta do banimento.
  banned            = "<body>Muitas senhas erradas vieram do seu endereço. Tente de novo em <value><time><body>."
  too-many-connections = "<body>Muitas conexões vieram do seu endereço. Tente de novo em <value><time><body>."
  # <country> é o código de duas letras que o arquivo de países deu, ou ? quando não conhecia
  # nenhum.
  country           = "<body>Este servidor não aceita jogadores de onde você se conecta."
  logged-out        = "<body>Você saiu. Entre de novo para voltar."
  already-online    = "<body>Alguém já está conectado com este nome. Se era você, espere um pouco e entre de novo."
  cancelled         = "<body>Você saiu antes de entrar. Entre de novo quando quiser."
  storage           = "<body>Este servidor não consegue acessar as contas agora. Tente de novo em um minuto."
  timeout           = "<body>Você demorou demais para entrar. Entre de novo para tentar outra vez."
  timeout-register  = "<body>Você demorou demais para se registrar. Entre de novo para tentar outra vez."
  too-many-attempts = "<body>Muitas senhas erradas. Entre de novo para tentar outra vez."
  name-too-short    = "<body>Seu nome é curto demais aqui. Use um nome com pelo menos <value><min><body> caracteres."
  name-too-long     = "<body>Seu nome é longo demais aqui. Use um nome com no máximo <value><max><body> caracteres."
  name-characters   = "<body>Seu nome tem um caractere que este servidor não permite. Use outro nome."
  name-blocked      = "<body>Seu nome tem uma palavra que este servidor não permite: <value><word>"
  name-case         = "<body>Este nome está registrado como <value><name><body>. Entre de novo com exatamente essa grafia."
  lookup-failed     = "<body>Este servidor não consegue verificar agora se seu nome pertence a uma conta paga de Minecraft. Tente de novo em um minuto."
  paid-name         = "<body>Este nome pertence a uma conta paga de Minecraft, e sua última tentativa não passou na verificação da Mojang. Se o nome é seu, entre pelo launcher oficial. Se não for, entre com outro nome."
  paid-name-moved   = "<body>Este nome agora pertence ao dono pago. Sua conta aqui agora é <value><name><body>: mude seu nome para ele e entre de novo. Sua senha e tudo o que você tinha continuam iguais."
  paid-spelling     = "<body>Este nome pertence a uma conta paga de Minecraft que o escreve com outras maiúsculas. Se a conta é sua, entre pelo launcher oficial. Se não for, entre com outro nome."
  premium-address   = "<body>Este endereço é para contas pagas de Minecraft, e sua última tentativa não passou na verificação da Mojang. Entre pelo outro endereço do servidor para jogar com senha."
  name-disputed     = "<body>Dois jogadores querem este nome, e a equipe vai resolver. Entre de novo quando resolverem."
  name-kept         = "<body>Outro jogador pegou este nome aqui primeiro e fica com ele. Mude seu nome na Mojang para jogar aqui."
  claimed           = "<body>Entre de novo pelo launcher oficial do Minecraft. Sua próxima conexão daqui prova que este nome é seu."
  network-claim     = "<body>Este servidor não conseguiu confirmar seu login com a rede. Entre de novo."
  start-failed      = "O login deste servidor não conseguiu iniciar, então ninguém pode entrar até a equipe consertar. Tente mais tarde."
}

# As respostas a /login, /register, /changepassword e /logout. <left> é quantas tentativas restam,
# <name> um nome como o dono escreveu, <old> e <new> os nomes entre os quais uma conta mudou quando
# o dono pago do nome provou.
login {
  wrong          = "<etag:'ERRO'> <body>Essa senha está errada. Tentativas restantes: <value><left><body>."
  not-registered = "<etag:'ERRO'> <body>Você ainda não tem senha aqui. Registre-se com <value>/register<body>."
  already        = "<tag:'LOGIN'> <body>Você já entrou."
  usage          = "<tag:'LOGIN'> <body>Digite sua senha depois do comando: <value>/login <password>"
  must-replace   = "<body>Sua senha estava certa, mas não segue mais as regras deste servidor. Defina uma nova com <value>/changepassword <current> <new><body> para entrar."
  handshake-failed = "<tag:'LOGIN'> <body>Sua última conexão foi recusada porque este nome pertence a uma conta paga de Minecraft e a Mojang não confirmou que era você. Desta vez você entrou com senha. Se o nome é seu, use <value>/claim<body>."
  renamed          = "<tag:'LOGIN'> <body>O dono pago de <value><old><body> provou o nome, então sua conta mudou para <value><new><body> com tudo o que tinha. Entre como <value><new><body> a partir de agora."
  refused = "<tag:'LOGIN'> <body>Seu login foi recusado."
}

# As respostas a /claim e /premium.
claim {
  unavailable     = "<etag:'ERRO'> <body>Este servidor não pode perguntar à Mojang de quem é um nome, então não há nada para reivindicar aqui."
  already-premium = "<tag:'LOGIN'> <body>Sua conta já provou o nome."
  not-this-rule   = "<etag:'ERRO'> <body>Este servidor verifica nomes pagos sozinho, então não há nada para reivindicar."
  shared-address  = "<etag:'ERRO'> <body>Você se conecta por um serviço que esconde seu próprio endereço, então uma reivindicação não pode ser ligada à sua próxima conexão. Peça à equipe para resolver o nome."
}

premium {
  log-in-first = "<etag:'ERRO'> <body>Entre primeiro, depois use <value>/premium<body> para provar seu nome na próxima conexão."
}

# O que o proxy de uma rede diz a um jogador que ainda não entrou.
network {
  log-in-first = "<etag:'ERRO'> <body>Entre primeiro. Até lá você fica neste servidor, e os comandos da rede esperam."
}

register {
  rules-needed   = "<etag:'ERRO'> <body>Marque primeiro a caixa para aceitar as regras."
  too-many-accounts = "<etag:'ERRO'> <body>Muitas contas foram criadas do seu endereço recentemente. Tente mais tarde."
  mismatch       = "<etag:'ERRO'> <body>As duas senhas não são iguais."
  confirm-needed = "<etag:'ERRO'> <body>Escreva a senha duas vezes: <value>/register <password> <password>"
  usage          = "<tag:'LOGIN'> <body>Digite uma senha depois do comando, duas vezes: <value>/register <password> <password>"
  usage-once     = "<tag:'LOGIN'> <body>Digite uma senha depois do comando: <value>/register <password>"
  name-taken     = "<etag:'ERRO'> <body>O nome <value><name><body> já tem uma conta."
  already        = "<etag:'ERRO'> <body>Você já tem uma conta. Entre com <value>/login<body>."
  refused = "<tag:'LOGIN'> <body>Seu registro foi recusado."
}

change {
  done          = "<good>Sua senha foi alterada. Todas as sessões lembradas com ela acabaram."
  wrong-old     = "<etag:'ERRO'> <body>A senha antiga está errada."
  not-logged-in = "<etag:'ERRO'> <body>Entre primeiro."
  needs-both    = "<etag:'ERRO'> <body>Escreva a senha antiga, depois a nova."
  usage         = "<tag:'LOGIN'> <body>Digite a senha antiga e depois a nova: <value>/changepassword <old> <new>"
  usage-once    = "<tag:'LOGIN'> <body>Digite a nova senha depois do comando: <value>/changepassword <new>"
}

# O captcha. Um código novo é sorteado a cada exibição, e qualquer resposta o gasta.
captcha {
  usage   = "<tag:'LOGIN'> <body>Digite o código depois do comando: <value>/captcha <code>"
  needed  = "<etag:'ERRO'> <body>Resolva o captcha primeiro."
  wrong   = "<etag:'ERRO'> <body>Esse não era o código. Aqui está um novo."
  solved  = "<good>Captcha resolvido. Pode seguir."
  map     = "<body>Leia o código no mapa na sua mão e digite <value>/captcha <code><body>."
  map-chat = "<body>Leia o código no mapa na sua mão e digite no chat."
  nothing = "<etag:'ERRO'> <body>Não há captcha para responder."
}

# As respostas a /session. <minutes> é por quanto tempo um login do mesmo endereço pula a senha.
session {
  usage        = "<body>Use <value>/session on<body> para pular a senha deste endereço na próxima vez, ou <value>/session off<body> para que ela seja pedida a cada entrada."
  on           = "<good>Deste endereço você pula a senha por <value><minutes><good> minutos depois de cada login."
  off          = "<good>Sua senha será pedida a cada entrada."
  log-in-first = "<etag:'ERRO'> <body>Entre primeiro, depois escolha."
  not-chosen   = "<etag:'ERRO'> <body>Este servidor decide as sessões para todos, então não há nada para escolher."
}

# As respostas a /2fa. <secret> é a chave que um app recebe, <link> a mesma como link, e <minutes>
# quanto tempo uma configuração espera o primeiro código.
factor {
  usage           = "<body>Use <value>/2fa setup<body> para pedir um código de um app autenticador depois da senha, <value>/2fa email on<body> para receber por e-mail, <value>/2fa backup <code><body> para novos códigos de backup, ou <value>/2fa off <code><body> para parar."
  secret          = "<body>Adicione uma conta no seu app autenticador com esta chave: <value><secret><body>. Clique para copiar."
