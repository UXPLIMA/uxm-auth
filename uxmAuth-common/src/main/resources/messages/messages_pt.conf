  log-in-first = "<etag:'ERRO'> <body>Entre primeiro."
  delete-ask-password = "<tag:'LOGIN'> <body>Isto apaga sua conta e tudo guardado nela. Para continuar, digite <value>/unregister<body> e sua senha em até <value><seconds><body> segundos."
  delete-ask-code = "<tag:'LOGIN'> <body>Isto apaga sua conta e tudo guardado nela. Para continuar, digite <value>/unregister<body> e um código do seu app em até <value><seconds><body> segundos."
  delete-wrong = "<etag:'ERRO'> <body>Isso não prova que a conta é sua. Nada foi apagado. Peça de novo para tentar outra vez."
  delete-not-asked = "<etag:'ERRO'> <body>Não há nada para confirmar. Digite primeiro só <value>/unregister<body>, depois confirme a tempo."
  delete-no-proof = "<etag:'ERRO'> <body>Sua conta não tem senha nem app para provar que é sua. Peça para a equipe apagar."
