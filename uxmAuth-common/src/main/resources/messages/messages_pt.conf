  wrong           = "<etag:'ERRO'> <body>Esse não é o código que seu app mostra agora nem um código de backup."
  nothing-started = "<etag:'ERRO'> <body>Nenhuma configuração está esperando. Comece uma com <value>/2fa setup<body>."
  already-on      = "<etag:'ERRO'> <body>Sua conta já pede um código de um app. Desligue primeiro com <value>/2fa off <code><body>."
  not-on          = "<etag:'ERRO'> <body>Sua conta não pede código de nenhum app."
  required        = "<etag:'ERRO'> <body>Sua conta precisa pedir um código de um app autenticador antes que você possa jogar. Digite <value>/2fa setup<body> para configurar."
  log-in-first    = "<etag:'ERRO'> <body>Entre primeiro."
  code-needed     = "<body>Agora digite o código do seu app autenticador, o enviado por e-mail ou um código de backup, com <value>/2fa <code><body>."
