  nothing-pending = "<etag:'ERRO'> <body>Nenhum código está esperando. Peça um com <value>/recover<body>."
  too-many-attempts = "<etag:'ERRO'> <body>As tentativas desse código acabaram. Peça um novo com <value>/recover<body>."
}



logout {
  not-logged-in = "<etag:'ERRO'> <body>Você não entrou."
  sessions-ended = "<body>Sua senha foi alterada, então você foi desconectado. Entre com a nova."
}

# A conta do próprio jogador: /unregister e /cracked, o último login e a senha de backup. <seconds>
# é quanto a confirmação espera, <date> e <address> o login anterior, mascarado.
