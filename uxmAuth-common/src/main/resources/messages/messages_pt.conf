  usage = "<etag:'ERRO'> <body>Digite <value>/recover<body> para um código, depois <value>/recover <code> <new password><body>."
  done = "<good>Sua nova senha foi definida. Entre com <value>/login <password><good>."
  wrong = "<etag:'ERRO'> <body>Esse não é o código. Tentativas restantes: <value><left><body>."
