# Por que uma senha foi recusada. <min> e <max> são tamanhos em caracteres, <classes> os tipos de
# caractere que ainda faltam, unidos por class-separator.
password {
  too-short               = "<etag:'ERRO'> <body>Uma senha precisa de pelo menos <value><min><body> caracteres."
  too-long                = "<etag:'ERRO'> <body>Uma senha pode ter no máximo <value><max><body> caracteres."
  too-long-for-the-hash   = "<etag:'ERRO'> <body>Essa senha é longa demais para ser guardada inteira. Use menos letras fora do alfabeto inglês."
  bad-characters          = "<etag:'ERRO'> <body>Essa senha tem um caractere que este servidor não permite."
  common                  = "<etag:'ERRO'> <body>Essa senha é uma das mais comuns. Escolha outra."
  breached                = "<etag:'ERRO'> <body>Essa senha é conhecida de um vazamento de dados em outro lugar. Escolha outra."
  missing                 = "<etag:'ERRO'> <body>Aqui uma senha precisa de <value><classes><body>."
  class-lower             = "uma letra minúscula"
  class-upper             = "uma letra maiúscula"
  class-digit             = "um dígito"
  class-symbol            = "um símbolo"
  class-separator         = ", "
}

