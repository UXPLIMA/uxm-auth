# Сообщения на русском.
#
# Каждая строка написана в MiniMessage, и каждая строка называет роль вместо цвета: <body> это
# текст, <value> имя или число, <tag:'ВХОД'> метка в начале строки чата. Цвета за этими
# именами лежат в theme.conf.
#
# Пиши здесь обычные слова. Капитель есть только у латинских букв, поэтому русский текст
# выводится как написан; в small-caps файла theme.conf русского нет.
#
# Ключ, которого здесь нет, берёт значение по умолчанию из кода, так что плагин никогда не
# покажет пустое сообщение. Удали строку, чтобы вернуть значение по умолчанию.

admin {
  version       = "<tag:'ВХОД'> <body>uxmAuth <value><version>"
  usage         = "<tag:'ВХОД'> <body>Добавь <value>help<body> после этой команды, чтобы увидеть всё, что она умеет."
  reloaded      = "<tag:'ВХОД'> <body>Настройки загружены заново за <value><ms><body> мс."
  reload-failed = "<etag:'ОШИБКА'> <body>Перезагрузка не удалась. Причина в консоли."

  doctor {
    header = "<h:'Состояние плагина'>"
    ok     = "<good>ок<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>внимание<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>сбой<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'ВХОД'> <body>Всё ответило."
    unwell = "<etag:'ОШИБКА'> <body>Выше что-то не так. В консоли всё подробно."
  }
}



# Строки ветки языка. <language> это название одного языка, а <languages> список тех, что нашёл
# этот плагин. Язык это файл в этой папке: напиши messages_it.conf, и появится итальянский, без
# новой сборки и без списка, который надо править.
language {
  current           = "<tag:'ВХОД'> <body>Ты читаешь это на языке: <value><language><body>."
  choices           = "<tag:'ВХОД'> <body>Можно читать на: <value><languages><body>."
  changed           = "<tag:'ВХОД'> <body>Теперь ты читаешь это на языке: <value><language><body>."
  already           = "<tag:'ВХОД'> <body>Ты уже читаешь это на языке: <value><language><body>."
  reset             = "<tag:'ВХОД'> <body>У тебя больше нет своего языка."
  separator         = "<dim>, "
  unknown           = "<etag:'ОШИБКА'> <body>На этом сервере нет <value><input><body>. Есть <value><languages><body>."
  forced            = "<etag:'ОШИБКА'> <body>Этот сервер говорит на одном языке: <value><language><body>."

  # Что читает оператор, когда задал или сбросил язык другого игрока. <player> это имя игрока.
  # Игрок, которого нет на сервере, получит изменение при следующем входе.
  set-player        = "<tag:'ВХОД'> <value><player><body> теперь читает на языке: <value><language><body>."
  set-player-away   = "<tag:'ВХОД'> <value><player><body> не в сети и со следующего входа будет читать на языке: <value><language><body>."
  reset-player      = "<tag:'ВХОД'> <body>У <value><player><body> больше нет своего языка."
  reset-player-away = "<tag:'ВХОД'> <value><player><body> не в сети, язык сбросится при следующем входе."
  forced-anyway     = "<tag:'ВХОД'> <body>Сохранено, но пока язык навязан, все читают на языке: <value><language><body>."
  unknown-player    = "<etag:'ОШИБКА'> <body>Никто по имени <value><input><body> здесь не играл."
}

# Строки, которые пишет командный слой uxmLib: страница помощи, отклонённый аргумент, ожидание.
# Они здесь, чтобы их переводили вместе с остальным и красили из theme.conf. Значение в угловых
# скобках вставляется как написано и никогда не выполняется.
command {
  no-permission     = "<etag:'ОШИБКА'> <body>У тебя нет на это прав."
  player-only       = "<etag:'ОШИБКА'> <body>Эту команду может выполнить только игрок."
  invalid-value     = "<etag:'ОШИБКА'> <body><value><input><body> не подходит как <value><argument><body>."
  invalid-value-why = "<etag:'ОШИБКА'> <body><value><input><body> не подходит как <value><argument><body>: <subtext><reason>"
  not-one-of        = "<etag:'ОШИБКА'> <body><value><input><body> не подходит как <value><argument><body>. Попробуй одно из: <value><allowed><body>."
  invalid-argument  = "<etag:'ОШИБКА'> <body><detail>"
  bad-argument      = "<etag:'ОШИБКА'> <body>Этот аргумент не подходит."
  internal-error    = "<etag:'ОШИБКА'> <body>При выполнении команды что-то пошло не так. Причина в консоли."
  on-cooldown       = "<etag:'ОШИБКА'> <body>Подожди <value><time><body>, прежде чем использовать это снова."
  help-header       = "<h:'Помощь'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command      = "<value><command>"
  help-separator    = "<dim> : "
  help-description  = "<subtext><description>"
  help-fill-hint    = "<subtext>Нажми, чтобы написать эту команду."
  help-page-hint    = "<subtext>Страница <value><page>"
  storage            = "<etag:'ОШИБКА'> <body>Сервер сейчас не может связаться с аккаунтами. Попробуй через минуту."
}

# Что игрок читает, пока ждёт входа. Названные здесь команды это поставляемые: если ты переименуешь
# их в commands.conf, напиши новые имена и здесь.
join {
  register-title    = "<value>Добро пожаловать"
  register-subtitle = "<body>Придумай пароль: <value>/register"
  login-title       = "<value>С возвращением"
  login-subtitle    = "<body>Войди: <value>/login"
  code-title        = "<value>Ещё один шаг"
  code-subtitle     = "<body>Введи код входа: <value>/2fa"
}

reminder {
  register = "<body>Зарегистрируйся: <value>/register <password> <password>"
  login    = "<body>Войди: <value>/login <password>"
  code     = "<body>Введи код входа: <value>/2fa <code>"
}

chat {
  register-password = "<body>Напиши в чат пароль для этого ника. Его никто больше не видит."
  register-repeat   = "<body>Напиши тот же пароль ещё раз."
  login-password    = "<body>Напиши пароль в чат, чтобы войти. Его никто больше не видит."
  code              = "<body>Напиши в чат код входа: из приложения или из письма."
}

welcome {
  registered = "<good>Твой аккаунт готов"
  logged-in  = "<good>Вход выполнен"
}

# Причина, которую игрок видит на экране после кика. <min> и <max> это допустимая длина ника, <word>
# запрещённое слово в нике, <name> написание, под которым ник зарегистрирован. Оставшееся время в
# двух крупнейших единицах: <n> это число.
time {
  days      = "<n>д"
  hours     = "<n>ч"
  minutes   = "<n>м"
  seconds   = "<n>с"
  separator = " "
}

kick {
  # <time> это сколько осталось до конца бана.
  banned            = "<body>С твоего адреса пришло слишком много неверных паролей. Попробуй через <value><time><body>."
  too-many-connections = "<body>С твоего адреса пришло слишком много подключений. Попробуй через <value><time><body>."
  # <country> это двухбуквенный код из файла стран или ?, если он ничего не знал.
  country           = "<body>Этот сервер не принимает игроков оттуда, откуда ты подключаешься."
  logged-out        = "<body>Ты вышел. Зайди снова, чтобы вернуться."
  already-online    = "<body>Под этим ником уже кто-то подключён. Если это был ты, подожди немного и зайди снова."
  cancelled         = "<body>Ты ушёл, не войдя. Заходи, когда захочешь."
  storage           = "<body>Сервер сейчас не может связаться с аккаунтами. Попробуй через минуту."
  timeout           = "<body>Ты слишком долго входил. Зайди снова, чтобы попробовать ещё раз."
  timeout-register  = "<body>Ты слишком долго регистрировался. Зайди снова, чтобы попробовать ещё раз."
  too-many-attempts = "<body>Слишком много неверных паролей. Зайди снова, чтобы попробовать ещё раз."
  name-too-short    = "<body>Твой ник здесь слишком короткий. Возьми ник не короче <value><min><body> символов."
  name-too-long     = "<body>Твой ник здесь слишком длинный. Возьми ник не длиннее <value><max><body> символов."
  name-characters   = "<body>В твоём нике есть символ, который этот сервер не разрешает. Возьми другой ник."
  name-blocked      = "<body>В твоём нике есть слово, которое этот сервер не разрешает: <value><word>"
  name-case         = "<body>Этот ник зарегистрирован как <value><name><body>. Зайди снова точно с таким написанием."
  lookup-failed     = "<body>Сервер сейчас не может проверить, принадлежит ли твой ник лицензионному аккаунту Minecraft. Попробуй через минуту."
  paid-name         = "<body>Этот ник принадлежит лицензионному аккаунту Minecraft, а твоя последняя попытка не прошла проверку Mojang. Если ник твой, заходи из официального лаунчера. Если нет, заходи под другим ником."
  paid-name-moved   = "<body>Этот ник теперь принадлежит своему лицензионному владельцу. Твой аккаунт здесь теперь <value><name><body>: смени ник на него и зайди снова. Пароль и всё, что у тебя было, остались как были."
  paid-spelling     = "<body>Этот ник принадлежит лицензионному аккаунту Minecraft, но с другими заглавными буквами. Если аккаунт твой, заходи из официального лаунчера. Если нет, заходи под другим ником."
  premium-address   = "<body>Этот адрес для лицензионных аккаунтов Minecraft, а твоя последняя попытка не прошла проверку Mojang. Заходи через другой адрес сервера, чтобы играть с паролем."
  name-disputed     = "<body>Этот ник хотят два игрока, и спор решит персонал. Зайди снова, когда он будет решён."
  name-kept         = "<body>Другой игрок занял этот ник здесь первым и оставляет его себе. Смени ник в Mojang, чтобы играть здесь."
  claimed           = "<body>Зайди снова из официального лаунчера Minecraft. Следующее подключение отсюда докажет, что ник твой."
  network-claim     = "<body>Сервер не смог подтвердить твой вход в сети. Зайди снова."
  start-failed      = "Вход на этот сервер не смог запуститься, поэтому никто не может зайти, пока персонал это не починит. Попробуй позже."
}

# Ответы на /login, /register, /changepassword и /logout. <left> это сколько осталось попыток,
# <name> ник в написании владельца, <old> и <new> ники, между которыми переехал аккаунт, когда
# лицензионный владелец ника его доказал.
login {
  wrong          = "<etag:'ОШИБКА'> <body>Неверный пароль. Осталось попыток: <value><left><body>."
  not-registered = "<etag:'ОШИБКА'> <body>У тебя здесь ещё нет пароля. Зарегистрируйся: <value>/register<body>."
  already        = "<tag:'ВХОД'> <body>Ты уже вошёл."
  usage          = "<tag:'ВХОД'> <body>Напиши пароль после команды: <value>/login <password>"
  must-replace   = "<body>Пароль верный, но он больше не подходит под правила сервера. Задай новый через <value>/changepassword <current> <new><body>, чтобы войти."
  handshake-failed = "<tag:'ВХОД'> <body>Твоё последнее подключение отклонено: этот ник принадлежит лицензионному аккаунту Minecraft, и Mojang не подтвердил, что это ты. В этот раз ты вошёл по паролю. Если ник твой, используй <value>/claim<body>."
  renamed          = "<tag:'ВХОД'> <body>Лицензионный владелец <value><old><body> доказал ник, поэтому твой аккаунт со всем, что было, переехал на <value><new><body>. Теперь заходи как <value><new><body>."
  refused = "<tag:'ВХОД'> <body>Твой вход отклонён."
}

# Ответы на /claim и /premium.
claim {
  unavailable     = "<etag:'ОШИБКА'> <body>Этот сервер не может спросить у Mojang, чей это ник, поэтому здесь нечего заявлять."
  already-premium = "<tag:'ВХОД'> <body>Твой аккаунт уже доказал свой ник."
  not-this-rule   = "<etag:'ОШИБКА'> <body>Этот сервер сам проверяет лицензионные ники, поэтому заявлять нечего."
  shared-address  = "<etag:'ОШИБКА'> <body>Ты подключаешься через сервис, который скрывает твой адрес, поэтому заявку нельзя привязать к следующему подключению. Попроси персонал решить вопрос с ником."
}

premium {
  log-in-first = "<etag:'ОШИБКА'> <body>Сначала войди, потом используй <value>/premium<body>, чтобы доказать ник при следующем подключении."
}

# Что прокси сети говорит игроку, который ещё не вошёл.
network {
  log-in-first = "<etag:'ОШИБКА'> <body>Сначала войди. До тех пор ты остаёшься на этом сервере, а команды сети ждут."
}

register {
  rules-needed   = "<etag:'ОШИБКА'> <body>Сначала поставь галочку, чтобы принять правила."
  too-many-accounts = "<etag:'ОШИБКА'> <body>С твоего адреса недавно создано слишком много аккаунтов. Попробуй позже."
  mismatch       = "<etag:'ОШИБКА'> <body>Пароли не совпадают."
  confirm-needed = "<etag:'ОШИБКА'> <body>Напиши пароль дважды: <value>/register <password> <password>"
  usage          = "<tag:'ВХОД'> <body>Напиши пароль после команды дважды: <value>/register <password> <password>"
  usage-once     = "<tag:'ВХОД'> <body>Напиши пароль после команды: <value>/register <password>"
  name-taken     = "<etag:'ОШИБКА'> <body>У ника <value><name><body> уже есть аккаунт."
  already        = "<etag:'ОШИБКА'> <body>У тебя уже есть аккаунт. Войди: <value>/login<body>."
  refused = "<tag:'ВХОД'> <body>Твоя регистрация отклонена."
}

change {
  done          = "<good>Пароль изменён. Все сохранённые сессии с ним завершены."
  wrong-old     = "<etag:'ОШИБКА'> <body>Старый пароль неверный."
  not-logged-in = "<etag:'ОШИБКА'> <body>Сначала войди."
  needs-both    = "<etag:'ОШИБКА'> <body>Напиши старый пароль, потом новый."
  usage         = "<tag:'ВХОД'> <body>Напиши старый пароль, а потом новый: <value>/changepassword <old> <new>"
  usage-once    = "<tag:'ВХОД'> <body>Напиши новый пароль после команды: <value>/changepassword <new>"
}

# Капча. Для каждого показа берётся новый код, и любой ответ его расходует.
captcha {
  usage   = "<tag:'ВХОД'> <body>Напиши код после команды: <value>/captcha <code>"
  needed  = "<etag:'ОШИБКА'> <body>Сначала реши капчу."
  wrong   = "<etag:'ОШИБКА'> <body>Это не тот код. Вот новый."
  solved  = "<good>Капча решена. Продолжай."
  map     = "<body>Прочитай код на карте в руке и напиши <value>/captcha <code><body>."
  map-chat = "<body>Прочитай код на карте в руке и напиши его в чат."
  nothing = "<etag:'ОШИБКА'> <body>Нет капчи, на которую нужно ответить."
}

# Ответы на /session. <minutes> это сколько вход с того же адреса пропускает пароль.
session {
  usage        = "<body>Используй <value>/session on<body>, чтобы в следующий раз пропустить пароль с этого адреса, или <value>/session off<body>, чтобы его спрашивали при каждом входе."
  on           = "<good>С этого адреса ты пропускаешь пароль на <value><minutes><good> мин. после каждого входа."
  off          = "<good>Пароль будут спрашивать при каждом входе."
  log-in-first = "<etag:'ОШИБКА'> <body>Сначала войди, потом выбирай."
  not-chosen   = "<etag:'ОШИБКА'> <body>Этот сервер решает за всех, поэтому выбирать нечего."
}

# Ответы на /2fa. <secret> это ключ для приложения, <link> он же в виде ссылки, а <minutes> сколько
# настройка ждёт первый код.
factor {
  usage           = "<body>Используй <value>/2fa setup<body>, чтобы после пароля спрашивать код из приложения-аутентификатора, <value>/2fa email on<body>, чтобы получать его по почте, <value>/2fa backup <code><body> для новых резервных кодов или <value>/2fa off <code><body>, чтобы отключить."
  secret          = "<body>Добавь аккаунт в приложение-аутентификатор с этим ключом: <value><secret><body>. Нажми, чтобы скопировать."
  link            = "<body>Или открой эту ссылку на телефоне: <value><link><body>. Нажми, чтобы скопировать."
  map             = "<body>Или отсканируй QR-код на карте в руке."
  no-room         = "<body>Освободи слот на панели быстрого доступа и выполни <value>/2fa setup<body> снова, чтобы получить QR-код на карте."
  confirm         = "<body>Потом напиши <value>/2fa confirm <code><body> с кодом из приложения. Ожидание: <value><minutes><body> мин."
  on              = "<good>Теперь после пароля твой аккаунт спрашивает код из приложения."
  backup-codes    = "<body>Твои резервные коды на случай потери телефона: <value><codes><body>. Каждый срабатывает один раз вместо кода приложения. Нажми, чтобы скопировать, и храни их надёжно, они больше не покажутся."
  off             = "<good>Твой аккаунт больше не спрашивает код из приложения."
  wrong           = "<etag:'ОШИБКА'> <body>Это не текущий код приложения и не резервный код."
  nothing-started = "<etag:'ОШИБКА'> <body>Никакая настройка не ждёт. Начни её с <value>/2fa setup<body>."
  already-on      = "<etag:'ОШИБКА'> <body>Твой аккаунт уже спрашивает код из приложения. Сначала отключи: <value>/2fa off <code><body>."
  not-on          = "<etag:'ОШИБКА'> <body>Твой аккаунт не спрашивает код из приложения."
  required        = "<etag:'ОШИБКА'> <body>Прежде чем играть, твой аккаунт должен спрашивать код из приложения-аутентификатора. Напиши <value>/2fa setup<body>, чтобы настроить."
  log-in-first    = "<etag:'ОШИБКА'> <body>Сначала войди."
  code-needed     = "<body>Теперь напиши код из приложения-аутентификатора, из письма или резервный код: <value>/2fa <code><body>."
  login-wrong     = "<etag:'ОШИБКА'> <body>Это не текущий код приложения, не код из письма и не резервный код. Осталось попыток: <value><left><body>."
  nothing-asked   = "<etag:'ОШИБКА'> <body>Сейчас от тебя не ждут кода."
  mail-on         = "<good>Теперь после пароля код входа приходит на <value><address><good>."
  mail-off        = "<good>Коды входа по почте больше не приходят."
  mail-already-on = "<etag:'ОШИБКА'> <body>Коды входа уже приходят тебе по почте."
  mail-not-on     = "<etag:'ОШИБКА'> <body>Коды входа тебе по почте не приходят."
