  map             = "<body>Ya da elindeki haritadaki QR kodunu okut."
  no-room         = "<body>QR kodunu haritada almak için hızlı çubuğunda bir yuva boşalt ve <value>/2fa setup<body> komutunu yeniden yaz."
  confirm         = "<body>Sonra uygulamanın gösterdiği kodla <value>/2fa confirm <kod><body> yaz. Kurulum <value><minutes><body> dakika bekler."
  on              = "<good>Artık hesabın şifreden sonra uygulamandan bir kod soruyor."
  backup-codes    = "<body>Telefonunu kaybedersen diye yedek kodların: <value><codes><body>. Her biri uygulamanın kodu yerine bir kez geçer. Kopyalamak için tıkla ve güvenli bir yerde sakla, bir daha gösterilmezler."
  off             = "<good>Hesabın artık bir uygulamadan kod sormuyor."
  wrong           = "<etag:'HATA'> <body>Bu ne uygulamanın şu an gösterdiği kod ne de bir yedek kod."
  nothing-started = "<etag:'HATA'> <body>Bekleyen bir kurulum yok. <value>/2fa setup<body> ile başlat."
  already-on      = "<etag:'HATA'> <body>Hesabın zaten bir uygulamadan kod soruyor. Önce <value>/2fa off <kod><body> ile kapat."
  not-on          = "<etag:'HATA'> <body>Hesabın bir uygulamadan kod sormuyor."
  required        = "<etag:'HATA'> <body>Oynayabilmen için hesabının bir doğrulama uygulamasından kod sorması gerekiyor. Kurmak için <value>/2fa setup<body> yaz."
  log-in-first    = "<etag:'HATA'> <body>Önce giriş yap."
  code-needed     = "<body>Şimdi doğrulama uygulamandaki kodu, sana gönderilen kodu ya da bir yedek kodu <value>/2fa <kod><body> ile yaz."
  login-wrong     = "<etag:'HATA'> <body>Bu ne uygulamanın şu anki kodu, ne e-postayla gelen kod, ne de bir yedek kod. Kalan deneme: <value><left><body>."
  nothing-asked   = "<etag:'HATA'> <body>Şu an senden bir kod istenmiyor."
  mail-on         = "<good>Artık şifrenden sonra <value><address><good> adresine bir giriş kodu gönderilecek."
  mail-off        = "<good>Artık sana e-postayla giriş kodu gönderilmeyecek."
  mail-already-on = "<etag:'HATA'> <body>Giriş kodların zaten e-postayla geliyor."
  mail-not-on     = "<etag:'HATA'> <body>Sana e-postayla giriş kodu gönderilmiyor."
  mail-no-address = "<etag:'HATA'> <body>Önce <value>/email add <adres><body> ile bir adres bağla."
}
# /email answers. <address> is always the masked address, <minutes> how long a code lasts,
# <seconds> how long before another code may go, <left> the tries a code has left.
email {
  usage = "<body>Unutulan şifre için bir adres bağlamak üzere <value>/email add <adres><body>, gelen kodla <value>/email confirm <kod><body>, kaldırmak için <value>/email remove<body> yaz."
  linked = "<body>Şu an bağlı: <value><address><body>."
  sent = "<good><value><address><good> adresine bir kod gitti. <value><minutes><good> dakika içinde <value>/email confirm <kod><good> yaz."
  cooldown = "<etag:'HATA'> <body>Az önce bir kod gönderildi. <value><seconds><body> saniye sonra yeniden iste."
  confirmed = "<good>Bağlandı: <value><address><good>. Unutulan şifre bu adresle yeniden belirlenebilir."
  wrong = "<etag:'HATA'> <body>Kod bu değil. Kalan deneme: <value><left><body>."
  already-linked = "<etag:'HATA'> <body><value><address><body> zaten bağlı."
  removed = "<good><value><address><good> artık bağlı değil."
  not-an-address = "<etag:'HATA'> <body>Bu bir e-posta adresi değil."
  domain-refused = "<etag:'HATA'> <body>Bu sunucu o alan adındaki adresleri kabul etmiyor."
  mail-off = "<etag:'HATA'> <body>Bu sunucu e-posta göndermiyor."
  mail-failed = "<etag:'HATA'> <body>E-posta gönderilemedi. Sonra yeniden dene."
  expired = "<etag:'HATA'> <body>Bu kodun süresi geçti. <value>/email add <adres><body> ile yenisini iste."
  nothing-pending = "<etag:'HATA'> <body>Bekleyen bir kod yok. <value>/email add <adres><body> ile iste."
  too-many-attempts = "<etag:'HATA'> <body>Bu kodun deneme hakları bitti. <value>/email add <adres><body> ile yenisini iste."
  none-linked = "<etag:'HATA'> <body>Bağlı bir adres yok."
  factor-on = "<etag:'HATA'> <body>Giriş kodun bu adrese gidiyor. Önce <value>/2fa email off <kod><body> ile kapat."
  required = "<etag:'HATA'> <body>Bu sunucu unutulan şifre için bir adres ister. <value>/email add <adres><body> ile bir adres bağla, sonra gelen kodla <value>/email confirm <kod><body> yaz."
  required-keep = "<etag:'HATA'> <body>Bu sunucu bir adres ister, bu yüzden kaldırılamaz. Değiştirmek için <value>/email add <adres><body> ile başka bir adres bağla."
  log-in-first = "<etag:'HATA'> <body>Önce giriş yap."
}
# /recover answers. <address> is the masked address, <minutes> how long the code lasts.
recover {
  sent = "<good><value><address><good> adresine bir kod gitti. <value><minutes><good> dakika içinde <value>/recover <kod> <yeni şifre><good> yaz."
  cooldown = "<etag:'HATA'> <body>Az önce bir kod gönderildi. <value><seconds><body> saniye sonra yeniden iste."
  no-address = "<etag:'HATA'> <body>Bu hesaba bağlı bir adres yok, kod gönderilemez. Yetkililere başvur."
  not-waiting = "<etag:'HATA'> <body>Şifre girişte, yazılmadan önce kurtarılır."
  usage = "<etag:'HATA'> <body>Kod için <value>/recover<body> yaz, sonra <value>/recover <kod> <yeni şifre><body>."
  done = "<good>Yeni şifren belirlendi. <value>/login <şifre><good> ile giriş yap."
  wrong = "<etag:'HATA'> <body>Kod bu değil. Kalan deneme: <value><left><body>."
  expired = "<etag:'HATA'> <body>Bu kodun süresi geçti. <value>/recover<body> ile yenisini iste."
  nothing-pending = "<etag:'HATA'> <body>Bekleyen bir kod yok. <value>/recover<body> ile iste."
  too-many-attempts = "<etag:'HATA'> <body>Bu kodun deneme hakları bitti. <value>/recover<body> ile yenisini iste."
}



logout {
  not-logged-in = "<etag:'HATA'> <body>Giriş yapmış değilsin."
  sessions-ended = "<body>Şifren değiştirildi, bu yüzden oturumun kapandı. Yeni şifrenle giriş yap."
}

# Bir şifrenin neden reddedildiği. <min> ve <max> karakter sayısı, <classes> eksik kalan
# karakter türleri, class-separator ile birleştirilir.
password {
  too-short               = "<etag:'HATA'> <body>Şifre en az <value><min><body> karakter olmalı."
  too-long                = "<etag:'HATA'> <body>Şifre en fazla <value><max><body> karakter olabilir."
  too-long-for-the-hash   = "<etag:'HATA'> <body>Bu şifre tam saklanamayacak kadar uzun. İngiliz alfabesi dışındaki harflerden daha az kullan."
  bad-characters          = "<etag:'HATA'> <body>Bu şifrede sunucunun izin vermediği bir karakter var."
