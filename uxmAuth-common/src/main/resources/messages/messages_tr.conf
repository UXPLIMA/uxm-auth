factor {
  usage           = "<body>Şifreden sonra bir doğrulama uygulamasından kod sorulması için <value>/2fa setup<body>, kodu e-postayla almak için <value>/2fa email on<body>, yeni yedek kodlar için <value>/2fa backup <kod><body>, kapatmak için <value>/2fa off <kod><body> yaz."
  secret          = "<body>Doğrulama uygulamanda bu anahtarla bir hesap ekle: <value><secret><body>. Kopyalamak için tıkla."
