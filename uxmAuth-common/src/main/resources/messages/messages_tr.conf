# Türkçe mesajlar.
#
# Her satır MiniMessage biçimindedir ve renk yerine rol adı kullanır: <body> metin,
# <value> bir ad veya bir sayı, <tag:'GİRİŞ'> satırın başındaki etiket. Renkler
# theme.conf dosyasında durur. Bakınız /home/uxm-briefs/UI-STYLE.md.
#
# Türkçe küçük kapital harflerle yazılmaz, çünkü altı Türkçe harfin küçük kapitali yoktur.
# theme.conf içindeki small-caps.tr değeri bu yüzden false.

admin {
  version       = "<tag:'GİRİŞ'> <body>uxmAuth <value><version>"
  usage         = "<tag:'GİRİŞ'> <body>Bu komutun yaptığı her şeyi görmek için sonuna <value>help<body> ekle."
  reloaded      = "<tag:'GİRİŞ'> <body>Ayarlar yeniden yüklendi, <value><ms><body> ms içinde."
  reload-failed = "<etag:'HATA'> <body>Yeniden yükleme başarısız oldu. Nedeni konsolda yazıyor."

  doctor {
    header = "<h:'Bu eklenti nasil'>"
    ok     = "<good>iyi<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>uyari<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>hata<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'GİRİŞ'> <body>Her sey cevap verdi."
    unwell = "<etag:'HATA'> <body>Yukarida bir sorun var. Konsol tamamini tasiyor."
  }
}



# Dil dalının satırları. <language> tek bir dilin adı, <languages> bu eklentinin bulduğu
# dillerin listesi. Bir dil bu klasördeki bir dosyadır: messages_de.conf yaz, Almanca
# sunulur. Yeni bir derleme gerekmez ve düzenlenecek bir liste yoktur.
language {
  current   = "<tag:'GİRİŞ'> <body>Bunu <value><language><body> okuyorsun."
  choices   = "<tag:'GİRİŞ'> <body>Şu dillerde okuyabilirsin: <value><languages><body>."
  changed   = "<tag:'GİRİŞ'> <body>Artık bunu <value><language><body> okuyorsun."
  already   = "<tag:'GİRİŞ'> <body>Bunu zaten <value><language><body> okuyorsun."
  reset     = "<tag:'GİRİŞ'> <body>Artık kendi seçtiğin bir dil yok."
  separator = "<dim>, "
  unknown   = "<etag:'HATA'> <body>Bu sunucuda <value><input><body> yok. Olanlar: <value><languages><body>."
  forced    = "<etag:'HATA'> <body>Bu sunucu tek dil okur, o da <value><language><body>."

  # Bir yöneticinin başka bir oyuncunun dilini ayarladıktan ya da sildikten sonra okuduğu
  # satırlar. <player> oyuncunun adı. Sunucuda olmayan oyuncu değişikliği ilk girişinde alır.
  set-player        = "<tag:'GİRİŞ'> <value><player><body> artık <value><language><body> okuyor."
  set-player-away   = "<tag:'GİRİŞ'> <value><player><body> şu an yok, bir sonraki girişinden itibaren <value><language><body> okuyacak."
  reset-player      = "<tag:'GİRİŞ'> <value><player><body> için seçilmiş bir dil artık yok."
  reset-player-away = "<tag:'GİRİŞ'> <value><player><body> şu an yok, dil seçimi bir sonraki girişinde silinecek."
  forced-anyway     = "<tag:'GİRİŞ'> <body>Kaydedildi, ama dil zorunlu olduğu sürece herkes <value><language><body> okuyor."
  unknown-player    = "<etag:'HATA'> <body><value><input><body> adında biri burada hiç oynamadı."
}

# uxmLib komut katmanının yazdığı satırlar: yardım sayfası, reddedilen bir argüman, bekleme
# süresi. Burada duruyorlar ki geri kalanla birlikte çevrilsinler ve theme.conf ile boyansınlar.
# Köşeli parantez içindeki değer yazıldığı gibi eklenir ve asla çalıştırılmaz.
command {
  no-permission        = "<etag:'HATA'> <body>Bunu yapma yetkin yok."
  player-only        = "<etag:'HATA'> <body>Bu komutu sadece bir oyuncu çalıştırabilir."
  invalid-value      = "<etag:'HATA'> <body><value><input><body> geçerli bir <value><argument><body> değil."
  invalid-value-why  = "<etag:'HATA'> <body><value><input><body> geçerli bir <value><argument><body> değil: <subtext><reason>"
  not-one-of         = "<etag:'HATA'> <body><value><input><body> geçerli bir <value><argument><body> değil. Şunlardan birini dene: <value><allowed><body>."
  invalid-argument   = "<etag:'HATA'> <body><detail>"
  bad-argument       = "<etag:'HATA'> <body>Bu argüman geçerli değil."
  internal-error     = "<etag:'HATA'> <body>Bu komut çalışırken bir şey ters gitti. Nedeni konsolda yazıyor."
  on-cooldown        = "<etag:'HATA'> <body>Bunu tekrar kullanmadan önce <value><time><body> bekle."
  help-header        = "<h:'Yardım'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command       = "<value><command>"
  help-separator     = "<dim> : "
  help-description   = "<subtext><description>"
  help-fill-hint     = "<subtext>Bu komutu yazmak için tıkla."
  help-page-hint     = "<subtext>Sayfa <value><page>"
}

# Oyuncunun içeri girmeyi beklerken okuduğu satırlar. Buradaki komut adları gelen
# adlardır: commands.conf içinde değiştirirsen yeni adları buraya da yaz.
join {
  register-title    = "<value>Hoş geldin"
  register-subtitle = "<body><value>/register<body> ile bir şifre seç"
  login-title       = "<value>Tekrar hoş geldin"
  login-subtitle    = "<body><value>/login<body> ile giriş yap"
  code-title        = "<value>Bir adım daha"
  code-subtitle     = "<body>Giriş kodunu <value>/2fa<body> ile yaz"
}

reminder {
  register = "<body>Kayıt için <value>/register <şifre> <şifre>"
  login    = "<body>Giriş için <value>/login <şifre>"
  code     = "<body>Giriş kodunu <value>/2fa <kod><body> ile yaz"
}

welcome {
  registered = "<good>Hesabın hazır"
  logged-in  = "<good>Giriş yapıldı"
}

# Oyuncunun atıldığı ekranda okuduğu neden. <min> ve <max> bir ismin uzunluk sınırları,
# <word> isimdeki yasaklı kelime, <name> ismin kayıtlı olduğu yazım.
# Kalan süre, en büyük iki birimiyle: <n> sayıdır.
time {
  days      = "<n>g"
  hours     = "<n>sa"
  minutes   = "<n>dk"
  seconds   = "<n>sn"
  separator = " "
}

kick {
  # <time>, yasağın kalan süresidir.
  banned            = "<body>Adresinden çok fazla yanlış şifre geldi. <value><time><body> sonra yeniden dene."
  too-many-connections = "<body>Adresinden çok fazla bağlantı geldi. <value><time><body> sonra yeniden dene."
  # <country>, ülke dosyasının verdiği iki harfli koddur; bilmiyorsa ? olur.
  country           = "<body>Bu sunucu bağlandığın yerden oyuncu almıyor."
  logged-out        = "<body>Çıkış yaptın. Geri girmek için yeniden bağlan."
  already-online    = "<body>Bu isimle zaten bağlı biri var. O sensen biraz bekleyip yeniden bağlan."
  cancelled         = "<body>Giriş yapmadan ayrıldın. İstediğin zaman yeniden bağlan."
  storage           = "<body>Sunucu şu an hesaplara ulaşamıyor. Bir dakika sonra tekrar dene."
  timeout           = "<body>Giriş yapman çok uzun sürdü. Tekrar denemek için yeniden bağlan."
  too-many-attempts = "<body>Çok fazla yanlış şifre. Tekrar denemek için yeniden bağlan."
  name-too-short    = "<body>İsmin burada çok kısa. En az <value><min><body> karakterlik bir isim kullan."
  name-too-long     = "<body>İsmin burada çok uzun. En fazla <value><max><body> karakterlik bir isim kullan."
  name-characters   = "<body>İsminde bu sunucunun izin vermediği bir karakter var. Başka bir isim kullan."
  name-blocked      = "<body>İsminde bu sunucunun izin vermediği bir kelime var: <value><word>"
  name-case         = "<body>Bu isim <value><name><body> olarak kayıtlı. Tam olarak bu yazımla yeniden bağlan."
  lookup-failed     = "<body>Sunucu şu an isminin ücretli bir Minecraft hesabına ait olup olmadığını kontrol edemiyor. Bir dakika sonra tekrar dene."
  paid-name         = "<body>Bu isim ücretli bir Minecraft hesabına ait ve son denemen Mojang kontrolünden geçmedi. İsim seninse resmi başlatıcıdan bağlan. Değilse başka bir isimle bağlan."
  paid-name-moved   = "<body>Bu isim artık ücretli sahibine ait. Buradaki hesabın şimdi <value><name><body>: ismini bununla değiştirip yeniden bağlan. Şifren ve sahip olduğun her şey olduğu gibi duruyor."
  premium-address   = "<body>Bu adres ücretli Minecraft hesapları için ve son denemen Mojang kontrolünden geçmedi. Şifreyle oynamak için sunucunun diğer adresinden bağlan."
  name-disputed     = "<body>Bu ismi iki oyuncu istiyor ve yetkililer karar verecek. Karar verildiğinde yeniden bağlan."
  name-kept         = "<body>Bu ismi burada önce başka bir oyuncu aldı ve onda kalıyor. Burada oynamak için Mojang'da ismini değiştir."
  claimed           = "<body>Resmi Minecraft başlatıcısından yeniden bağlan. Buradan yapacağın bir sonraki bağlantı bu ismin senin olduğunu kanıtlar."
  network-claim     = "<body>Bu sunucu ağdaki girişini doğrulayamadı. Yeniden bağlan."
}

# /login, /register, /changepassword ve /logout yanıtları. <left> kalan deneme sayısı,
# <name> bir ad, sahibinin yazdığı gibi, <old> ve <new> isminin ücretli sahibi ismi
# kanıtladığında bir hesabın taşındığı eski ve yeni adlar.
login {
  wrong          = "<etag:'HATA'> <body>Şifre yanlış. <value><left><body> deneme hakkın kaldı."
  not-registered = "<etag:'HATA'> <body>Burada henüz bir şifren yok. <value>/register<body> ile kayıt ol."
  already        = "<tag:'GİRİŞ'> <body>Zaten giriş yaptın."
  must-replace   = "<body>Şifren doğruydu ama artık bu sunucunun kurallarına uymuyor. İçeri girmek için <value>/changepassword <şimdiki> <yeni><body> ile yeni bir şifre belirle."
  handshake-failed = "<tag:'GİRİŞ'> <body>Son bağlantın reddedildi çünkü bu isim ücretli bir Minecraft hesabına ait ve Mojang senin olduğunu doğrulamadı. Bu sefer şifreyle girdin. İsim seninse <value>/claim<body> kullan."
  renamed          = "<tag:'GİRİŞ'> <body><value><old><body> isminin ücretli sahibi ismi kanıtladı, bu yüzden hesabın sahip olduğu her şeyle <value><new><body> ismine taşındı. Bundan sonra <value><new><body> olarak bağlan."
}

# /claim ve /premium yanıtları.
claim {
  unavailable     = "<etag:'HATA'> <body>Bu sunucu bir ismin sahibini Mojang'a soramıyor, bu yüzden burada sahiplenecek bir şey yok."
  already-premium = "<tag:'GİRİŞ'> <body>Hesabın ismini zaten kanıtladı."
  not-this-rule   = "<etag:'HATA'> <body>Bu sunucu ücretli isimleri kendisi kanıtlıyor, bu yüzden sahiplenecek bir şey yok."
}

premium {
  log-in-first = "<etag:'HATA'> <body>Önce giriş yap, sonra bir sonraki bağlantında ismini kanıtlamak için <value>/premium<body> kullan."
}

# Ağın proxy'sinin henüz giriş yapmamış bir oyuncuya söyledikleri.
network {
  log-in-first = "<etag:'HATA'> <body>Önce giriş yap. O zamana kadar bu sunucuda kalırsın ve ağın kendi komutları bekler."
}

register {
  rules-needed   = "<etag:'HATA'> <body>Önce kuralları kabul etmek için kutuyu işaretle."
  too-many-accounts = "<etag:'HATA'> <body>Son zamanlarda adresinden çok fazla hesap açıldı. Daha sonra yeniden dene."
  mismatch       = "<etag:'HATA'> <body>İki şifre aynı değil."
  confirm-needed = "<etag:'HATA'> <body>Şifreyi iki kez yaz: <value>/register <şifre> <şifre>"
  name-taken     = "<etag:'HATA'> <body><value><name><body> adının zaten bir hesabı var."
  already        = "<etag:'HATA'> <body>Zaten bir hesabın var. <value>/login<body> ile giriş yap."
}

change {
  wrong-old     = "<etag:'HATA'> <body>Eski şifre yanlış."
  not-logged-in = "<etag:'HATA'> <body>Önce giriş yap."
  needs-both    = "<etag:'HATA'> <body>Önce eski şifreyi, sonra yenisini yaz."
}

# Doğrulama. Her gösterimde yeni bir kod çizilir ve her cevap onu harcar.
captcha {
  needed  = "<etag:'HATA'> <body>Önce doğrulamayı çöz."
  wrong   = "<etag:'HATA'> <body>Kod bu değildi. İşte yenisi."
  solved  = "<good>Doğrulama tamam. Devam et."
  map     = "<body>Elindeki haritadaki kodu oku ve <value>/captcha <kod><body> yaz."
  nothing = "<etag:'HATA'> <body>Cevaplanacak bir doğrulama yok."
}

# /session yanıtları. <minutes>, aynı adresten girişin şifresiz sürdüğü dakikadır.
session {
  usage        = "<body>Bu adresten bir dahaki girişte şifreyi atlamak için <value>/session on<body>, her girişte sorulmak için <value>/session off<body> yaz."
  on           = "<good>Bu adresten her girişten sonra <value><minutes><good> dakika boyunca şifre sorulmaz."
  off          = "<good>Her girişte şifren sorulacak."
  log-in-first = "<etag:'HATA'> <body>Önce giriş yap, sonra seç."
  not-chosen   = "<etag:'HATA'> <body>Bu sunucu oturumlara herkes için kendi karar veriyor, seçilecek bir şey yok."
}

