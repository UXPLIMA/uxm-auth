# Türkçe mesajlar.
#
# Her satır MiniMessage biçimindedir ve renk yerine rol adı kullanır: <body> metin,
# <value> bir ad veya bir sayı, <tag:'GİRİŞ'> satırın başındaki etiket. Renkler
# theme.conf dosyasında durur. Bakınız /home/uxm-briefs/UI-STYLE.md.
#
# Türkçe küçük kapital harflerle yazılmaz, çünkü altı Türkçe harfin küçük kapitali yoktur.
# theme.conf içindeki small-caps.tr değeri bu yüzden false.

admin {
  version       = "<tag:'GİRİŞ'> <body>uxmAuth <value><version>"
  usage         = "<tag:'GİRİŞ'> <body>Bu komutun yaptığı her şeyi görmek için sonuna <value>help<body> ekle."
  reloaded      = "<tag:'GİRİŞ'> <body>Ayarlar yeniden yüklendi, <value><ms><body> ms içinde."
  reload-failed = "<etag:'HATA'> <body>Yeniden yükleme başarısız oldu. Nedeni konsolda yazıyor."

  doctor {
    header = "<h:'Bu eklenti nasil'>"
    ok     = "<good>iyi<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>uyari<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>hata<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'GİRİŞ'> <body>Her sey cevap verdi."
    unwell = "<etag:'HATA'> <body>Yukarida bir sorun var. Konsol tamamini tasiyor."
  }
}



# Dil dalının satırları. <language> tek bir dilin adı, <languages> bu eklentinin bulduğu
# dillerin listesi. Bir dil bu klasördeki bir dosyadır: messages_de.conf yaz, Almanca
# sunulur. Yeni bir derleme gerekmez ve düzenlenecek bir liste yoktur.
language {
  current   = "<tag:'GİRİŞ'> <body>Bunu <value><language><body> okuyorsun."
  choices   = "<tag:'GİRİŞ'> <body>Şu dillerde okuyabilirsin: <value><languages><body>."
  changed   = "<tag:'GİRİŞ'> <body>Artık bunu <value><language><body> okuyorsun."
  already   = "<tag:'GİRİŞ'> <body>Bunu zaten <value><language><body> okuyorsun."
  reset     = "<tag:'GİRİŞ'> <body>Artık kendi seçtiğin bir dil yok."
  separator = "<dim>, "
  unknown   = "<etag:'HATA'> <body>Bu sunucuda <value><input><body> yok. Olanlar: <value><languages><body>."
  forced    = "<etag:'HATA'> <body>Bu sunucu tek dil okur, o da <value><language><body>."

  # Bir yöneticinin başka bir oyuncunun dilini ayarladıktan ya da sildikten sonra okuduğu
  # satırlar. <player> oyuncunun adı. Sunucuda olmayan oyuncu değişikliği ilk girişinde alır.
  set-player        = "<tag:'GİRİŞ'> <value><player><body> artık <value><language><body> okuyor."
  set-player-away   = "<tag:'GİRİŞ'> <value><player><body> şu an yok, bir sonraki girişinden itibaren <value><language><body> okuyacak."
  reset-player      = "<tag:'GİRİŞ'> <value><player><body> için seçilmiş bir dil artık yok."
  reset-player-away = "<tag:'GİRİŞ'> <value><player><body> şu an yok, dil seçimi bir sonraki girişinde silinecek."
  forced-anyway     = "<tag:'GİRİŞ'> <body>Kaydedildi, ama dil zorunlu olduğu sürece herkes <value><language><body> okuyor."
  unknown-player    = "<etag:'HATA'> <body><value><input><body> adında biri burada hiç oynamadı."
}

# uxmLib komut katmanının yazdığı satırlar: yardım sayfası, reddedilen bir argüman, bekleme
# süresi. Burada duruyorlar ki geri kalanla birlikte çevrilsinler ve theme.conf ile boyansınlar.
# Köşeli parantez içindeki değer yazıldığı gibi eklenir ve asla çalıştırılmaz.
command {
  no-permission        = "<etag:'HATA'> <body>Bunu yapma yetkin yok."
  player-only        = "<etag:'HATA'> <body>Bu komutu sadece bir oyuncu çalıştırabilir."
  invalid-value      = "<etag:'HATA'> <body><value><input><body> geçerli bir <value><argument><body> değil."
  invalid-value-why  = "<etag:'HATA'> <body><value><input><body> geçerli bir <value><argument><body> değil: <subtext><reason>"
  not-one-of         = "<etag:'HATA'> <body><value><input><body> geçerli bir <value><argument><body> değil. Şunlardan birini dene: <value><allowed><body>."
  invalid-argument   = "<etag:'HATA'> <body><detail>"
  bad-argument       = "<etag:'HATA'> <body>Bu argüman geçerli değil."
  internal-error     = "<etag:'HATA'> <body>Bu komut çalışırken bir şey ters gitti. Nedeni konsolda yazıyor."
  on-cooldown        = "<etag:'HATA'> <body>Bunu tekrar kullanmadan önce <value><time><body> bekle."
  help-header        = "<h:'Yardım'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command       = "<value><command>"
  help-separator     = "<dim> : "
  help-description   = "<subtext><description>"
  help-fill-hint     = "<subtext>Bu komutu yazmak için tıkla."
  help-page-hint     = "<subtext>Sayfa <value><page>"
}

# Oyuncunun içeri girmeyi beklerken okuduğu satırlar. Buradaki komut adları gelen
# adlardır: commands.conf içinde değiştirirsen yeni adları buraya da yaz.
join {
  register-title    = "<value>Hoş geldin"
  register-subtitle = "<body><value>/register<body> ile bir şifre seç"
  login-title       = "<value>Tekrar hoş geldin"
  login-subtitle    = "<body><value>/login<body> ile giriş yap"
}

reminder {
  register = "<body>Kayıt için <value>/register <şifre> <şifre>"
  login    = "<body>Giriş için <value>/login <şifre>"
}

welcome {
  registered = "<good>Hesabın hazır"
  logged-in  = "<good>Giriş yapıldı"
}
