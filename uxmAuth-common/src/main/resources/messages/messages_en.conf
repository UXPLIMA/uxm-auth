# The staff info window, menus/info.conf. Each tile is drawn in the one shape the canon allows:
# the title, the category under it, the description, the facts, then the click line. What is
# here is the words of each of those parts, and the window file says where each tile sits.
menu {
  lore {
    description = "Description"
    details = "Details"
  }
  button {
    close = "<accent>Close"
  }
  info {
    title = "<info_name>"
    none = "none"
    account {
      title = "<info_name>"
      crumb = "Account"
      description = "Who this is and where it began."
      kind {
        label = "Kind"
        value = "<info_kind>"
      }
      registered {
        label = "Registered"
        value = "<info_registered>"
      }
      origin {
        label = "From"
        value = "<info_origin>"
      }
    }
    last {
      title = "Last login"
      crumb = "Account"
      description = "The newest login that is kept."
      when {
        label = "When"
        value = "<info_last>"
      }
      address {
        label = "From"
        value = "<info_seen>"
      }
      count {
        label = "Logins kept"
        value = "<info_logins>"
      }
    }
    security {
      title = "Security"
      crumb = "Account"
      description = "What it asks after the password."
      app {
        label = "App"
        value = "<info_app>"
      }
      backup {
        label = "Backup codes"
        value = "<info_backup>"
      }
      mail {
        label = "Code by mail"
        value = "<info_mail>"
      }
      address {
        label = "Mail address"
        value = "<info_address>"
      }
    }
    login {
      title = "<login_date>"
      crumb = "Login"
      description = "One login the history keeps."
      address {
        label = "From"
        value = "<login_address>"
      }
      method {
        label = "Way in"
        value = "<login_method>"
      }
    }
    no-logins {
      title = "No login yet"
      crumb = "Login"
      description = "The history keeps no login\nof this account."
    }
    alt {
      title = "<alt_name>"
      crumb = "Other account"
      description = "Seen on an address\nthis account used."
      action = "<cta>Click<subtext> to read this account"
    }
    no-alts {
      title = "No other account"
      crumb = "Other account"
      description = "No other account was seen\non its addresses."
    }
  }
}
