# English messages.
#
# Every line is MiniMessage, and every line names a role instead of a colour: <body> is the
# text, <value> is a name or a number, <tag:'AUTH'> is the prefix a chat line opens with.
# The colours behind those names live in theme.conf. See /home/uxm-briefs/UI-STYLE.md.
#
# Write ordinary words here. The plugin converts English into small capitals when it renders
# the line, so this file stays readable for a translator.
#
# A key that is missing here falls back to the default that the code carries, so the plugin
# can never show an empty message. Delete a line to take the default back.

admin {
  version       = "<tag:'AUTH'> <body>uxmAuth <value><version>"
  usage         = "<tag:'AUTH'> <body>Add <value>help<body> after this command to see everything it does."
  reloaded      = "<tag:'AUTH'> <body>The configuration is loaded again, in <value><ms><body> ms."
  reload-failed = "<etag:'ERROR'> <body>The reload failed. The console holds the reason."

  doctor {
    header = "<h:'How this plugin is'>"
    ok     = "<good>ok<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>warn<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>fail<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'AUTH'> <body>Everything answered."
    unwell = "<etag:'ERROR'> <body>Something is wrong above. The console carries the whole of it."
  }
}



# The lines of the language branch. <language> is the name of one language, and <languages>
# is the list of the ones this plugin found. A language is a file in this folder: write
# messages_de.conf and German is offered, with no new build and no list to edit.
language {
  current   = "<tag:'AUTH'> <body>You read this in <value><language><body>."
  choices   = "<tag:'AUTH'> <body>You may read it in <value><languages><body>."
  changed   = "<tag:'AUTH'> <body>You now read this in <value><language><body>."
  already   = "<tag:'AUTH'> <body>You already read this in <value><language><body>."
  reset     = "<tag:'AUTH'> <body>You no longer have a language of your own."
  separator = "<dim>, "
  unknown   = "<etag:'ERROR'> <body>This server has no <value><input><body>. It has <value><languages><body>."
  forced    = "<etag:'ERROR'> <body>This server reads one language, and it is <value><language><body>."

  # What an operator reads after setting or clearing another player's language. <player>
  # is the player's name. A player who is away gets the change at their next join.
  set-player        = "<tag:'AUTH'> <value><player><body> now reads <value><language><body>."
  set-player-away   = "<tag:'AUTH'> <value><player><body> is away and reads <value><language><body> from their next join."
  reset-player      = "<tag:'AUTH'> <value><player><body> no longer has a language of their own."
  reset-player-away = "<tag:'AUTH'> <value><player><body> is away, and their language is cleared at their next join."
  forced-anyway     = "<tag:'AUTH'> <body>It is kept, and everyone reads <value><language><body> while that is forced."
  unknown-player    = "<etag:'ERROR'> <body>Nobody called <value><input><body> has played here."
}

# The lines the uxmLib command layer writes: the help page, a rejected argument, a cooldown.
# They are here so they are translated with the rest and painted from theme.conf. A value in
# angle brackets is inserted as written and never obeyed.
command {
  no-permission        = "<etag:'ERROR'> <body>You do not have permission to do that."
  player-only        = "<etag:'ERROR'> <body>Only a player can run this command."
  invalid-value      = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>."
  invalid-value-why  = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>: <subtext><reason>"
  not-one-of         = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>. Try one of <value><allowed><body>."
  invalid-argument   = "<etag:'ERROR'> <body><detail>"
  bad-argument       = "<etag:'ERROR'> <body>That argument is not valid."
  internal-error     = "<etag:'ERROR'> <body>Something went wrong while running this command. The console holds the reason."
  on-cooldown        = "<etag:'ERROR'> <body>Wait <value><time><body> before you use this again."
  help-header        = "<h:'Help'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command       = "<value><command>"
  help-separator     = "<dim> : "
  help-description   = "<subtext><description>"
  help-fill-hint     = "<subtext>Click to write this command."
  help-page-hint     = "<subtext>Page <value><page>"
}

# What a player reads while they wait to get in. The commands named here are the
# shipped ones: if you rename them in commands.conf, write the new names here too.
join {
  register-title    = "<value>Welcome"
  register-subtitle = "<body>Choose a password with <value>/register"
  login-title       = "<value>Welcome back"
  login-subtitle    = "<body>Log in with <value>/login"
  code-title        = "<value>One more step"
  code-subtitle     = "<body>Type your login code with <value>/2fa"
}

reminder {
  register = "<body>Register with <value>/register <password> <password>"
  login    = "<body>Log in with <value>/login <password>"
  code     = "<body>Type your login code with <value>/2fa <code>"
}

welcome {
  registered = "<good>Your account is ready"
  logged-in  = "<good>Logged in"
}

# The reason a player reads on the screen they are kicked to. <min> and <max> are the
# lengths a name may have, <word> the blocked word a name holds, <name> the spelling a
# name was registered in.
# A time left, in its two largest units: <n> is the number.
time {
  days      = "<n>d"
  hours     = "<n>h"
  minutes   = "<n>m"
  seconds   = "<n>s"
  separator = " "
}

kick {
  # <time> is what the ban has left.
  banned            = "<body>Too many wrong passwords came from your address. Try again in <value><time><body>."
  too-many-connections = "<body>Too many connections came from your address. Try again in <value><time><body>."
  # <country> is the two-letter code the country file gave, or ? when it knew none.
  country           = "<body>This server does not take players from where you connect."
  logged-out        = "<body>You have logged out. Join again to come back in."
  already-online    = "<body>Someone is already connected under this name. If that was you, wait a moment and join again."
  cancelled         = "<body>You left before logging in. Join again whenever you like."
  storage           = "<body>This server cannot reach its accounts right now. Try again in a minute."
  timeout           = "<body>You took too long to log in. Join again to try once more."
  too-many-attempts = "<body>Too many wrong passwords. Join again to try once more."
  name-too-short    = "<body>Your name is too short here. Use a name of at least <value><min><body> characters."
  name-too-long     = "<body>Your name is too long here. Use a name of at most <value><max><body> characters."
  name-characters   = "<body>Your name holds a character this server does not allow. Use another name."
  name-blocked      = "<body>Your name holds a word this server does not allow: <value><word>"
  name-case         = "<body>This name is registered as <value><name><body>. Join again with exactly that spelling."
  lookup-failed     = "<body>This server cannot check right now whether your name belongs to a paid Minecraft account. Try again in a minute."
  paid-name         = "<body>This name belongs to a paid Minecraft account, and your last try did not pass Mojang's check. If the name is yours, join from the official launcher. If it is not, join under another name."
  paid-name-moved   = "<body>This name now belongs to its paid owner. Your account here is now <value><name><body>: change your name to it and join again. Your password and everything you had are as they were."
  premium-address   = "<body>This address is for paid Minecraft accounts, and your last try did not pass Mojang's check. Join through the server's other address to play with a password."
  name-disputed     = "<body>Two players want this name, and staff will settle it. Join again once they have."
  name-kept         = "<body>Another player took this name here first and keeps it. Change your name at Mojang to play here."
  claimed           = "<body>Join again from the official Minecraft launcher. Your next connection from here proves this name is yours."
  network-claim     = "<body>This server could not confirm your login with the network. Join again."
}

# The answers to /login, /register, /changepassword and /logout. <left> is how many tries
# remain, <name> a name as its owner wrote it, <old> and <new> the names an account moved
# between when the paid owner of its name proved it.
login {
  wrong          = "<etag:'ERROR'> <body>That password is wrong. Tries left: <value><left><body>."
  not-registered = "<etag:'ERROR'> <body>You have no password here yet. Register with <value>/register<body>."
  already        = "<tag:'AUTH'> <body>You are already logged in."
  must-replace   = "<body>Your password was right, but it no longer meets this server's rules. Set a new one with <value>/changepassword <current> <new><body> to come in."
  handshake-failed = "<tag:'AUTH'> <body>Your last connection was refused because this name belongs to a paid Minecraft account and Mojang did not confirm it was you. This time you came in with a password instead. If the name is yours, use <value>/claim<body>."
  renamed          = "<tag:'AUTH'> <body>The paid owner of <value><old><body> proved the name, so your account moved to <value><new><body> with everything it had. Join as <value><new><body> from now on."
  refused = "<tag:'AUTH'> <body>Your login was refused."
}

# The answers to /claim and /premium.
claim {
  unavailable     = "<etag:'ERROR'> <body>This server cannot ask Mojang who owns a name, so there is nothing to claim here."
  already-premium = "<tag:'AUTH'> <body>Your account has proved its name already."
  not-this-rule   = "<etag:'ERROR'> <body>This server proves paid names on its own, so there is nothing to claim."
}

premium {
  log-in-first = "<etag:'ERROR'> <body>Log in first, then use <value>/premium<body> to prove your name on your next connection."
}

# What the proxy of a network tells a player who has not logged in yet.
network {
  log-in-first = "<etag:'ERROR'> <body>Log in first. Until then you stay on this server, and the network's own commands wait."
}

register {
  rules-needed   = "<etag:'ERROR'> <body>Tick the box to accept the rules first."
  too-many-accounts = "<etag:'ERROR'> <body>Too many accounts were made from your address lately. Try again later."
  mismatch       = "<etag:'ERROR'> <body>The two passwords are not the same."
  confirm-needed = "<etag:'ERROR'> <body>Write the password twice: <value>/register <password> <password>"
  name-taken     = "<etag:'ERROR'> <body>The name <value><name><body> already has an account."
  already        = "<etag:'ERROR'> <body>You already have an account. Log in with <value>/login<body>."
  refused = "<tag:'AUTH'> <body>Your registration was refused."
}

change {
  wrong-old     = "<etag:'ERROR'> <body>The old password is wrong."
  not-logged-in = "<etag:'ERROR'> <body>Log in first."
  needs-both    = "<etag:'ERROR'> <body>Write the old password, then the new one."
}

# The captcha. A code is drawn new for each showing, and any answer spends it.
captcha {
  needed  = "<etag:'ERROR'> <body>Solve the captcha first."
  wrong   = "<etag:'ERROR'> <body>That was not the code. Here is a new one."
  solved  = "<good>Captcha solved. Go on."
  map     = "<body>Read the code on the map in your hand and type <value>/captcha <code><body>."
  nothing = "<etag:'ERROR'> <body>There is no captcha to answer."
}

# The answers to /session. <minutes> is how long a login from the same address skips the password.
session {
  usage        = "<body>Use <value>/session on<body> to skip the password from this address next time, or <value>/session off<body> to be asked at every join."
  on           = "<good>From this address you skip the password for <value><minutes><good> minutes after each login."
  off          = "<good>You will be asked your password at every join."
  log-in-first = "<etag:'ERROR'> <body>Log in first, then choose."
  not-chosen   = "<etag:'ERROR'> <body>This server decides sessions for everyone, so there is nothing to choose."
}

# The answers to /2fa. <secret> is the key an app is given, <link> the same as a link, and
# <minutes> how long a setup waits for its first code.
factor {
  usage           = "<body>Use <value>/2fa setup<body> to ask a code from an authenticator app after your password, <value>/2fa email on<body> to get it by mail instead, <value>/2fa backup <code><body> for new backup codes, or <value>/2fa off <code><body> to stop."
  secret          = "<body>Add an account in your authenticator app with this key: <value><secret><body>. Click it to copy."
  link            = "<body>Or open this link on the phone: <value><link><body>. Click it to copy."
  map             = "<body>Or scan the QR code on the map in your hand."
  no-room         = "<body>Empty a slot of your hotbar and run <value>/2fa setup<body> again to get the QR code on a map."
  confirm         = "<body>Then type <value>/2fa confirm <code><body> with the code the app shows. This waits <value><minutes><body> minutes."
  on              = "<good>From now on your account asks a code from your app after the password."
  backup-codes    = "<body>Your backup codes, for a lost phone: <value><codes><body>. Each works once in place of the app's code. Click them to copy and keep them safe, they are not shown again."
  off             = "<good>Your account no longer asks a code from an app."
  wrong           = "<etag:'ERROR'> <body>That is neither the code your app shows now nor a backup code."
  nothing-started = "<etag:'ERROR'> <body>No setup is waiting. Start one with <value>/2fa setup<body>."
  already-on      = "<etag:'ERROR'> <body>Your account asks a code from an app already. Turn it off first with <value>/2fa off <code><body>."
  not-on          = "<etag:'ERROR'> <body>Your account asks no code from an app."
  required        = "<etag:'ERROR'> <body>Your account must ask a code from an authenticator app before you can play. Type <value>/2fa setup<body> to set it up."
  log-in-first    = "<etag:'ERROR'> <body>Log in first."
  code-needed     = "<body>Now type the code from your authenticator app or the one mailed to you, or a backup code, with <value>/2fa <code><body>."
  login-wrong     = "<etag:'ERROR'> <body>That is not the app's code now, the mailed code or a backup code. Tries left: <value><left><body>."
  nothing-asked   = "<etag:'ERROR'> <body>No code is asked of you now."
  mail-on         = "<good>From now on a login code is mailed to <value><address><good> after your password."
  mail-off        = "<good>No more login codes are mailed to you."
  mail-already-on = "<etag:'ERROR'> <body>Login codes are mailed to you already."
  mail-not-on     = "<etag:'ERROR'> <body>No login codes are mailed to you."
  mail-no-address = "<etag:'ERROR'> <body>Link an address first with <value>/email add <address><body>."
}
# /email answers. <address> is always the masked address, <minutes> how long a code lasts,
# <seconds> how long before another code may go, <left> the tries a code has left.
email {
  usage = "<body>Use <value>/email add <address><body> to link an address a forgotten password is sent to, <value>/email confirm <code><body> with the code it gets, or <value>/email remove<body> to take it away."
  linked = "<body>Linked now: <value><address><body>."
  sent = "<good>A code went to <value><address><good>. Type <value>/email confirm <code><good> within <value><minutes><good> minutes."
  cooldown = "<etag:'ERROR'> <body>A code went out a moment ago. Ask again in <value><seconds><body> seconds."
  confirmed = "<good>Linked: <value><address><good>. A forgotten password can be set again through it."
  wrong = "<etag:'ERROR'> <body>That is not the code. Tries left: <value><left><body>."
  already-linked = "<etag:'ERROR'> <body><value><address><body> is linked already."
  removed = "<good><value><address><good> is no longer linked."
  not-an-address = "<etag:'ERROR'> <body>That is not a mail address."
  domain-refused = "<etag:'ERROR'> <body>This server takes no address at that domain."
  mail-off = "<etag:'ERROR'> <body>This server sends no mail."
  mail-failed = "<etag:'ERROR'> <body>The mail could not be sent. Try again later."
  expired = "<etag:'ERROR'> <body>That code is too old. Ask a new one with <value>/email add <address><body>."
  nothing-pending = "<etag:'ERROR'> <body>No code waits. Ask one with <value>/email add <address><body>."
  too-many-attempts = "<etag:'ERROR'> <body>The tries for that code are spent. Ask a new one with <value>/email add <address><body>."
  none-linked = "<etag:'ERROR'> <body>No address is linked."
  factor-on = "<etag:'ERROR'> <body>Your login code goes to this address. Turn that off first with <value>/2fa email off <code><body>."
  required = "<etag:'ERROR'> <body>This server keeps an address for a forgotten password. Link one with <value>/email add <address><body>, then <value>/email confirm <code><body> with the code it gets."
  required-keep = "<etag:'ERROR'> <body>This server requires an address, so it cannot be removed. Link another with <value>/email add <address><body> to replace it."
  log-in-first = "<etag:'ERROR'> <body>Log in first."
}
# /recover answers. <address> is the masked address, <minutes> how long the code lasts.
recover {
  sent = "<good>A code went to <value><address><good>. Type <value>/recover <code> <new password><good> within <value><minutes><good> minutes."
  cooldown = "<etag:'ERROR'> <body>A code went out a moment ago. Ask again in <value><seconds><body> seconds."
  no-address = "<etag:'ERROR'> <body>No address is linked to this account, so no code can be sent. Ask the staff."
  not-waiting = "<etag:'ERROR'> <body>A password is recovered at the login, before it is typed."
  usage = "<etag:'ERROR'> <body>Type <value>/recover<body> for a code, then <value>/recover <code> <new password><body>."
  done = "<good>Your new password is set. Log in with <value>/login <password><good>."
  wrong = "<etag:'ERROR'> <body>That is not the code. Tries left: <value><left><body>."
  expired = "<etag:'ERROR'> <body>That code is too old. Ask a new one with <value>/recover<body>."
  nothing-pending = "<etag:'ERROR'> <body>No code waits. Ask one with <value>/recover<body>."
  too-many-attempts = "<etag:'ERROR'> <body>The tries for that code are spent. Ask a new one with <value>/recover<body>."
}



logout {
  not-logged-in = "<etag:'ERROR'> <body>You are not logged in."
  sessions-ended = "<body>Your password was changed, so you were logged out. Log in with the new one."
}

# Why a password was refused. <min> and <max> are lengths in characters, <classes> the
# kinds of character still missing, joined by class-separator.
password {
  too-short               = "<etag:'ERROR'> <body>A password needs at least <value><min><body> characters."
  too-long                = "<etag:'ERROR'> <body>A password may have at most <value><max><body> characters."
  too-long-for-the-hash   = "<etag:'ERROR'> <body>That password is too long to keep whole. Use fewer letters outside the English alphabet."
  bad-characters          = "<etag:'ERROR'> <body>That password holds a character this server does not allow."
  common                  = "<etag:'ERROR'> <body>That password is one of the most common ones. Choose another."
  breached                = "<etag:'ERROR'> <body>That password is known from a data breach somewhere else. Choose another."
  missing                 = "<etag:'ERROR'> <body>A password here needs <value><classes><body>."
  class-lower             = "a lower-case letter"
  class-upper             = "a capital letter"
  class-digit             = "a digit"
  class-symbol            = "a symbol"
  class-separator         = ", "
}

busy = "<etag:'ERROR'> <body>The server is busy. Try again in a moment."

# The screens a player sees at the door. screens.conf decides which lines a screen shows and in
# what order; these are the words.
screen {
  register {
    title    = "<value>Welcome"
    body     = "<body>Choose a password for this name. You will type it each time you join."
    password = "Password"
    confirm  = "The same password again"
    accept   = "I have read the rules and accept them"
    remember = "Remember me on this address"
    submit   = "Register"
    cancel   = "Leave"
  }
  login {
    title    = "<value>Welcome back"
    body     = "<body>Type your password to come in."
    password = "Password"
    remember = "Remember me on this address"
    submit   = "Log in"
    claim    = "This name is mine"
    forgot   = "Forgot password"
    cancel   = "Leave"
  }
  replace {
    title    = "<value>A new password"
    body     = "<body>Your password was right, but it no longer meets this server's rules. Choose a new one to come in."
    password = "New password"
    confirm  = "The same password again"
    submit   = "Save and come in"
    cancel   = "Leave"
  }
  captcha {
    title  = "<value>Are you a player?"
    body   = "<body>Type the code you see: <value><code>"
    code   = "Code"
    submit = "Continue"
    cancel = "Leave"
  }
  code {
    title  = "<value>One more step"
    body   = "<body>Type the code your authenticator app shows for this server, the one mailed to you, or one of your backup codes."
    code   = "Code"
    submit = "Log in"
    cancel = "Leave"
  }
  factor {
    title = "<value>Authenticator app"
    body  = "<body>Add an account in your authenticator app with the key below, then type its code."
    key   = "Key"
    code  = "Code from the app"
  }
  backup {
    title = "<value>Backup codes"
    body  = "<body>Each code works once in place of the app's code. Copy them and keep them safe, they are not shown again."
    codes = "Codes"
  }
  email {
    title = "<value>Mail address"
    body = "<body>Type the address a forgotten password is sent to. A code goes to it first."
    address = "Address"
    code-body = "<body>Type the code that went to the address."
    code = "Code"
  }
  recover {
    title = "<value>Forgotten password"
    body = "<body>Type the code that went to your address and a new password."
    code = "Code"
    password = "New password"
    submit = "Set password"
    cancel = "Back"
  }
  pin {
    title  = "<value>Your code"
    body   = "<body>Press the digits of your code, then enter."
    erase  = "Erase"
    enter  = "Enter"
    cancel = "Leave"
    remember = "Remember me on this address"
    # The line under the pad: <code> is one mask for every digit pressed so far.
    entered = "<body>Code: <value><code>"
    repeat  = "<body>Press the same code once more to confirm it."
    mask    = "●"
  }
}

# The rules a player accepts before registering, while screens.conf turns them on. Add lines
# here and name them in screens.conf.
rules {
  line-1 = "<body>Be kind to other players."
  line-2 = "<body>No cheating and no griefing."
  # Said in chat after the rules, to a player who registers with the command.
  accepted-by-registering = "<body>Registering with <value>/register<body> means you accept these rules."
}

# What staff read of an account: /uxmauth info and /uxmauth history. <name> is the account,
# <date> a date in staff.date-format, <address> where it came from, <kind> and <method> words below.
staff {
  unknown = "<etag:'ERROR'> <body>No account is under <value><name><body>."
  console-only = "<etag:'ERROR'> <body>Run <value><command><body> from the console, or open it to staff in game under <value>staff.in-game<body> in config.conf."
  forced-login = "<tag:'AUTH'> <body>Every server was told to let <value><name><body> in, wherever they wait."
  let-in = "<tag:'AUTH'> <body>Staff let you in."
  unbanned = "<tag:'AUTH'> <body><value><address><body> is no longer banned."
  not-banned = "<tag:'AUTH'> <body><value><address><body> was not banned. Its count of wrong passwords starts again."
  not-an-address = "<etag:'ERROR'> <body><value><address><body> is no address."
  removed = "<tag:'AUTH'> <body>The account of <value><name><body> is removed, with everything kept under it."
  removed-kick = "<body>Staff removed your account. Join again to register."
  password-set = "<tag:'AUTH'> <body>The password of <value><name><body> is set. Every session of the account ended."
  password-raced = "<etag:'ERROR'> <body>The password of <value><name><body> changed while this one was set. Try again."
  registered = "<tag:'AUTH'> <body>An account is made for <value><name><body>."
  registered-you = "<tag:'AUTH'> <body>Staff made your account. Log in with the password they gave you."
  name-taken = "<etag:'ERROR'> <body>An account holds <value><name><body> already."
  name-refused = "<etag:'ERROR'> <body><value><name><body> breaks the name rules of config.conf."
  factor-off = "<tag:'AUTH'> <body>Every second factor of <value><name><body> is off. The next login asks the password only."
  factor-none = "<tag:'AUTH'> <body><value><name><body> has no second factor."
  marked-premium = "<tag:'AUTH'> <body><value><name><body> is a premium account now. Its player joins again and proves the name."
  marked-cracked = "<tag:'AUTH'> <body><value><name><body> is a password account now. Its player joins again and logs in with the password."
  mark-already = "<etag:'ERROR'> <body><value><name><body> is that kind of account already, or a kind this does not change."
  not-paid = "<etag:'ERROR'> <body>No paid account holds the name <value><name><body>."
  no-answer = "<etag:'ERROR'> <body>No source could say who holds <value><name><body> now. Try again in a while."
  paid-taken = "<etag:'ERROR'> <body>Another account holds the paid account of <value><name><body> already."
  no-password = "<etag:'ERROR'> <body><value><name><body> has no password to log in with. Set one first."
  rejoin-kick = "<body>Staff changed how your account logs in. Join again."
  resolved-premium = "<tag:'AUTH'> <body><value><name><body> goes to its paid owner. The cracked account moved to a marked name with everything it had."
  resolved-cracked = "<tag:'AUTH'> <body><value><name><body> stays with its cracked holder. The paid owner is told to change their name."
  no-dispute = "<etag:'ERROR'> <body>No dispute holds <value><name><body>."
}

alert {
