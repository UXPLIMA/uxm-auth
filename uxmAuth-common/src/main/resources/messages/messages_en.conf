# English messages.
#
# Every line is MiniMessage, and every line names a role instead of a colour: <body> is the
# text, <value> is a name or a number, <tag:'AUTH'> is the prefix a chat line opens with.
# The colours behind those names live in theme.conf. See /home/uxm-briefs/UI-STYLE.md.
#
# Write ordinary words here. The plugin converts English into small capitals when it renders
# the line, so this file stays readable for a translator.
#
# A key that is missing here falls back to the default that the code carries, so the plugin
# can never show an empty message. Delete a line to take the default back.

admin {
  version       = "<tag:'AUTH'> <body>uxmAuth <value><version>"
  usage         = "<tag:'AUTH'> <body>Add <value>help<body> after this command to see everything it does."
  reloaded      = "<tag:'AUTH'> <body>The configuration is loaded again, in <value><ms><body> ms."
  reload-failed = "<etag:'ERROR'> <body>The reload failed. The console holds the reason."

  doctor {
    header = "<h:'How this plugin is'>"
    ok     = "<good>ok<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>warn<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>fail<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'AUTH'> <body>Everything answered."
    unwell = "<etag:'ERROR'> <body>Something is wrong above. The console carries the whole of it."
  }
}



# The lines of the language branch. <language> is the name of one language, and <languages>
# is the list of the ones this plugin found. A language is a file in this folder: write
# messages_de.conf and German is offered, with no new build and no list to edit.
language {
  current   = "<tag:'AUTH'> <body>You read this in <value><language><body>."
  choices   = "<tag:'AUTH'> <body>You may read it in <value><languages><body>."
  changed   = "<tag:'AUTH'> <body>You now read this in <value><language><body>."
  already   = "<tag:'AUTH'> <body>You already read this in <value><language><body>."
  reset     = "<tag:'AUTH'> <body>You no longer have a language of your own."
  separator = "<dim>, "
  unknown   = "<etag:'ERROR'> <body>This server has no <value><input><body>. It has <value><languages><body>."
  forced    = "<etag:'ERROR'> <body>This server reads one language, and it is <value><language><body>."

  # What an operator reads after setting or clearing another player's language. <player>
  # is the player's name. A player who is away gets the change at their next join.
  set-player        = "<tag:'AUTH'> <value><player><body> now reads <value><language><body>."
  set-player-away   = "<tag:'AUTH'> <value><player><body> is away and reads <value><language><body> from their next join."
  reset-player      = "<tag:'AUTH'> <value><player><body> no longer has a language of their own."
  reset-player-away = "<tag:'AUTH'> <value><player><body> is away, and their language is cleared at their next join."
  forced-anyway     = "<tag:'AUTH'> <body>It is kept, and everyone reads <value><language><body> while that is forced."
  unknown-player    = "<etag:'ERROR'> <body>Nobody called <value><input><body> has played here."
}

# The lines the uxmLib command layer writes: the help page, a rejected argument, a cooldown.
# They are here so they are translated with the rest and painted from theme.conf. A value in
# angle brackets is inserted as written and never obeyed.
command {
  no-permission        = "<etag:'ERROR'> <body>You do not have permission to do that."
  player-only        = "<etag:'ERROR'> <body>Only a player can run this command."
  invalid-value      = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>."
  invalid-value-why  = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>: <subtext><reason>"
  not-one-of         = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>. Try one of <value><allowed><body>."
  invalid-argument   = "<etag:'ERROR'> <body><detail>"
  bad-argument       = "<etag:'ERROR'> <body>That argument is not valid."
  internal-error     = "<etag:'ERROR'> <body>Something went wrong while running this command. The console holds the reason."
  on-cooldown        = "<etag:'ERROR'> <body>Wait <value><time><body> before you use this again."
  help-header        = "<h:'Help'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command       = "<value><command>"
  help-separator     = "<dim> : "
  help-description   = "<subtext><description>"
  help-fill-hint     = "<subtext>Click to write this command."
  help-page-hint     = "<subtext>Page <value><page>"
}

# What a player reads while they wait to get in. The commands named here are the
# shipped ones: if you rename them in commands.conf, write the new names here too.
join {
  register-title    = "<value>Welcome"
  register-subtitle = "<body>Choose a password with <value>/register"
  login-title       = "<value>Welcome back"
  login-subtitle    = "<body>Log in with <value>/login"
}

reminder {
  register = "<body>Register with <value>/register <password> <password>"
  login    = "<body>Log in with <value>/login <password>"
}

welcome {
  registered = "<good>Your account is ready"
  logged-in  = "<good>Logged in"
}

# The reason a player reads on the screen they are kicked to.
kick {
  timeout = "<body>You took too long to log in. Join again to try once more."
}
