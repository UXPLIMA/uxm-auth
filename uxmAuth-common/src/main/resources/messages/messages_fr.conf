# Messages en français.
#
# Chaque ligne est du MiniMessage, et chaque ligne nomme un rôle au lieu d'une couleur : <body>
# est le texte, <value> un nom ou un nombre, <tag:'CONNEXION'> l'étiquette qui ouvre une ligne
# du chat. Les couleurs derrière ces noms sont dans theme.conf.
#
# Écris ici des mots ordinaires. Le plugin met la ligne en petites capitales à l'affichage ; é,
# è, à, ç et les autres lettres accentuées gardent leur forme. La valeur small-caps.fr de
# theme.conf l'active et le désactive.
#
# Une clé absente ici revient à la valeur par défaut du code, donc le plugin n'affiche jamais un
# message vide. Supprime une ligne pour retrouver la valeur par défaut.

admin {
  version       = "<tag:'CONNEXION'> <body>uxmAuth <value><version>"
  usage         = "<tag:'CONNEXION'> <body>Ajoute <value>help<body> après cette commande pour voir tout ce qu'elle fait."
  reloaded      = "<tag:'CONNEXION'> <body>La configuration est rechargée, en <value><ms><body> ms."
  reload-failed = "<etag:'ERREUR'> <body>Le rechargement a échoué. La console en donne la raison."

  doctor {
    header = "<h:'État du plugin'>"
    ok     = "<good>ok<body>  <value><check><body> : <subtext><said>"
    warn   = "<warn>alerte<body>  <value><check><body> : <subtext><said>"
    fail   = "<bad>échec<body>  <value><check><body> : <subtext><said>"
    well   = "<tag:'CONNEXION'> <body>Tout a répondu."
    unwell = "<etag:'ERREUR'> <body>Quelque chose ne va pas plus haut. La console a tout le détail."
  }
}



# Les lignes de la branche des langues. <language> est le nom d'une langue, et <languages> la
# liste de celles que ce plugin a trouvées. Une langue est un fichier dans ce dossier : écris
# messages_it.conf et l'italien est proposé, sans nouvelle compilation ni liste à modifier.
language {
  current           = "<tag:'CONNEXION'> <body>Tu lis ceci en <value><language><body>."
  choices           = "<tag:'CONNEXION'> <body>Tu peux le lire en <value><languages><body>."
  changed           = "<tag:'CONNEXION'> <body>Tu lis maintenant ceci en <value><language><body>."
  already           = "<tag:'CONNEXION'> <body>Tu lis déjà ceci en <value><language><body>."
  reset             = "<tag:'CONNEXION'> <body>Tu n'as plus de langue à toi."
  separator         = "<dim>, "
  unknown           = "<etag:'ERREUR'> <body>Ce serveur n'a pas <value><input><body>. Il a <value><languages><body>."
  forced            = "<etag:'ERREUR'> <body>Ce serveur n'utilise qu'une langue, et c'est <value><language><body>."

  # Ce que lit un opérateur après avoir défini ou effacé la langue d'un autre joueur. <player>
  # est le nom du joueur. Un joueur absent reçoit le changement à sa prochaine connexion.
  set-player        = "<tag:'CONNEXION'> <value><player><body> lit maintenant en <value><language><body>."
  set-player-away   = "<tag:'CONNEXION'> <value><player><body> est absent et lira en <value><language><body> dès sa prochaine connexion."
  reset-player      = "<tag:'CONNEXION'> <value><player><body> n'a plus de langue à lui."
  reset-player-away = "<tag:'CONNEXION'> <value><player><body> est absent, et sa langue sera effacée à sa prochaine connexion."
  forced-anyway     = "<tag:'CONNEXION'> <body>C'est gardé, et tout le monde lit en <value><language><body> tant que c'est imposé."
  unknown-player    = "<etag:'ERREUR'> <body>Personne du nom de <value><input><body> n'a joué ici."
}

# Les lignes qu'écrit la couche de commandes d'uxmLib : la page d'aide, un argument refusé, un
# temps de recharge. Elles sont ici pour être traduites avec le reste et colorées depuis
# theme.conf. Une valeur entre chevrons est insérée telle quelle et jamais exécutée.
command {
  no-permission     = "<etag:'ERREUR'> <body>Tu n'as pas la permission de faire ça."
  player-only       = "<etag:'ERREUR'> <body>Seul un joueur peut utiliser cette commande."
  invalid-value     = "<etag:'ERREUR'> <body><value><input><body> n'est pas une valeur valide pour <value><argument><body>."
  invalid-value-why = "<etag:'ERREUR'> <body><value><input><body> n'est pas une valeur valide pour <value><argument><body> : <subtext><reason>"
  not-one-of        = "<etag:'ERREUR'> <body><value><input><body> n'est pas une valeur valide pour <value><argument><body>. Essaie l'une de <value><allowed><body>."
  invalid-argument  = "<etag:'ERREUR'> <body><detail>"
  bad-argument      = "<etag:'ERREUR'> <body>Cet argument n'est pas valide."
  internal-error    = "<etag:'ERREUR'> <body>Quelque chose s'est mal passé pendant cette commande. La console en donne la raison."
  on-cooldown       = "<etag:'ERREUR'> <body>Attends <value><time><body> avant de recommencer."
  help-header       = "<h:'Aide'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command      = "<value><command>"
  help-separator    = "<dim> : "
  help-description  = "<subtext><description>"
  help-fill-hint    = "<subtext>Clique pour écrire cette commande."
  help-page-hint    = "<subtext>Page <value><page>"
  storage            = "<etag:'ERREUR'> <body>Ce serveur ne peut pas joindre ses comptes pour le moment. Réessaie dans une minute."
}

# Ce qu’un joueur lit pendant qu’il attend d’entrer. Les commandes nommées ici sont celles fournies
# : si tu les renommes dans commands.conf, écris aussi les nouveaux noms ici.
join {
  register-title    = "<value>Bienvenue"
  register-subtitle = "<body>Choisis un mot de passe avec <value>/register"
  login-title       = "<value>Bon retour"
  login-subtitle    = "<body>Connecte-toi avec <value>/login"
  code-title        = "<value>Encore une étape"
  code-subtitle     = "<body>Tape ton code de connexion avec <value>/2fa"
}

reminder {
  register = "<body>Inscris-toi avec <value>/register <password> <password>"
  login    = "<body>Connecte-toi avec <value>/login <password>"
  code     = "<body>Tape ton code de connexion avec <value>/2fa <code>"
}

chat {
  register-password = "<body>Tape dans le chat un mot de passe pour ce nom. Personne d’autre ne le lit."
  register-repeat   = "<body>Tape le même mot de passe encore une fois."
  login-password    = "<body>Tape ton mot de passe dans le chat pour te connecter. Personne d’autre ne le lit."
  code              = "<body>Tape ton code de connexion dans le chat : celui que ton appli affiche, ou celui qu’on t’a envoyé par mail."
}

welcome {
  registered = "<good>Ton compte est prêt"
  logged-in  = "<good>Connecté"
}

# La raison qu’un joueur lit sur l’écran vers lequel il est expulsé. <min> et <max> sont les
# longueurs qu’un nom peut avoir, <word> le mot bloqué qu’un nom contient, <name> l’orthographe sous
# laquelle un nom a été inscrit. Un temps restant, dans ses deux plus grandes unités : <n> est le
# nombre.
time {
  days      = "<n>j"
  hours     = "<n>h"
  minutes   = "<n>min"
  seconds   = "<n>s"
  separator = " "
}

kick {
  # <time> est ce qu’il reste au bannissement.
  banned            = "<body>Trop de mauvais mots de passe sont venus de ton adresse. Réessaie dans <value><time><body>."
  too-many-connections = "<body>Trop de connexions sont venues de ton adresse. Réessaie dans <value><time><body>."
  # <country> est le code à deux lettres donné par le fichier des pays, ou ? quand il n’en
  # connaissait aucun.
  country           = "<body>Ce serveur n’accepte pas les joueurs de là où tu te connectes."
  logged-out        = "<body>Tu t’es déconnecté. Reviens pour rentrer."
  already-online    = "<body>Quelqu’un est déjà connecté sous ce nom. Si c’était toi, attends un instant et reviens."
  cancelled         = "<body>Tu es parti avant de te connecter. Reviens quand tu veux."
  storage           = "<body>Ce serveur ne peut pas joindre ses comptes pour le moment. Réessaie dans une minute."
  hold-unsaved      = "<body>Ce serveur n’a pas pu garder tes affaires en sécurité pendant ta connexion, tu as donc été déconnecté avec elles. Reviens."
  timeout           = "<body>Tu as mis trop de temps à te connecter. Reviens pour réessayer."
  timeout-register  = "<body>Tu as mis trop de temps à t’inscrire. Reviens pour réessayer."
  too-many-attempts = "<body>Trop de mauvais mots de passe. Reviens pour réessayer."
  name-too-short    = "<body>Ton nom est trop court ici. Utilise un nom d’au moins <value><min><body> caractères."
  name-too-long     = "<body>Ton nom est trop long ici. Utilise un nom d’au plus <value><max><body> caractères."
  name-characters   = "<body>Ton nom contient un caractère que ce serveur n’autorise pas. Utilise un autre nom."
  name-blocked      = "<body>Ton nom contient un mot que ce serveur n’autorise pas : <value><word>"
  name-case         = "<body>Ce nom est inscrit comme <value><name><body>. Reviens avec exactement cette orthographe."
  lookup-failed     = "<body>Ce serveur ne peut pas vérifier pour le moment si ton nom appartient à un compte Minecraft payant. Réessaie dans une minute."
  paid-name         = "<body>Ce nom appartient à un compte Minecraft payant, et ta dernière tentative n’a pas passé la vérification de Mojang. Si le nom est à toi, rejoins depuis le launcher officiel. Sinon, rejoins sous un autre nom."
  paid-name-moved   = "<body>Ce nom appartient maintenant à son propriétaire payant. Ton compte ici s’appelle maintenant <value><name><body> : change ton nom pour celui-là et reviens. Ton mot de passe et tout ce que tu avais sont restés pareils."
  paid-spelling     = "<body>Ce nom appartient à un compte Minecraft payant qui l’écrit avec d’autres majuscules. Si le compte est à toi, rejoins depuis le launcher officiel. Sinon, rejoins sous un autre nom."
  premium-address   = "<body>Cette adresse est pour les comptes Minecraft payants, et ta dernière tentative n’a pas passé la vérification de Mojang. Rejoins par l’autre adresse du serveur pour jouer avec un mot de passe."
  name-disputed     = "<body>Deux joueurs veulent ce nom, et le staff va trancher. Reviens une fois que ce sera fait."
  name-kept         = "<body>Un autre joueur a pris ce nom ici en premier et le garde. Change ton nom chez Mojang pour jouer ici."
  claimed           = "<body>Reviens depuis le launcher officiel de Minecraft. Ta prochaine connexion d’ici prouve que ce nom est à toi."
  network-claim     = "<body>Ce serveur n’a pas pu confirmer ta connexion auprès du réseau. Reviens."
  network-channel   = "<body>Ton client a fermé un canal dont le réseau a besoin pour suivre ta connexion. Reviens."
  start-failed      = "La connexion de ce serveur n’a pas pu démarrer, donc personne ne peut entrer tant que le staff ne l’a pas réparée. Réessaie plus tard."
}

# Les réponses à /login, /register, /changepassword et /logout. <left> est le nombre d’essais
# restants, <name> un nom tel que son propriétaire l’a écrit, <old> et <new> les noms entre lesquels
# un compte a changé quand le propriétaire payant de son nom l’a prouvé.
login {
  wrong          = "<etag:'ERREUR'> <body>Ce mot de passe est faux. Essais restants : <value><left><body>."
  not-registered = "<etag:'ERREUR'> <body>Tu n’as pas encore de mot de passe ici. Inscris-toi avec <value>/register<body>."
  already        = "<tag:'CONNEXION'> <body>Tu es déjà connecté."
  usage          = "<tag:'CONNEXION'> <body>Tape ton mot de passe après la commande : <value>/login <password>"
  must-replace   = "<body>Ton mot de passe était bon, mais il ne respecte plus les règles de ce serveur. Mets-en un nouveau avec <value>/changepassword <current> <new><body> pour entrer."
  handshake-failed = "<tag:'CONNEXION'> <body>Ta dernière connexion a été refusée parce que ce nom appartient à un compte Minecraft payant et que Mojang n’a pas confirmé que c’était toi. Cette fois, tu es entré avec un mot de passe. Si le nom est à toi, utilise <value>/claim<body>."
  renamed          = "<tag:'CONNEXION'> <body>Le propriétaire payant de <value><old><body> a prouvé le nom, donc ton compte est passé à <value><new><body> avec tout ce qu’il avait. Rejoins désormais sous <value><new><body>."
  refused = "<tag:'CONNEXION'> <body>Ta connexion a été refusée."
  locked = "<etag:'ERREUR'> <body>Trop de mots de passe ou de codes erronés ont été saisis pour ce compte récemment. Réessaie dans <value><time><body>."
  closed = "<etag:'ERREUR'> <body>Ce compte est banni ou fermé sur le site, il ne peut donc pas se connecter ici."
}

# Les réponses à /claim et /premium.
claim {
  unavailable     = "<etag:'ERREUR'> <body>Ce serveur ne peut pas demander à Mojang à qui appartient un nom, donc il n’y a rien à réclamer ici."
  already-premium = "<tag:'CONNEXION'> <body>Ton compte a déjà prouvé son nom."
  not-this-rule   = "<etag:'ERREUR'> <body>Ce serveur vérifie les noms payants lui-même, donc il n’y a rien à réclamer."
  shared-address  = "<etag:'ERREUR'> <body>Tu te connectes par un service qui cache ta propre adresse, donc une réclamation ne peut pas être liée à ta prochaine connexion. Demande au staff de régler le nom."
}

premium {
  log-in-first = "<etag:'ERREUR'> <body>Connecte-toi d’abord, puis utilise <value>/premium<body> pour prouver ton nom à ta prochaine connexion."
}

# Ce que le proxy d’un réseau dit à un joueur qui ne s’est pas encore connecté.
network {
  log-in-first = "<etag:'ERREUR'> <body>Connecte-toi d’abord. D’ici là, tu restes sur ce serveur, et les commandes du réseau attendent."
}

register {
  rules-needed   = "<etag:'ERREUR'> <body>Coche d’abord la case pour accepter les règles."
  too-many-accounts = "<etag:'ERREUR'> <body>Trop de comptes ont été créés depuis ton adresse récemment. Réessaie plus tard."
  mismatch       = "<etag:'ERREUR'> <body>Les deux mots de passe ne sont pas identiques."
  confirm-needed = "<etag:'ERREUR'> <body>Écris le mot de passe deux fois : <value>/register <password> <password>"
  usage          = "<tag:'CONNEXION'> <body>Tape un mot de passe après la commande, deux fois : <value>/register <password> <password>"
  usage-once     = "<tag:'CONNEXION'> <body>Tape un mot de passe après la commande : <value>/register <password>"
  name-taken     = "<etag:'ERREUR'> <body>Le nom <value><name><body> a déjà un compte."
  already        = "<etag:'ERREUR'> <body>Tu as déjà un compte. Connecte-toi avec <value>/login<body>."
  refused = "<tag:'CONNEXION'> <body>Ton inscription a été refusée."
}

change {
  done          = "<good>Ton mot de passe est changé. Toutes les sessions mémorisées avec lui sont terminées."
  wrong-old     = "<etag:'ERREUR'> <body>L’ancien mot de passe est faux."
  not-logged-in = "<etag:'ERREUR'> <body>Connecte-toi d’abord."
  needs-both    = "<etag:'ERREUR'> <body>Écris l’ancien mot de passe, puis le nouveau."
  usage         = "<tag:'CONNEXION'> <body>Tape l’ancien mot de passe puis le nouveau : <value>/changepassword <old> <new>"
  usage-once    = "<tag:'CONNEXION'> <body>Tape le nouveau mot de passe après la commande : <value>/changepassword <new>"
}

# Le captcha. Un code est tiré à chaque affichage, et toute réponse le consomme.
captcha {
  usage   = "<tag:'CONNEXION'> <body>Tape le code après la commande : <value>/captcha <code>"
  needed  = "<etag:'ERREUR'> <body>Résous d’abord le captcha."
  wrong   = "<etag:'ERREUR'> <body>Ce n’était pas le code. En voici un nouveau."
  solved  = "<good>Captcha résolu. Continue."
  map     = "<body>Lis le code sur la carte dans ta main et tape <value>/captcha <code><body>."
  map-chat = "<body>Lis le code sur la carte dans ta main et tape-le dans le chat."
  nothing = "<etag:'ERREUR'> <body>Il n’y a pas de captcha à résoudre."
}

# Les réponses à /session. <minutes> est la durée pendant laquelle une connexion depuis la même
# adresse saute le mot de passe.
session {
  usage        = "<body>Utilise <value>/session on<body> pour sauter le mot de passe depuis cette adresse la prochaine fois, ou <value>/session off<body> pour qu’on te le demande à chaque connexion."
  on           = "<good>Depuis cette adresse, tu sautes le mot de passe pendant <value><minutes><good> minutes après chaque connexion."
  off          = "<good>On te demandera ton mot de passe à chaque connexion."
  log-in-first = "<etag:'ERREUR'> <body>Connecte-toi d’abord, puis choisis."
  not-chosen   = "<etag:'ERREUR'> <body>Ce serveur décide des sessions pour tout le monde, donc il n’y a rien à choisir."
}

