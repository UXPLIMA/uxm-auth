  too-long-for-the-hash   = "<etag:'ERREUR'> <body>Ce mot de passe est trop long pour être gardé entier. Utilise moins de lettres hors de l’alphabet anglais."
  bad-characters          = "<etag:'ERREUR'> <body>Ce mot de passe contient un caractère que ce serveur n’autorise pas."
  common                  = "<etag:'ERREUR'> <body>Ce mot de passe est l’un des plus courants. Choisis-en un autre."
  breached                = "<etag:'ERREUR'> <body>Ce mot de passe est connu d’une fuite de données ailleurs. Choisis-en un autre."
  missing                 = "<etag:'ERREUR'> <body>Ici, un mot de passe doit contenir <value><classes><body>."
