  mail-failed = "<etag:'ERREUR'> <body>Le mail n’a pas pu être envoyé. Réessaie plus tard."
  expired = "<etag:'ERREUR'> <body>Ce code est trop ancien. Demandes-en un nouveau avec <value>/email add <address><body>."
  nothing-pending = "<etag:'ERREUR'> <body>Aucun code n’attend. Demandes-en un avec <value>/email add <address><body>."
  too-many-attempts = "<etag:'ERREUR'> <body>Les essais de ce code sont épuisés. Demandes-en un nouveau avec <value>/email add <address><body>."
  none-linked = "<etag:'ERREUR'> <body>Aucune adresse n’est liée."
  factor-on = "<etag:'ERREUR'> <body>Ton code de connexion va à cette adresse. Désactive-le d’abord avec <value>/2fa email off <code><body>."
  required = "<etag:'ERREUR'> <body>Ce serveur garde une adresse pour un mot de passe oublié. Lies-en une avec <value>/email add <address><body>, puis <value>/email confirm <code><body> avec le code qu’elle reçoit."
