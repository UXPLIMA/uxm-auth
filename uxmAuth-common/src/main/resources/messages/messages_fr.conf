  not-waiting = "<etag:'ERREUR'> <body>Un mot de passe se récupère à la connexion, avant d’être tapé."
  usage = "<etag:'ERREUR'> <body>Tape <value>/recover<body> pour un code, puis <value>/recover <code> <new password><body>."
  done = "<good>Ton nouveau mot de passe est défini. Connecte-toi avec <value>/login <password><good>."
  wrong = "<etag:'ERREUR'> <body>Ce n’est pas le code. Essais restants : <value><left><body>."
