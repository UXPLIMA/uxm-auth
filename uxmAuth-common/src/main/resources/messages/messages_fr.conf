  map             = "<body>Ou scanne le code QR sur la carte dans ta main."
  no-room         = "<body>Libère une case de ta barre d’action et relance <value>/2fa setup<body> pour avoir le code QR sur une carte."
  confirm         = "<body>Ensuite tape <value>/2fa confirm <code><body> avec le code que montre l’appli. Ceci attend <value><minutes><body> minutes."
