  backup-codes    = "<body>Tes codes de secours, pour un téléphone perdu : <value><codes><body>. Chacun fonctionne une fois à la place du code de l’appli. Clique dessus pour les copier et garde-les en lieu sûr, ils ne seront plus affichés."
  off             = "<good>Ton compte ne demande plus de code d’une appli."
  wrong           = "<etag:'ERREUR'> <body>Ce n’est ni le code que ton appli affiche maintenant ni un code de secours."
  nothing-started = "<etag:'ERREUR'> <body>Aucune configuration n’attend. Lance-en une avec <value>/2fa setup<body>."
  already-on      = "<etag:'ERREUR'> <body>Ton compte demande déjà un code d’une appli. Désactive-le d’abord avec <value>/2fa off <code><body>."
  not-on          = "<etag:'ERREUR'> <body>Ton compte ne demande aucun code d’une appli."
  required        = "<etag:'ERREUR'> <body>Ton compte doit demander un code d’une appli d’authentification avant que tu puisses jouer. Tape <value>/2fa setup<body> pour le configurer."
  log-in-first    = "<etag:'ERREUR'> <body>Connecte-toi d’abord."
  password-first  = "<etag:'ERREUR'> <body>Une session mémorisée ne peut pas configurer l’app. Déconnecte-toi avec <value>/logout<body> et connecte-toi d’abord avec ton mot de passe."
  code-needed     = "<body>Tape maintenant le code de ton appli d’authentification, celui reçu par mail ou un code de secours, avec <value>/2fa <code><body>."
  login-wrong     = "<etag:'ERREUR'> <body>Ce n’est ni le code actuel de l’appli, ni le code du mail, ni un code de secours. Essais restants : <value><left><body>."
  nothing-asked   = "<etag:'ERREUR'> <body>Aucun code ne t’est demandé maintenant."
  mail-on         = "<good>Désormais un code de connexion est envoyé à <value><address><good> après ton mot de passe."
  mail-off        = "<good>Plus aucun code de connexion ne t’est envoyé par mail."
  mail-already-on = "<etag:'ERREUR'> <body>Les codes de connexion te sont déjà envoyés par mail."
  mail-not-on     = "<etag:'ERREUR'> <body>Aucun code de connexion ne t’est envoyé par mail."
  mail-no-address = "<etag:'ERREUR'> <body>Lie d’abord une adresse avec <value>/email add <address><body>."
}
