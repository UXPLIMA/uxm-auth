# Deutsche Nachrichten.
#
# Jede Zeile ist MiniMessage, und jede Zeile nennt eine Rolle statt einer Farbe: <body> ist der
# Text, <value> ein Name oder eine Zahl, <tag:'LOGIN'> das Kürzel, mit dem eine Chatzeile
# beginnt. Die Farben hinter diesen Namen stehen in theme.conf.
#
# Schreib hier ganz normale Wörter. Das Plugin setzt die Zeile beim Anzeigen in Kapitälchen;
# ä, ö, ü und ß behalten ihre Form. Das schaltet der Wert small-caps.de in theme.conf ein und aus.
#
# Ein Schlüssel, der hier fehlt, fällt auf den Standard im Code zurück, sodass das Plugin nie eine
# leere Nachricht zeigt. Lösch eine Zeile, um den Standard zurückzubekommen.

admin {
  version       = "<tag:'LOGIN'> <body>uxmAuth <value><version>"
  usage         = "<tag:'LOGIN'> <body>Häng <value>help<body> an diesen Befehl, um alles zu sehen, was er kann."
  reloaded      = "<tag:'LOGIN'> <body>Die Einstellungen sind neu geladen, in <value><ms><body> ms."
  reload-failed = "<etag:'FEHLER'> <body>Das Neuladen ist fehlgeschlagen. Der Grund steht in der Konsole."

  doctor {
    header = "<h:'Wie es dem Plugin geht'>"
    ok     = "<good>ok<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>warnung<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>fehler<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'LOGIN'> <body>Alles hat geantwortet."
    unwell = "<etag:'FEHLER'> <body>Oben stimmt etwas nicht. Die Konsole hat alles dazu."
  }
}



# Die Zeilen des Sprachzweigs. <language> ist der Name einer Sprache, <languages> die Liste der
# Sprachen, die dieses Plugin gefunden hat. Eine Sprache ist eine Datei in diesem Ordner: schreib
# messages_it.conf und Italienisch wird angeboten, ohne neuen Build und ohne Liste zum Bearbeiten.
language {
  current           = "<tag:'LOGIN'> <body>Du liest das auf <value><language><body>."
  choices           = "<tag:'LOGIN'> <body>Du kannst es lesen auf <value><languages><body>."
  changed           = "<tag:'LOGIN'> <body>Du liest das jetzt auf <value><language><body>."
  already           = "<tag:'LOGIN'> <body>Du liest das schon auf <value><language><body>."
  reset             = "<tag:'LOGIN'> <body>Du hast keine eigene Sprache mehr."
  separator         = "<dim>, "
  unknown           = "<etag:'FEHLER'> <body>Dieser Server hat kein <value><input><body>. Er hat <value><languages><body>."
  forced            = "<etag:'FEHLER'> <body>Dieser Server spricht nur eine Sprache, und das ist <value><language><body>."

  # Was ein Operator liest, nachdem er die Sprache eines anderen Spielers gesetzt oder gelöscht
  # hat. <player> ist der Name des Spielers. Wer gerade weg ist, bekommt die Änderung beim
  # nächsten Betreten.
  set-player        = "<tag:'LOGIN'> <value><player><body> liest jetzt <value><language><body>."
  set-player-away   = "<tag:'LOGIN'> <value><player><body> ist nicht da und liest ab dem nächsten Betreten <value><language><body>."
  reset-player      = "<tag:'LOGIN'> <value><player><body> hat keine eigene Sprache mehr."
  reset-player-away = "<tag:'LOGIN'> <value><player><body> ist nicht da, die Sprache wird beim nächsten Betreten gelöscht."
  forced-anyway     = "<tag:'LOGIN'> <body>Gespeichert, aber solange die Sprache erzwungen ist, liest jeder <value><language><body>."
  unknown-player    = "<etag:'FEHLER'> <body>Niemand namens <value><input><body> hat hier je gespielt."
}

# Die Zeilen, die die Befehlsschicht von uxmLib schreibt: die Hilfeseite, ein abgelehntes
# Argument, eine Abklingzeit. Sie stehen hier, damit sie mit dem Rest übersetzt und aus
# theme.conf gefärbt werden. Ein Wert in spitzen Klammern wird so eingesetzt, wie er
# geschrieben ist, und nie ausgeführt.
command {
  no-permission     = "<etag:'FEHLER'> <body>Dafür hast du keine Berechtigung."
  player-only       = "<etag:'FEHLER'> <body>Nur ein Spieler kann diesen Befehl ausführen."
  invalid-value     = "<etag:'FEHLER'> <body><value><input><body> ist kein gültiger Wert für <value><argument><body>."
  invalid-value-why = "<etag:'FEHLER'> <body><value><input><body> ist kein gültiger Wert für <value><argument><body>: <subtext><reason>"
  not-one-of        = "<etag:'FEHLER'> <body><value><input><body> ist kein gültiger Wert für <value><argument><body>. Versuch einen von <value><allowed><body>."
  invalid-argument  = "<etag:'FEHLER'> <body><detail>"
  bad-argument      = "<etag:'FEHLER'> <body>Dieses Argument ist nicht gültig."
  internal-error    = "<etag:'FEHLER'> <body>Beim Ausführen des Befehls ist etwas schiefgegangen. Der Grund steht in der Konsole."
  on-cooldown       = "<etag:'FEHLER'> <body>Warte <value><time><body>, bevor du das wieder benutzt."
  help-header       = "<h:'Hilfe'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command      = "<value><command>"
  help-separator    = "<dim> : "
  help-description  = "<subtext><description>"
  help-fill-hint    = "<subtext>Klick, um diesen Befehl zu schreiben."
  help-page-hint    = "<subtext>Seite <value><page>"
  storage            = "<etag:'FEHLER'> <body>Dieser Server erreicht seine Konten gerade nicht. Versuch es in einer Minute noch einmal."
}

# Was ein Spieler liest, während er darauf wartet, hineinzukommen. Die hier genannten Befehle sind
# die mitgelieferten: Wenn du sie in commands.conf umbenennst, schreib die neuen Namen auch hier.
join {
  register-title    = "<value>Willkommen"
  register-subtitle = "<body>Wähl ein Passwort mit <value>/register"
  login-title       = "<value>Willkommen zurück"
  login-subtitle    = "<body>Melde dich an mit <value>/login"
  code-title        = "<value>Noch ein Schritt"
  code-subtitle     = "<body>Gib deinen Anmeldecode ein mit <value>/2fa"
}

reminder {
  register = "<body>Registrier dich mit <value>/register <password> <password>"
  login    = "<body>Melde dich an mit <value>/login <password>"
  code     = "<body>Gib deinen Anmeldecode ein mit <value>/2fa <code>"
}

chat {
  register-password = "<body>Schreib ein Passwort für diesen Namen in den Chat. Niemand sonst liest es."
  register-repeat   = "<body>Schreib dasselbe Passwort noch einmal."
  login-password    = "<body>Schreib dein Passwort in den Chat, um dich anzumelden. Niemand sonst liest es."
  code              = "<body>Schreib deinen Anmeldecode in den Chat: den aus deiner App oder den, der dir gemailt wurde."
}

welcome {
  registered = "<good>Dein Konto ist bereit"
  logged-in  = "<good>Angemeldet"
}

# Der Grund, den ein Spieler auf dem Bildschirm liest, auf den er gekickt wird. <min> und <max> sind
# die erlaubten Längen eines Namens, <word> das gesperrte Wort in einem Namen, <name> die
# Schreibweise, in der ein Name registriert wurde. Eine verbleibende Zeit in ihren zwei größten
# Einheiten: <n> ist die Zahl.
time {
  days      = "<n>T"
  hours     = "<n>Std"
  minutes   = "<n>Min"
  seconds   = "<n>s"
  separator = " "
}

kick {
  # <time> ist, was von der Sperre übrig ist.
  banned            = "<body>Von deiner Adresse kamen zu viele falsche Passwörter. Versuch es in <value><time><body> noch einmal."
  too-many-connections = "<body>Von deiner Adresse kamen zu viele Verbindungen. Versuch es in <value><time><body> noch einmal."
  # <country> ist der zweistellige Code, den die Länderdatei geliefert hat, oder ?, wenn sie keinen
  # kannte.
  country           = "<body>Dieser Server nimmt keine Spieler von dort, wo du dich verbindest."
  logged-out        = "<body>Du hast dich abgemeldet. Tritt wieder bei, um zurückzukommen."
  already-online    = "<body>Unter diesem Namen ist schon jemand verbunden. Wenn du das warst, warte kurz und tritt wieder bei."
  cancelled         = "<body>Du bist gegangen, bevor du dich angemeldet hast. Tritt wieder bei, wann du willst."
  storage           = "<body>Dieser Server erreicht seine Konten gerade nicht. Versuch es in einer Minute noch einmal."
  hold-unsaved      = "<body>Dieser Server konnte deine Sachen während der Anmeldung nicht sicher aufbewahren, also wurdest du mit ihnen getrennt. Tritt erneut bei."
  timeout           = "<body>Du hast zu lange für die Anmeldung gebraucht. Tritt wieder bei, um es noch einmal zu versuchen."
  timeout-register  = "<body>Du hast zu lange für die Registrierung gebraucht. Tritt wieder bei, um es noch einmal zu versuchen."
  too-many-attempts = "<body>Zu viele falsche Passwörter. Tritt wieder bei, um es noch einmal zu versuchen."
  name-too-short    = "<body>Dein Name ist hier zu kurz. Nimm einen Namen mit mindestens <value><min><body> Zeichen."
  name-too-long     = "<body>Dein Name ist hier zu lang. Nimm einen Namen mit höchstens <value><max><body> Zeichen."
  name-characters   = "<body>Dein Name enthält ein Zeichen, das dieser Server nicht erlaubt. Nimm einen anderen Namen."
  name-blocked      = "<body>Dein Name enthält ein Wort, das dieser Server nicht erlaubt: <value><word>"
  name-case         = "<body>Dieser Name ist als <value><name><body> registriert. Tritt mit genau dieser Schreibweise wieder bei."
  lookup-failed     = "<body>Dieser Server kann gerade nicht prüfen, ob dein Name zu einem gekauften Minecraft-Konto gehört. Versuch es in einer Minute noch einmal."
  paid-name         = "<body>Dieser Name gehört zu einem gekauften Minecraft-Konto, und dein letzter Versuch hat Mojangs Prüfung nicht bestanden. Wenn der Name deiner ist, tritt über den offiziellen Launcher bei. Wenn nicht, tritt unter einem anderen Namen bei."
  paid-name-moved   = "<body>Dieser Name gehört jetzt seinem zahlenden Besitzer. Dein Konto hier heißt jetzt <value><name><body>: Ändere deinen Namen dahin und tritt wieder bei. Dein Passwort und alles, was du hattest, sind wie vorher."
  paid-spelling     = "<body>Dieser Name gehört zu einem gekauften Minecraft-Konto, das ihn mit anderer Groß- und Kleinschreibung schreibt. Wenn das Konto deins ist, tritt über den offiziellen Launcher bei. Wenn nicht, tritt unter einem anderen Namen bei."
  premium-address   = "<body>Diese Adresse ist für gekaufte Minecraft-Konten, und dein letzter Versuch hat Mojangs Prüfung nicht bestanden. Tritt über die andere Adresse des Servers bei, um mit Passwort zu spielen."
  name-disputed     = "<body>Zwei Spieler wollen diesen Namen, und das Team klärt das. Tritt wieder bei, sobald es geklärt ist."
  name-kept         = "<body>Ein anderer Spieler hat diesen Namen hier zuerst genommen und behält ihn. Ändere deinen Namen bei Mojang, um hier zu spielen."
  claimed           = "<body>Tritt über den offiziellen Minecraft-Launcher wieder bei. Deine nächste Verbindung von hier beweist, dass dieser Name deiner ist."
  network-claim     = "<body>Dieser Server konnte deine Anmeldung beim Netzwerk nicht bestätigen. Tritt wieder bei."
  network-channel   = "<body>Dein Client hat einen Kanal geschlossen, den das Netzwerk für deine Anmeldung braucht. Tritt wieder bei."
  start-failed      = "Die Anmeldung dieses Servers konnte nicht starten, also kann niemand beitreten, bis das Team sie repariert. Versuch es später noch einmal."
}

# Die Antworten auf /login, /register, /changepassword und /logout. <left> ist, wie viele Versuche
# bleiben, <name> ein Name, wie sein Besitzer ihn schrieb, <old> und <new> die Namen, zwischen denen
# ein Konto wechselte, als der zahlende Besitzer seines Namens ihn bewiesen hat.
login {
  wrong          = "<etag:'FEHLER'> <body>Dieses Passwort ist falsch. Verbleibende Versuche: <value><left><body>."
  not-registered = "<etag:'FEHLER'> <body>Du hast hier noch kein Passwort. Registrier dich mit <value>/register<body>."
  already        = "<tag:'LOGIN'> <body>Du bist schon angemeldet."
  usage          = "<tag:'LOGIN'> <body>Schreib dein Passwort nach dem Befehl: <value>/login <password>"
  must-replace   = "<body>Dein Passwort war richtig, entspricht aber nicht mehr den Regeln dieses Servers. Setz ein neues mit <value>/changepassword <current> <new><body>, um hineinzukommen."
  handshake-failed = "<tag:'LOGIN'> <body>Deine letzte Verbindung wurde abgelehnt, weil dieser Name zu einem gekauften Minecraft-Konto gehört und Mojang nicht bestätigt hat, dass du es warst. Diesmal bist du stattdessen mit Passwort hereingekommen. Wenn der Name deiner ist, nimm <value>/claim<body>."
  renamed          = "<tag:'LOGIN'> <body>Der zahlende Besitzer von <value><old><body> hat den Namen bewiesen, also ist dein Konto mit allem, was es hatte, zu <value><new><body> umgezogen. Tritt ab jetzt als <value><new><body> bei."
  refused = "<tag:'LOGIN'> <body>Deine Anmeldung wurde abgelehnt."
  locked = "<etag:'FEHLER'> <body>Für dieses Konto wurden zuletzt zu viele falsche Passwörter oder Codes eingegeben. Versuche es in <value><time><body> erneut."
}

# Die Antworten auf /claim und /premium.
claim {
  unavailable     = "<etag:'FEHLER'> <body>Dieser Server kann Mojang nicht fragen, wem ein Name gehört, also gibt es hier nichts zu beanspruchen."
  already-premium = "<tag:'LOGIN'> <body>Dein Konto hat seinen Namen schon bewiesen."
  not-this-rule   = "<etag:'FEHLER'> <body>Dieser Server beweist gekaufte Namen selbst, also gibt es nichts zu beanspruchen."
  shared-address  = "<etag:'FEHLER'> <body>Du verbindest dich über einen Dienst, der deine eigene Adresse verbirgt, also lässt sich ein Anspruch nicht an deine nächste Verbindung binden. Bitte das Team, den Namen zu klären."
}

premium {
  log-in-first = "<etag:'FEHLER'> <body>Melde dich zuerst an, dann nimm <value>/premium<body>, um deinen Namen bei der nächsten Verbindung zu beweisen."
}

# Was der Proxy eines Netzwerks einem Spieler sagt, der sich noch nicht angemeldet hat.
network {
  log-in-first = "<etag:'FEHLER'> <body>Melde dich zuerst an. Bis dahin bleibst du auf diesem Server, und die Befehle des Netzwerks warten."
}

register {
  rules-needed   = "<etag:'FEHLER'> <body>Hak zuerst das Kästchen an, um die Regeln zu akzeptieren."
  too-many-accounts = "<etag:'FEHLER'> <body>Von deiner Adresse wurden zuletzt zu viele Konten erstellt. Versuch es später noch einmal."
  mismatch       = "<etag:'FEHLER'> <body>Die beiden Passwörter sind nicht gleich."
  confirm-needed = "<etag:'FEHLER'> <body>Schreib das Passwort zweimal: <value>/register <password> <password>"
  usage          = "<tag:'LOGIN'> <body>Schreib ein Passwort nach dem Befehl, zweimal: <value>/register <password> <password>"
  usage-once     = "<tag:'LOGIN'> <body>Schreib ein Passwort nach dem Befehl: <value>/register <password>"
  name-taken     = "<etag:'FEHLER'> <body>Der Name <value><name><body> hat schon ein Konto."
  already        = "<etag:'FEHLER'> <body>Du hast schon ein Konto. Melde dich an mit <value>/login<body>."
  refused = "<tag:'LOGIN'> <body>Deine Registrierung wurde abgelehnt."
}

change {
  done          = "<good>Dein Passwort ist geändert. Jede gemerkte Sitzung damit ist beendet."
  wrong-old     = "<etag:'FEHLER'> <body>Das alte Passwort ist falsch."
  not-logged-in = "<etag:'FEHLER'> <body>Melde dich zuerst an."
  needs-both    = "<etag:'FEHLER'> <body>Schreib das alte Passwort, dann das neue."
  usage         = "<tag:'LOGIN'> <body>Schreib das alte Passwort und dann das neue: <value>/changepassword <old> <new>"
  usage-once    = "<tag:'LOGIN'> <body>Schreib das neue Passwort nach dem Befehl: <value>/changepassword <new>"
}

# Das Captcha. Für jede Anzeige wird ein neuer Code gezogen, und jede Antwort verbraucht ihn.
captcha {
  usage   = "<tag:'LOGIN'> <body>Schreib den Code nach dem Befehl: <value>/captcha <code>"
  needed  = "<etag:'FEHLER'> <body>Löse zuerst das Captcha."
  wrong   = "<etag:'FEHLER'> <body>Das war nicht der Code. Hier ist ein neuer."
  solved  = "<good>Captcha gelöst. Weiter."
  map     = "<body>Lies den Code auf der Karte in deiner Hand und schreib <value>/captcha <code><body>."
  map-chat = "<body>Lies den Code auf der Karte in deiner Hand und schreib ihn in den Chat."
  nothing = "<etag:'FEHLER'> <body>Es gibt kein Captcha zu beantworten."
}

# Die Antworten auf /session. <minutes> ist, wie lange eine Anmeldung von derselben Adresse das
# Passwort überspringt.
session {
  usage        = "<body>Nimm <value>/session on<body>, um das Passwort von dieser Adresse nächstes Mal zu überspringen, oder <value>/session off<body>, um bei jedem Beitritt gefragt zu werden."
  on           = "<good>Von dieser Adresse überspringst du das Passwort für <value><minutes><good> Minuten nach jeder Anmeldung."
  off          = "<good>Du wirst bei jedem Beitritt nach deinem Passwort gefragt."
  log-in-first = "<etag:'FEHLER'> <body>Melde dich zuerst an, dann wähle."
  not-chosen   = "<etag:'FEHLER'> <body>Dieser Server entscheidet Sitzungen für alle, also gibt es nichts zu wählen."
}

# Die Antworten auf /2fa. <secret> ist der Schlüssel, den eine App bekommt, <link> derselbe als
# Link, und <minutes>, wie lange eine Einrichtung auf ihren ersten Code wartet.
factor {
  usage           = "<body>Nimm <value>/2fa setup<body>, um nach dem Passwort einen Code aus einer Authenticator-App abzufragen, <value>/2fa email on<body>, um ihn stattdessen per Mail zu bekommen, <value>/2fa backup <code><body> für neue Backup-Codes, oder <value>/2fa off <code><body>, um aufzuhören."
  secret          = "<body>Füg in deiner Authenticator-App ein Konto mit diesem Schlüssel hinzu: <value><secret><body>. Klick darauf, um ihn zu kopieren."
  link            = "<body>Oder öffne diesen Link auf dem Handy: <value><link><body>. Klick darauf, um ihn zu kopieren."
  map             = "<body>Oder scanne den QR-Code auf der Karte in deiner Hand."
  no-room         = "<body>Mach einen Platz in deiner Schnellleiste frei und führ <value>/2fa setup<body> noch einmal aus, um den QR-Code auf einer Karte zu bekommen."
  confirm         = "<body>Dann schreib <value>/2fa confirm <code><body> mit dem Code, den die App zeigt. Das wartet <value><minutes><body> Minuten."
  on              = "<good>Ab jetzt fragt dein Konto nach dem Passwort einen Code aus deiner App ab."
  backup-codes    = "<body>Deine Backup-Codes, für ein verlorenes Handy: <value><codes><body>. Jeder funktioniert einmal statt des App-Codes. Klick darauf, um sie zu kopieren, und bewahr sie sicher auf, sie werden nicht noch einmal gezeigt."
  off             = "<good>Dein Konto fragt keinen Code aus einer App mehr ab."
  wrong           = "<etag:'FEHLER'> <body>Das ist weder der Code, den deine App gerade zeigt, noch ein Backup-Code."
  nothing-started = "<etag:'FEHLER'> <body>Keine Einrichtung wartet. Starte eine mit <value>/2fa setup<body>."
  already-on      = "<etag:'FEHLER'> <body>Dein Konto fragt schon einen Code aus einer App ab. Schalte das zuerst aus mit <value>/2fa off <code><body>."
  not-on          = "<etag:'FEHLER'> <body>Dein Konto fragt keinen Code aus einer App ab."
  required        = "<etag:'FEHLER'> <body>Dein Konto muss einen Code aus einer Authenticator-App abfragen, bevor du spielen kannst. Schreib <value>/2fa setup<body>, um das einzurichten."
  log-in-first    = "<etag:'FEHLER'> <body>Melde dich zuerst an."
  password-first  = "<etag:'FEHLER'> <body>Eine gemerkte Sitzung kann die App nicht einrichten. Melde dich mit <value>/logout<body> ab und zuerst mit deinem Passwort an."
  code-needed     = "<body>Schreib jetzt den Code aus deiner Authenticator-App, den gemailten Code oder einen Backup-Code mit <value>/2fa <code><body>."
  login-wrong     = "<etag:'FEHLER'> <body>Das ist weder der aktuelle App-Code noch der gemailte Code noch ein Backup-Code. Verbleibende Versuche: <value><left><body>."
  nothing-asked   = "<etag:'FEHLER'> <body>Gerade wird kein Code von dir verlangt."
  mail-on         = "<good>Ab jetzt wird nach deinem Passwort ein Anmeldecode an <value><address><good> gemailt."
  mail-off        = "<good>Dir werden keine Anmeldecodes mehr gemailt."
  mail-already-on = "<etag:'FEHLER'> <body>Dir werden schon Anmeldecodes gemailt."
  mail-not-on     = "<etag:'FEHLER'> <body>Dir werden keine Anmeldecodes gemailt."
  mail-no-address = "<etag:'FEHLER'> <body>Verknüpf zuerst eine Adresse mit <value>/email add <address><body>."
}
# Antworten von /email. <address> ist immer die maskierte Adresse, <minutes>, wie lange ein Code
# gilt, <seconds>, wie lange es dauert, bis ein weiterer Code gehen darf, <left> die Versuche, die
# ein Code noch hat.
email {
  usage = "<body>Nimm <value>/email add <address><body>, um eine Adresse zu verknüpfen, an die ein vergessenes Passwort geschickt wird, <value>/email confirm <code><body> mit dem Code, den sie bekommt, oder <value>/email remove<body>, um sie zu entfernen."
  linked = "<body>Jetzt verknüpft: <value><address><body>."
  sent = "<good>Ein Code ging an <value><address><good>. Schreib <value>/email confirm <code><good> innerhalb von <value><minutes><good> Minuten."
  cooldown = "<etag:'FEHLER'> <body>Gerade ging ein Code raus. Frag in <value><seconds><body> Sekunden noch einmal."
  confirmed = "<good>Verknüpft: <value><address><good>. Ein vergessenes Passwort kann darüber neu gesetzt werden."
  wrong = "<etag:'FEHLER'> <body>Das ist nicht der Code. Verbleibende Versuche: <value><left><body>."
  already-linked = "<etag:'FEHLER'> <body><value><address><body> ist schon verknüpft."
  removed = "<good><value><address><good> ist nicht mehr verknüpft."
  not-an-address = "<etag:'FEHLER'> <body>Das ist keine Mailadresse."
  domain-refused = "<etag:'FEHLER'> <body>Dieser Server nimmt keine Adresse bei dieser Domain."
  mail-off = "<etag:'FEHLER'> <body>Dieser Server verschickt keine Mails."
  mail-failed = "<etag:'FEHLER'> <body>Die Mail konnte nicht verschickt werden. Versuch es später noch einmal."
  expired = "<etag:'FEHLER'> <body>Dieser Code ist zu alt. Fordere einen neuen an mit <value>/email add <address><body>."
  nothing-pending = "<etag:'FEHLER'> <body>Kein Code wartet. Fordere einen an mit <value>/email add <address><body>."
  too-many-attempts = "<etag:'FEHLER'> <body>Die Versuche für diesen Code sind aufgebraucht. Fordere einen neuen an mit <value>/email add <address><body>."
  none-linked = "<etag:'FEHLER'> <body>Keine Adresse ist verknüpft."
  factor-on = "<etag:'FEHLER'> <body>Dein Anmeldecode geht an diese Adresse. Schalte das zuerst aus mit <value>/2fa email off <code><body>."
  required = "<etag:'FEHLER'> <body>Dieser Server hält eine Adresse für ein vergessenes Passwort bereit. Verknüpf eine mit <value>/email add <address><body>, dann <value>/email confirm <code><body> mit dem Code, den sie bekommt."
  required-keep = "<etag:'FEHLER'> <body>Dieser Server verlangt eine Adresse, also kann sie nicht entfernt werden. Verknüpf eine andere mit <value>/email add <address><body>, um sie zu ersetzen."
  log-in-first = "<etag:'FEHLER'> <body>Melde dich zuerst an."
  password-first = "<etag:'FEHLER'> <body>Eine gemerkte Sitzung kann keine Adresse verknüpfen. Melde dich mit <value>/logout<body> ab und zuerst mit deinem Passwort an."
}
# Antworten von /recover. <minutes> ist, wie lange der Code gilt oder wann wieder einer angefordert werden darf.
recover {
  requested = "<good>Hat dieses Konto eine bestätigte Adresse, ging ein Code an sie. Schreib <value>/recover <code> <new password><good> innerhalb von <value><minutes><good> Minuten."
  cooldown = "<etag:'FEHLER'> <body>Von deiner Adresse wurden zuletzt zu viele Codes angefordert. Frag in <value><minutes><body> Minuten noch einmal."
