# uxmAuth screens.
#
# Where a player waits until they are in, and every screen they may be shown. A text that
# starts with @ is a line from the messages folder, read in the player's own language. Any
# other text is yours, in MiniMessage, drawn as you wrote it. Reorder a body, add a line to
# it, or point a label at your own words: nothing here is fixed by the code.
#
# When a release adds a key, the next start adds it here and keeps what you wrote.

# Where a player who has not logged in waits:
#
#   dialog       a dialog before the world, while the client is still connecting. The
#                player never stands in the world unchecked. Clients older than 1.21.6
#                cannot show it and fall back to frozen.
#   frozen       in the world, held still, with the commands and the dialogs there.
#   login-world  in an empty world of this plugin's own, moved back after the login.
waiting-room = "dialog"

# What closing the dialog does: kick, or world (into the frozen world, where the commands
# still work). Turning it to world lets a player stand in the world before logging in.
cancel = "kick"

# Whether Escape closes the dialog. Off, the dialog stays until the player answers or the
# timeout in config.conf runs out.
can-close = false

# A ten-key pad instead of a typed password. A pad server wants passwords of digits only:
# set passwords.allowed = "[0-9]+" in config.conf with it.
pin-pad = false

# Rules a player must accept before they register. Off, registration asks nothing.
rules {
  enabled = false
  lines   = ["@rules.line-1", "@rules.line-2"]
}

register {
  title    = "@screen.register.title"
  body     = ["@screen.register.body"]
  password = "@screen.register.password"
  confirm  = "@screen.register.confirm"
  accept   = "@screen.register.accept"
  submit   = "@screen.register.submit"
  cancel   = "@screen.register.cancel"
}

login {
  title    = "@screen.login.title"
  body     = ["@screen.login.body"]
  password = "@screen.login.password"
  submit   = "@screen.login.submit"
  cancel   = "@screen.login.cancel"
}

pin {
  title  = "@screen.pin.title"
  body   = ["@screen.pin.body"]
  erase  = "@screen.pin.erase"
  enter  = "@screen.pin.enter"
  cancel = "@screen.pin.cancel"
}
