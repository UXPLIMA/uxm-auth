# One account, as staff read it: /uxmauth info <player>.
#
# A menu is a file. Move a slot, change a material, take a tile out, and the plugin draws what
# you wrote. The words are in messages/, so the window reads in as many languages as this
# server has catalogues. A Bedrock player gets a form with the same facts instead.
#
# title        a key of the message catalogue, written with a leading @
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "10-16", and a list mixes both
# priority     which item wins a slot two of them ask for. The highest is drawn last
# click        what a left, a right, a shift left or a shift right click does
# list         the slots this item lays out are filled by the plugin, one row at a time
# view         who sees the item at all, as a list of conditions
#
# A tile is a tooltip in blocks: a title, the category under it, a description, the facts, and
# the line that says what a click does. It is written as a blank name and one lore line:
#
#   name = " "
#   lore = ["tile:0 @menu.info.account kind registered origin"]
#
# The word after "tile:" is the colour of the title: a place on the colour wheel of theme.conf.
# The key after it names a block of the catalogue, and every word after the key names one fact
# of that block, in the order they are drawn. Take a word off the line and the tile draws one
# fact fewer.
#
# The tokens this window knows:
#   %info_name%        the name of the account
#   %info_kind%        password, premium or Bedrock
#   %info_registered%  when it registered
#   %info_origin%      the address it registered from
#   %info_last%        its last login
#   %info_seen%        the address of its last login
#   %info_logins%      how many logins the history keeps
#   %info_app%         whether it asks an authenticator app
#   %info_backup%      how many backup codes are left
#   %info_mail%        whether the login code is mailed
#   %info_address%     its mail address, masked
#   %login_date%       in the login list: when
#   %login_address%    in the login list: from where
#   %login_method%     in the login list: the way in
#   %alt_name%         in the other accounts list: the name
#
# The conditions this window knows:
#   uxmauth:no-logins  the history keeps no login of this account
#   uxmauth:no-alts    no other account was seen on its addresses
#
# The actions this window knows:
#   uxmauth:open-alt   opens the account that was clicked, in this window
#   close, open:<menu>, command:<line>, message:<line>, sound:<name> <volume> <pitch>

title = "@menu.info.title"
rows = 5
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {

  account {
    slot = 11
    priority = 10
    material = WRITABLE_BOOK
    name = " "
    lore = ["tile:0 @menu.info.account kind registered origin"]
  }

  last {
    slot = 13
    priority = 10
    material = CLOCK
    name = " "
    lore = ["tile:1 @menu.info.last when address count"]
  }

  security {
    slot = 15
    priority = 10
    material = TRIPWIRE_HOOK
    name = " "
    lore = ["tile:2 @menu.info.security app backup mail address"]
  }

  # The latest logins, newest first. The row holds seven; staff.recent-logins in config.conf
  # says how many are read, and /uxmauth history lists them all.
  logins {
    slots = ["19-25"]
    priority = 5
    list {
      source = "uxmauth:logins"
      template {
        material = PAPER
        name = " "
        lore = ["tile:4 @menu.info.login address method"]
      }
    }
  }

  no-logins {
    slot = 22
    priority = 10
    view = ["uxmauth:no-logins"]
    material = GRAY_DYE
    name = " "
    lore = ["tile:4 @menu.info.no-logins"]
  }

  # The other accounts seen on the addresses this one used. A click reads that account here.
  alts {
    slots = ["28-34"]
    priority = 5
    list {
      source = "uxmauth:alts"
      template {
        material = NAME_TAG
        name = " "
        lore = ["tile:5 @menu.info.alt"]
        click { left = ["uxmauth:open-alt", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
      }
    }
  }

  no-alts {
    slot = 31
    priority = 10
    view = ["uxmauth:no-alts"]
    material = GRAY_DYE
    name = " "
    lore = ["tile:5 @menu.info.no-alts"]
  }

  filler {
    slots = ["0-44"]
    priority = 1
    material = GRAY_STAINED_GLASS_PANE
    name = " "
  }

  close {
    slot = 40
    priority = 10
    material = BARRIER
    name = "@menu.button.close"
    click { left = ["close", "sound:UI_BUTTON_CLICK 0.5 1.0"] }
  }
}
