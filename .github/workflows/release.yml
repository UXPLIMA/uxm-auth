name: Release

# A tag is the release. Pushing v0.0.1 builds that commit and publishes its jars, so what people download is
# exactly what the tag points at. The same jars then go to the store projects the repository names.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    # Each store step checks for the version first, so a re-run over a tag that is already out publishes nothing
    # twice.
    runs-on: ubuntu-24.04
    env:
      RELEASE_REPO: ${{ github.repository }}
      # Read through env so a step's `if` can ask whether they are set. A repository without them still cuts its
      # GitHub release, and a fork publishes nowhere.
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
      # The store projects, as repository variables. A project that is not named yet is skipped with a line that
      # says so, and its jar ships on the GitHub release only.
      MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
      MODRINTH_VELOCITY_PROJECT: ${{ vars.MODRINTH_VELOCITY_PROJECT }}
      HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
      HANGAR_VELOCITY_PROJECT: ${{ vars.HANGAR_VELOCITY_PROJECT }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties is the one place the version is written. A tag that names another number would publish
      # jars that call themselves something else, so it stops here.
      - name: The tag names the version
        run: |
          set -euo pipefail
          version="$(grep '^projectVersion=' gradle.properties | cut -d= -f2)"
          if [ "v${version}" != "$TAG" ]; then
            echo "the tag is $TAG and gradle.properties says $version"
            exit 1
          fi

      - name: Writing style
        run: scripts/check-style.sh

      - name: Verify
        run: ./gradlew build

      - name: Make sure jq is there
        run: |
          command -v jq > /dev/null && exit 0
          if command -v sudo > /dev/null; then sudo apt-get update -q && sudo apt-get install -yq jq
          else apt-get update -q && apt-get install -yq jq; fi

      # The changelog's section for this version is the release notes, so GitHub and both stores read the same text.
      - name: Prepare the release notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v head="## ${version}" '
            $0 == head { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "CHANGELOG.md has no section for ${version}"
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          jars=(
            "uxmAuth-paper/build/libs/uxmAuth-paper-${version}.jar"
            "uxmAuth-velocity/build/libs/uxmAuth-velocity-${version}.jar"
          )
          for jar in "${jars[@]}"; do
            [ -f "$jar" ] || { echo "missing release jar: $jar"; exit 1; }
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${jars[@]}" --clobber
          else
            gh release create "$TAG" "${jars[@]}" --verify-tag --title "$TAG" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi

      # The developer API goes to a Maven repository that is a branch of this repository, served over
      # raw.githubusercontent. Files are copied over the existing tree, so every earlier version stays resolvable.
      - name: Publish the API to the maven branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./gradlew :uxmAuth-api:publishApiPublicationToLocalRepoRepository
          tmp="$(mktemp -d)"
          git init -q "$tmp"
          git -C "$tmp" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$tmp" fetch -q --depth 1 origin maven; then
            git -C "$tmp" checkout -q -B maven FETCH_HEAD
          else
            git -C "$tmp" checkout -q --orphan maven
          fi
          cp -r build/maven-repo/. "$tmp/"
          git -C "$tmp" add -A
          if git -C "$tmp" diff --cached --quiet; then
            echo "the maven branch already carries ${TAG#v}, leaving it alone"
          else
            git -C "$tmp" -c user.name='uxplima-ci' -c user.email='ci@uxplima.com' \
              commit -q -m "publish the developer api ${TAG#v}"
            git -C "$tmp" push -q origin maven
          fi

      # Straight through the v2 API: a publishing action resolves game versions against a list of its own, and the
      # 26.x line is the kind of version such a list learns last.
      - name: Publish the jars to Modrinth
        if: env.MODRINTH_TOKEN != ''
        run: |
          set -euo pipefail
          version="${TAG#v}"
          publish() {
            project="$1"
            label="$2"
            jar="$3"
            loaders="$4"
            if [ -z "$project" ]; then
              echo "no modrinth project for $label yet, leaving it to the GitHub release"
              return
            fi
            # Modrinth lists the same version number twice rather than refusing it, so a re-run stops here.
            if curl -sS "https://api.modrinth.com/v2/project/${project}/version" \
                 | jq -e --arg v "$version" 'any(.[]; .version_number == $v)' > /dev/null; then
              echo "modrinth project $project already has $version, leaving it alone"
              return
            fi
            jq -n \
              --arg project "$project" \
              --arg name "$label $version" \
              --arg version "$version" \
              --rawfile changelog "${RUNNER_TEMP}/release-notes.md" \
              --argjson loaders "$loaders" \
              '{
                 project_id: $project,
                 name: $name,
                 version_number: $version,
                 changelog: $changelog,
                 version_type: "release",
                 loaders: $loaders,
                 game_versions: ["26.2"],
                 dependencies: [],
                 featured: true,
                 file_parts: ["file"],
                 primary_file: "file"
               }' > "${RUNNER_TEMP}/modrinth-data.json"
            echo "publishing $(basename "$jar") to modrinth project $project"
            curl -sS --fail-with-body -X POST https://api.modrinth.com/v2/version \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              -F "data=@${RUNNER_TEMP}/modrinth-data.json;type=application/json" \
              -F "file=@${jar}" \
              -o /dev/null
          }
          publish "${MODRINTH_PROJECT:-}" "uxmAuth" \
            "uxmAuth-paper/build/libs/uxmAuth-paper-${version}.jar" '["paper","folia","purpur"]'
          publish "${MODRINTH_VELOCITY_PROJECT:-}" "uxmAuth Velocity" \
            "uxmAuth-velocity/build/libs/uxmAuth-velocity-${version}.jar" '["velocity"]'

      - name: Publish the jars to Hangar
        if: env.HANGAR_TOKEN != ''
        run: |
          set -euo pipefail
          version="${TAG#v}"
          jwt="$(curl -sS --fail-with-body -X POST \
            "https://hangar.papermc.io/api/v1/authenticate?apiKey=${HANGAR_TOKEN}" | jq -r .token)"
          publish() {
            slug="$1"
            platform="$2"
            platform_versions="$3"
            jar="$4"
            if [ -z "$slug" ]; then
              echo "no hangar project for $(basename "$jar") yet, leaving it to the GitHub release"
              return
            fi
            existing="$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://hangar.papermc.io/api/v1/projects/${slug}/versions/${version}")"
            if [ "$existing" = "200" ]; then
              echo "hangar project $slug already has $version, leaving it alone"
              return
            fi
            # Hangar refuses an upload of 10000000 bytes or more, so a larger jar is listed by its release link.
            size="$(stat -c %s "$jar")"
            if [ "$size" -ge 10000000 ]; then
              url="https://github.com/${RELEASE_REPO}/releases/download/${TAG}/$(basename "$jar")"
              files="$(jq -n --arg platform "$platform" --arg url "$url" \
                '[{platforms: [$platform], externalUrl: $url}]')"
            else
              files="$(jq -n --arg platform "$platform" '[{platforms: [$platform]}]')"
            fi
            jq -n \
              --arg version "$version" \
              --arg platform "$platform" \
              --argjson platformVersions "$platform_versions" \
              --argjson files "$files" \
              --rawfile description "${RUNNER_TEMP}/release-notes.md" \
              '{
                 version: $version,
                 channel: "Release",
                 description: $description,
                 files: $files,
                 platformDependencies: {($platform): $platformVersions},
                 pluginDependencies: {}
               }' > "${RUNNER_TEMP}/hangar-data.json"
            echo "publishing $(basename "$jar") to hangar project $slug"
            if [ "$size" -ge 10000000 ]; then
              curl -sS --fail-with-body -X POST "https://hangar.papermc.io/api/v1/projects/${slug}/upload" \
                -H "Authorization: Bearer ${jwt}" \
                -F "versionUpload=@${RUNNER_TEMP}/hangar-data.json;type=application/json" \
                -o /dev/null
            else
              curl -sS --fail-with-body -X POST "https://hangar.papermc.io/api/v1/projects/${slug}/upload" \
                -H "Authorization: Bearer ${jwt}" \
                -F "versionUpload=@${RUNNER_TEMP}/hangar-data.json;type=application/json" \
                -F "files=@${jar}" \
                -o /dev/null
            fi
          }
          publish "${HANGAR_PROJECT:-}" PAPER '["26.2"]' \
            "uxmAuth-paper/build/libs/uxmAuth-paper-${version}.jar"
          publish "${HANGAR_VELOCITY_PROJECT:-}" VELOCITY '["3.4"]' \
            "uxmAuth-velocity/build/libs/uxmAuth-velocity-${version}.jar"
