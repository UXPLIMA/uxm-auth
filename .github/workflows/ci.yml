name: CI

# Runs the same gate that CLAUDE.md asks for locally, on a machine nobody has
# configured. The shaded jar is assembled here on purpose: a relocation problem
# only appears in the assembled artifact, and no unit test can see it. That is what
# each module's `verifyJar` does, and `./gradlew build` runs it through `check` - see the Build step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, uxplima]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Writing style
        run: scripts/check-style.sh

      - name: Documentation index
        run: scripts/check-docs.py

      # This assembles the shaded jar and verifies it: `assemble` depends on shadowJar, and `check`
      # depends on verifyJar, the task that opens the jar and fails on a package it must not carry.
      #
      # A SHELL COPY OF THAT CHECK WAS REMOVED FROM HERE, and it was not merely redundant: on this
      # runner it could not fail. It read `ls build/libs/*.jar | head -1`, and build.gradle.kts gives
      # the plain jar the `thin` classifier while shadowJar takes the empty one, so build/libs holds
      # both. Which one `head -1` picks is decided by the collation locale, and that was measured on a
      # real build rather than assumed: under C and C.UTF-8 `-thin.jar` sorts first, under
      # en_US.UTF-8 it sorts second, and the runner's container sets neither LANG nor LC_ALL
      # (LC_CTYPE="POSIX"). So the step was opening the thin jar, which bundles nothing at all (58
      # entries against the shaded jar's 968, measured in uxm-plugin-template), and neither
      # net/kyori nor an un-relocated com/uxplima/uxmlib could ever appear in it.
      #
      # verifyJar has no such hole. It takes shadowJar's own archiveFile rather than a glob, checks
      # the whole forbidden list instead of two prefixes, also asserts the entries the jar MUST carry
      # (a jar that bundles nothing fails it, which is the opposite error the shell step is blind to),
      # and reads the archive with ZipFile, so there is no pipeline and no SIGPIPE race to lose.
      # Proven, not trusted: the uxmLib relocate() call was removed and verifyJar failed with
      # `com/uxplima/uxmlib/ (419 entries)`, then restored and the build went green again.
      - name: Build
        run: ./gradlew build

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          # Per module, not the root: the root project has no tests.
          path: '*/build/reports/tests/'
          retention-days: 7
