# Pin UTF-8 and en-US so that Spotless and Palantir format identically on every
# machine and on CI, whatever the host charset and locale are.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Xmx2G

org.gradle.parallel=true
org.gradle.caching=true

# The configuration cache is off on purpose. It does not restore the Spotless
# formatter worker classloaders, which then fail with a NoClassDefFoundError on
# a cache hit. Parallel plus the build cache give most of the speed without that.
org.gradle.configuration-cache=false

# The release version, written here and nowhere else. A tag v<version> publishes it.
projectVersion=0.0.6
