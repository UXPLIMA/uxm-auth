name: uxmTemplate
version: '${version}'
main: com.uxplima.template.bootstrap.TemplatePlugin
api-version: '26.2'
authors: ['UXPLIMA']
description: 'The starting point for a UXPLIMA plugin.'
website: 'https://github.com/UXPLIMA/uxm-plugin-template'

# Every scheduler call goes through the uxmLib Scheduler port, which routes to the
# right global, region, entity or async scheduler. Nothing calls BukkitScheduler.
folia-supported: true

# Optional integrations. The plugin runs fully without any of them, because every
# third-party symbol is reached only past a plugin-present guard.
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false

permissions:
  # What a player has by default. The template ships the two verbs a player is expected to
  # have, so a plugin copied from it starts with the right shape rather than with everything
  # behind op.
  uxmtemplate.language:
    description: Choose the language you read this plugin in
    default: true
  uxmtemplate.example.list:
    description: Read the example list this template ships
    default: true

  # What a server grants rather than gives: anything that writes.
  uxmtemplate.example.create:
    description: Add to the example list this template ships
    default: op

  # What an operator does. Off unless the server grants it, and admin.* grants the family
  # in one line.
  uxmtemplate.admin.*:
    description: Everything an operator does with this plugin
    default: op
  uxmtemplate.admin.doctor:
    description: Ask how this plugin is
    default: op
  uxmtemplate.admin.version:
    description: Read the version this server runs
    default: op
  uxmtemplate.admin.reload:
    description: Read the configuration again
    default: op
