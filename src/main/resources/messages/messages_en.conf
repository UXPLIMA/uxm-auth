# English message catalog. Every line is MiniMessage.
#
# A key that is missing here falls back to the default that the code carries, so the
# plugin can never show an empty message. Delete a line to take the default back.

prefix = "<gradient:#5eead4:#38bdf8><bold>uxm</bold></gradient> <dark_gray>|</dark_gray> "

admin {
  version       = "<gray>uxmTemplate <white><version></white>"
  reloaded      = "<green>Configuration reloaded in <white><ms></white> ms."
  reload-failed = "<red>The reload failed. Read the console for the reason."
}

error {
  no-permission = "<red>You do not have permission to do that."
  player-only   = "<red>Only a player can run this command."
  invalid-name  = "<red>A name uses lower-case letters, digits and a hyphen only."
}

example {
  created    = "<green>Created <white><name></white>."
  exists     = "<red>You already have <white><name></white>."
  limit      = "<red>You have reached your limit of <white><limit></white>."
  list-empty = "<gray>You have nothing yet."
  list       = "<gray>Yours: <white><names></white>"
}
