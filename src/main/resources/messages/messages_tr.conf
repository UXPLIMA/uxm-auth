# Turkish message catalog. Every line is MiniMessage.
#
# A key that is missing here falls back to English, and then to the default that the
# code carries. Delete a line to take the English text back.

prefix = "<gradient:#5eead4:#38bdf8><bold>uxm</bold></gradient> <dark_gray>|</dark_gray> "

admin {
  version       = "<gray>uxmTemplate <white><version></white>"
  reloaded      = "<green>Ayarlar <white><ms></white> ms icinde yeniden yuklendi."
  reload-failed = "<red>Yeniden yukleme basarisiz. Nedeni konsolda."
}

error {
  no-permission = "<red>Bunu yapma yetkin yok."
  player-only   = "<red>Bu komutu sadece bir oyuncu calistirabilir."
  invalid-name  = "<red>Bir isim sadece kucuk harf, rakam ve tire icerir."
}

example {
  created    = "<green><white><name></white> olusturuldu."
  exists     = "<red><white><name></white> zaten var."
  limit      = "<red><white><limit></white> sinirina ulastin."
  list-empty = "<gray>Henuz hicbir seyin yok."
  list       = "<gray>Senin: <white><names></white>"
}
