# uxmTemplate configuration.
#
# Every value here is read on enable and on /uxmtemplate reload. The plugin swaps in
# the new file as one snapshot, so a reload is never half applied.

# The locale that a player gets when the client reports none, and the fallback for a
# key that a translation has not reached yet. A catalog lives in messages/.
locale = "en"

example {
  # How many examples one player may hold.
  limit = 3
}
