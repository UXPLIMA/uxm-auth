# Rename, alias, or disable any command without touching the code.
#
# The key on the left never changes. Only the values do.
# A change here needs a server restart: the server builds its command tree once,
# at enable, and offers no supported way to rename a live command.
#
# The operator command of every plugin we ship answers to "<player command>admin" as well, so
# an operator who knows the command a player types can always reach the operator one. Rename
# either of them here and that pairing is yours to keep.
#
# name    the label that a player types, without the slash
# aliases other labels that reach the same command
# enabled set to false and the command is never registered

commands {
  example {
    name    = "example"
    aliases = ["ex"]
    enabled = true
  }

  uxmtemplate {
    name    = "uxmtemplate"
    aliases = ["uxmt", "exampleadmin"]
    enabled = true
  }
}
