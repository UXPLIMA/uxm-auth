# The colours of this plugin.
#
# Every message and every menu names a role, never a colour: a number is "value", a warning
# is "warn", the brand is "accent". Change a value here and the whole plugin follows. This is
# the only file that holds a colour code.
#
# The roles are the same in every UXPLIMA plugin, so a server that changes one plugin can
# copy this file to the others.

colours {
  # The brand. It carries the prefix of a message, a header and the accent of a menu.
  accent  = "#38b6ff"

  # The reading colours. Body is the text of a message, subtext is a description in a menu,
  # muted is a counter or a date, dim is a separator or a thing that cannot be used.
  body    = "#ffffff"
  subtext = "#dde8f0"
  muted   = "#93a4b3"
  dim     = "#6b7886"

  # The furniture of a menu: the glyph at the start of a line, and the category line under a
  # title.
  icon    = "#8a93a1"
  crumb   = "#565f6b"

  # A name, a number, a duration, an amount of anything that is not money.
  value   = "#8fd9ff"

  # The three reflexes. Do not break them: green is positive, red is negative, gold wants
  # attention.
  good    = "#5be38c"
  bad     = "#ff6b6b"
  warn    = "#ffc93c"

  # Money, a level and the word "click" are gold as well. They are separate roles so that you
  # can move one of them without moving the others.
  money   = "#ffc93c"
  level   = "#ffc93c"
  cta     = "#ffc93c"

  # A neutral note, a rank, and an event or a bonus.
  info    = "#4fd6e8"
  rank    = "#b68cff"
  event   = "#ff8fd0"
}

prefix {
  # A message opens with the name of the feature, then this glyph, then the sentence.
  separator = "▶"

  # The colour of a category. The name on the left is the word in the message file, and the
  # value on the right is a role from the block above. A category that is not named here
  # reads in the accent colour.
  categories {
    error = "bad"
    money = "good"
    shop  = "good"
    event = "event"
  }
}

# Small capitals are the writing of the interface: ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀꜱᴛᴜᴠᴡxʏᴢ.
#
# They exist for the Latin alphabet only. Turkish needs six letters that have no small
# capital form, so Turkish keeps its own letters and its own lower case. Turn this on for a
# language only when every letter of that language has a small capital.
small-caps {
  en = true
  tr = false
}
