# The look of this server: the colours, the glyphs, and the writing of the interface.
#
# Every message and every menu names a role, never a colour: a number is "value", a warning is
# "warn", the brand is "accent". Change a value here and the whole plugin follows. This is the
# only file that holds a colour code, and a role left out below keeps its shipped value.
#
# The palette is the smooth pastel rainbow: seven colours of the same softness, each with one
# job, on the neutrals a tooltip is drawn in. It replaced a single blue brand family, which
# painted the accent, the values and the section headers in three shades of the same blue and
# left a menu with nothing warm in it.

colours {
  # The brand. It carries the prefix of a message, a header, and the accent of a menu.
  # Sky Aqua: the coolest of the seven, so a prefix recedes and the words after it read first.
  accent  = "#48CAE4"

  # The reading colours. Body is the text of a message, subtext a description in a menu, muted
  # a counter or a date, dim a separator or something that cannot be used.
  body    = "#FFFFFF"
  subtext = "#DDE8F0"
  muted   = "#9AA5BE"
  dim     = "#6B7886"

  # The furniture of a menu: the glyph at the start of a line, and the category line under a
  # title.
  icon    = "#8A93A1"
  crumb   = "#565F6B"

  # A name, a number, a duration, an amount of anything that is not money.
  # Buttercup Glow. A value is the thing a player came to read, so it is the one warm colour
  # that appears in every line of every screen.
  value   = "#FFE66D"

  # The three reflexes. Mint is positive, strawberry is negative, peach wants attention.
  # Peach rather than the yellow the master palette gives a warning: a warning that reads in
  # the same colour as a value is a warning nobody sees.
  good    = "#4ECCA3"
  bad     = "#FF6B8B"
  warn    = "#FFA07A"

  # Money and the word "click" are the same buttercup as a value. A level is lavender, with a
  # rank, because a level is a rank you earned. Separate roles so that one can move without
  # the others.
  money   = "#FFE66D"
  level   = "#B388FF"
  cta     = "#FFE66D"

  # A neutral note and the header of a lore block, a rank, and an event or a bonus.
  info    = "#4FD6E8"
  rank    = "#B388FF"
  event   = "#6C8DFB"
}

# Named gradients. A heading painted across two colours is what makes it read as finished
# rather than merely coloured; leave a name out and whatever uses it stays a flat colour. One
# stop is a flat colour too, which is how you switch a gradient off without deleting the key.
#
# "header" is the one name the library asks for. It paints a <h:'TITLE'> token: the header of a
# lore block, a chat heading, and a menu tile title that names nothing else. Ours is the warm
# sweep, because a screen whose prefixes and headers are cool needs one large warm piece of
# colour on it.
#
# "brand" is the network's own name, the seven colours in order. Nothing reads it on its own
# yet: a file that wants the full rainbow still writes the seven colours out, and it is here so
# that both lists move together when the palette does.
#
# Everything after them is a colour a title may take. A menu names one for each tile, so a
# screen of twelve tiles reads as twelve headings rather than as one heading twelve times, and
# a line names one after its label: <h:'REWARDS':mint>. Two tiles look alike only when the file
# asked them to.
#
# The first seven are short arcs of the palette wheel, each between two colours that sit beside
# each other, so the pair reads as one colour with a light in it. The last seven skip a colour,
# so they travel further and read as two. Fourteen is not a limit: add a pair of your own and a
# menu may name it the next day.
gradients {
  header = ["#FFE66D", "#FFA07A", "#FF6B8B"]
  brand  = ["#FF6B8B", "#FFA07A", "#FFE66D", "#4ECCA3", "#48CAE4", "#6C8DFB", "#B388FF"]

  # Short arcs: rose, peach, buttercup, mint, aqua, cornflower, lavender, each into the next.
  strawberry = ["#FF6B8B", "#FFA07A"]
  peach      = ["#FFA07A", "#FFE66D"]
  buttercup  = ["#FFE66D", "#4ECCA3"]
  mint       = ["#4ECCA3", "#48CAE4"]
  aqua       = ["#48CAE4", "#6C8DFB"]
  periwinkle = ["#6C8DFB", "#B388FF"]
  lavender   = ["#B388FF", "#FF6B8B"]

  # Wide arcs: the same wheel, one colour skipped, for a screen that needs more than seven.
  sunrise    = ["#FF6B8B", "#FFE66D"]
  melon      = ["#FFA07A", "#4ECCA3"]
  shore      = ["#FFE66D", "#48CAE4"]
  reef       = ["#4ECCA3", "#6C8DFB"]
  twilight   = ["#48CAE4", "#B388FF"]
  berry      = ["#6C8DFB", "#FF6B8B"]
  dusk       = ["#B388FF", "#FFA07A"]
}

# The glyphs the structure is drawn with. They are furniture rather than words, which is why
# they live here and not in a language file: changing one changes every plugin at once, and a
# translator never has to copy a character they cannot type.
glyphs {
  separator   = "▶"   # between a message's category word and the sentence
  title       = "◆"   # the first line of a menu tile
  description = "✎"   # the description header of a tile
  details     = "≡"   # the details header of a tile
  row         = "•"   # one fact under the details header
  status      = "•"   # one state under the details header
  action      = "→"   # the line that says what a click does
}

prefix {
  # The colour of a category. The name on the left is the word in the message file, the value
  # on the right is a role from the block above. A category that is not named here reads in
  # the accent colour.
  categories {
    error = "bad"
    money = "good"
    shop  = "good"
    event = "event"
  }
}

# Small capitals are the writing of the interface: ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀꜱᴛᴜᴠᴡxʏᴢ.
#
# They exist for the Latin alphabet only. A language whose letters have no small-capital form
# keeps its own writing, so turn this on for a language only when every letter of it converts.
# Turkish needs six letters that have none, so Turkish keeps its own writing.
# A language this file does not name keeps the shipped answer: English is converted, every
# other language is not.
small-caps {
  en = true
  tr = false
}
