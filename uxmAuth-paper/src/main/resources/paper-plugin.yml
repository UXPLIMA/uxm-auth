name: uxmAuth
version: '${version}'
main: com.uxplima.auth.paper.bootstrap.AuthPlugin
api-version: '26.2'
authors: ['UXPLIMA']
description: 'Registration, login and premium identity, on one server or a whole network.'
website: 'https://github.com/UXPLIMA/uxm-auth'

# Every scheduler call goes through the uxmLib Scheduler port, which routes to the
# right global, region, entity or async scheduler. Nothing calls BukkitScheduler.
folia-supported: true

# Optional integrations. The plugin runs fully without any of them, because every
# third-party symbol is reached only past a plugin-present guard.
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
    # The economy an operator's [take-money] and [give-money] lines read, through Vault when the server
    # has it. Without Vault those lines are skipped and every other line runs.
    Vault:
      load: BEFORE
      required: false
    # Tells a client older than 1.21.6, which cannot draw the dialog before the world, so it waits in
    # the world with the commands instead. Without ViaVersion only this server's own version joins.
    ViaVersion:
      load: BEFORE
      required: false
    # Vouches for a Bedrock player through Xbox Live, and carries the native forms they read every
    # screen in. Reached only past a plugin-present check: without it every player is a Java one.
    floodgate:
      load: BEFORE
      required: false
    # Geyser without Floodgate still names a Bedrock connection for uxmLib's form sender, which asks for it
    # by name. Nothing here needs it.
    Geyser-Spigot:
      load: BEFORE
      required: false

permissions:
  # What a player has by default.
  uxmauth.language:
    description: Choose the language you read this plugin in
    default: true
  uxmauth.login:
    description: Log in with a password
    default: true
  uxmauth.register:
    description: Make an account with a password
    default: true
  uxmauth.logout:
    description: Log out and wait at the door again
    default: true
  uxmauth.claim:
    description: Say a name is yours, and prove it on the next connection
    default: true
  uxmauth.premium:
    description: Prove your name on the next connection and log in without a password from then on
    default: true
  uxmauth.captcha:
    description: Answer the captcha with the code you were shown
    default: true
  uxmauth.session:
    description: Choose whether a join from the same address skips the password
    default: true
  uxmauth.2fa:
    description: Turn a code from an authenticator app after the password on and off
    default: true
  uxmauth.recover:
    description: Set a forgotten password by a code mailed to the linked address
    default: true
  uxmauth.email:
    description: Link an address a forgotten password is sent to
    default: true
  uxmauth.changepassword:
    description: Change your own password
    default: true

  # What an operator does. Off unless the server grants it, and admin.* grants the family
  # in one line.
  uxmauth.admin.*:
    description: Everything an operator does with this plugin
    default: op
  uxmauth.admin.doctor:
    description: Ask how this plugin is
    default: op
  uxmauth.admin.version:
    description: Read the version this server runs
    default: op
  uxmauth.admin.reload:
    description: Read the configuration again
    default: op
  uxmauth.admin.info:
    description: Read what is known of an account, and the other accounts on its addresses
    default: op
  uxmauth.admin.history:
    description: Read the latest logins of an account
    default: op
  uxmauth.admin.forcelogin:
    description: Let a waiting player in past the login
    default: op
  uxmauth.admin.unban:
    description: Lift the ban on an address
    default: op
  uxmauth.admin.unregister:
    description: Remove an account; from the console only unless staff.in-game opens it
    default: op
  uxmauth.admin.setpassword:
    description: Set an account's password; from the console only unless staff.in-game opens it
    default: op
  uxmauth.admin.language:
    description: Set or clear the language another player reads
    default: op
